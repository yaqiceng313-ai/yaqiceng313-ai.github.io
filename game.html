<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星际战机 - Star Fighter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#050510;display:flex;justify-content:center;align-items:center;
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Courier New',monospace;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#gc{
  --scale:1;
  position:relative;overflow:hidden;
  border:2px solid #00f0ff33;
  box-shadow:0 0 40px #00f0ff22,0 0 80px #ff00ff11,inset 0 0 40px #00000088;border-radius:4px;
}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}

#menu{
  position:absolute;top:0;left:0;width:100%;height:100%;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#0a0a2e 0%,#050510 70%);z-index:20;
}
.mt{font-size:calc(var(--scale)*42px);font-weight:bold;color:#00f0ff;text-shadow:0 0 calc(var(--scale)*20px) #00f0ff,0 0 calc(var(--scale)*40px) #00f0ff88;letter-spacing:calc(var(--scale)*8px);margin-bottom:calc(var(--scale)*4px);animation:tg 2s ease-in-out infinite alternate}
.ms{font-size:calc(var(--scale)*14px);color:#ff00ff;text-shadow:0 0 calc(var(--scale)*10px) #ff00ff88;letter-spacing:calc(var(--scale)*6px);margin-bottom:calc(var(--scale)*40px)}
@keyframes tg{0%{text-shadow:0 0 calc(var(--scale)*20px) #00f0ff,0 0 calc(var(--scale)*40px) #00f0ff88}100%{text-shadow:0 0 calc(var(--scale)*30px) #00f0ff,0 0 calc(var(--scale)*60px) #00f0ff,0 0 calc(var(--scale)*90px) #ff00ff66}}
.mb{width:calc(var(--scale)*200px);padding:calc(var(--scale)*12px) 0;margin:calc(var(--scale)*8px) 0;font-size:calc(var(--scale)*16px);font-family:inherit;color:#00f0ff;background:transparent;border:1px solid #00f0ff66;cursor:pointer;letter-spacing:calc(var(--scale)*4px);transition:all .3s}
.mb:hover{background:#00f0ff15;border-color:#00f0ff;box-shadow:0 0 calc(var(--scale)*20px) #00f0ff44,inset 0 0 calc(var(--scale)*20px) #00f0ff11;text-shadow:0 0 calc(var(--scale)*10px) #00f0ff}
.mb:active{transform:scale(.96)}
.mhs{margin-top:calc(var(--scale)*30px);font-size:calc(var(--scale)*13px);color:#ffd700;text-shadow:0 0 calc(var(--scale)*10px) #ffd70044;letter-spacing:calc(var(--scale)*2px)}
.mc{margin-top:calc(var(--scale)*40px);font-size:calc(var(--scale)*11px);color:#8899aa;text-align:center;line-height:1.8;letter-spacing:calc(var(--scale)*1px)}
.mc span{color:#00f0ff}

#hud{position:absolute;top:0;left:0;width:100%;padding:calc(var(--scale)*8px) calc(var(--scale)*12px);display:none;z-index:15;pointer-events:none}
.ht{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--scale)*12px);color:#fff;text-shadow:0 0 calc(var(--scale)*6px) #00f0ff88}
.hl{color:#ff4466;letter-spacing:calc(var(--scale)*2px)}.hsh{color:#00ccff;margin-left:calc(var(--scale)*8px)}.hb{color:#ff8800;margin-left:calc(var(--scale)*8px)}
.hsc{font-size:calc(var(--scale)*14px);color:#ffd700;text-shadow:0 0 calc(var(--scale)*8px) #ffd70088}.hco{font-size:calc(var(--scale)*11px);color:#00ff88;margin-left:calc(var(--scale)*8px)}
.hb2{position:absolute;bottom:calc(var(--scale)*8px);left:0;width:100%;display:flex;justify-content:center;gap:calc(var(--scale)*8px);font-size:calc(var(--scale)*10px);color:#8899aa;text-shadow:0 0 calc(var(--scale)*4px) #00f0ff44}
.hsk{padding:calc(var(--scale)*4px) calc(var(--scale)*10px);border:1px solid #00f0ff33;border-radius:2px;letter-spacing:calc(var(--scale)*1px)}
.hsk.rdy{color:#00f0ff;border-color:#00f0ff88;text-shadow:0 0 calc(var(--scale)*6px) #00f0ff}

#bhp{display:none;position:absolute;top:calc(var(--scale)*28px);left:50%;transform:translateX(-50%);width:80%;z-index:16;pointer-events:none}
.bn{font-size:calc(var(--scale)*11px);color:#ff4466;text-align:center;text-shadow:0 0 calc(var(--scale)*8px) #ff446688;letter-spacing:calc(var(--scale)*3px);margin-bottom:calc(var(--scale)*4px)}
.bho{height:calc(var(--scale)*8px);background:#ffffff15;border:1px solid #ff446644;border-radius:2px;overflow:hidden}
.bhi{height:100%;background:linear-gradient(90deg,#ff2244,#ff4466,#ff6688);box-shadow:0 0 calc(var(--scale)*10px) #ff446688;transition:width .3s}

#warn{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:calc(var(--scale)*28px);color:#ff2244;text-shadow:0 0 calc(var(--scale)*30px) #ff2244,0 0 calc(var(--scale)*60px) #ff224488;letter-spacing:calc(var(--scale)*8px);z-index:18;pointer-events:none;animation:wp .5s ease-in-out infinite alternate}
@keyframes wp{0%{opacity:.5;transform:translate(-50%,-50%) scale(.95)}100%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}

#pause{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#000c;z-index:25;flex-direction:column;align-items:center;justify-content:center}
.pt{font-size:calc(var(--scale)*32px);color:#00f0ff;text-shadow:0 0 calc(var(--scale)*20px) #00f0ff88;letter-spacing:calc(var(--scale)*8px);margin-bottom:calc(var(--scale)*30px)}

#go{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#000e;z-index:25;flex-direction:column;align-items:center;justify-content:center}
.got{font-size:calc(var(--scale)*28px);color:#ff4466;text-shadow:0 0 calc(var(--scale)*20px) #ff446688;letter-spacing:calc(var(--scale)*6px);margin-bottom:calc(var(--scale)*4px)}
.gosl{font-size:calc(var(--scale)*12px);color:#8899aa;letter-spacing:calc(var(--scale)*3px);margin-top:calc(var(--scale)*16px)}
.gos{font-size:calc(var(--scale)*36px);color:#ffd700;text-shadow:0 0 calc(var(--scale)*15px) #ffd70088;letter-spacing:calc(var(--scale)*4px);margin-bottom:calc(var(--scale)*8px)}
.gonr{font-size:calc(var(--scale)*14px);color:#ff8800;text-shadow:0 0 calc(var(--scale)*10px) #ff880088;letter-spacing:calc(var(--scale)*3px);animation:tg 1s ease-in-out infinite alternate;margin-bottom:calc(var(--scale)*8px)}
.gost{font-size:calc(var(--scale)*12px);color:#8899aa;text-align:center;line-height:2;letter-spacing:calc(var(--scale)*2px);margin-bottom:calc(var(--scale)*20px)}
.gost span{color:#00f0ff}
.gog{font-size:calc(var(--scale)*32px);margin-bottom:calc(var(--scale)*20px);letter-spacing:calc(var(--scale)*6px)}

#mc{display:none;position:absolute;bottom:calc(var(--scale)*50px);left:0;width:100%;z-index:16;pointer-events:none}
.mob{pointer-events:auto;position:absolute;width:calc(var(--scale)*56px);height:calc(var(--scale)*56px);border-radius:50%;border:1px solid #00f0ff44;background:#00f0ff10;color:#00f0ff88;font-size:calc(var(--scale)*20px);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.mob:active{background:#00f0ff33}
#bb{bottom:calc(var(--scale)*10px);right:calc(var(--scale)*20px)}#bs{bottom:calc(var(--scale)*10px);right:calc(var(--scale)*90px)}
@media(max-width:500px),(pointer:coarse){#mc{display:block}}

/* 音频控制 */
#ac{display:none;position:absolute;top:calc(var(--scale)*8px);right:calc(var(--scale)*12px);z-index:30;pointer-events:auto}
#ac .abtn{width:calc(var(--scale)*28px);height:calc(var(--scale)*28px);background:#00f0ff15;border:1px solid #00f0ff44;color:#00f0ff88;font-size:calc(var(--scale)*14px);cursor:pointer;border-radius:3px;display:flex;align-items:center;justify-content:center;transition:all .3s;margin-left:calc(var(--scale)*4px)}
#ac .abtn:hover{background:#00f0ff22;border-color:#00f0ff;color:#00f0ff}
#ac .abtn.muted{color:#ff446688;border-color:#ff446644}
#audio-start{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:35;pointer-events:auto}
#audio-start .asbtn{padding:calc(var(--scale)*10px) calc(var(--scale)*20px);font-size:calc(var(--scale)*13px);font-family:inherit;color:#4488ff;background:#0a1a2a;border:1px solid rgba(0,240,255,0.4);cursor:pointer;letter-spacing:calc(var(--scale)*2px);border-radius:3px;transition:all .3s}
#audio-start .asbtn:hover{background:#0f2a40;box-shadow:0 0 calc(var(--scale)*20px) rgba(0,240,255,0.2)}
#audio-start .asbtn .asicon{font-size:calc(var(--scale)*20px)}
</style>
</head>
<body>
<div id="gc">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="menu">
      <div class="mt">星 际 战 机</div><div class="ms">STAR FIGHTER</div>
      <button class="mb" id="bstart">开 始 游 戏</button>
      <div class="mhs" id="mhs">最高分：0</div>
      <div class="mc"><span>↑↓←→/WASD</span> 移动 | <span>空格</span> 闪现<br><span>B</span> 炸弹 | <span>ESC</span> 暂停</div>
    </div>
    <div id="hud">
      <div class="ht"><div><span class="hl" id="hl">♥♥♥</span><span class="hsh" id="hsh"></span><span class="hb" id="hb">💣×3</span></div><div><span class="hsc" id="hsc">0</span><span class="hco" id="hco"></span></div></div>
      <div class="hb2"><span class="hsk rdy" id="hskd">闪现 就绪</span><span class="hsk rdy" id="hskb">炸弹 [B]</span></div>
    </div>
    <div id="bhp"><div class="bn" id="bn">虚空守护者</div><div class="bho"><div class="bhi" id="bhi" style="width:100%"></div></div></div>
    <div id="warn">⚠ 警告 ⚠</div>
    <div id="pause"><div class="pt">暂 停</div><button class="mb" id="bresume">继 续 游 戏</button><button class="mb" id="bquit">退 出</button></div>
    <div id="go">
      <div class="got">战 机 陨 落</div><div class="gosl">最终得分</div><div class="gos" id="gosc">0</div>
      <div class="gonr" id="gonr" style="display:none">🏆 新纪录！</div>
      <div class="gost" id="gost"></div><div class="gog" id="gog"></div>
      <button class="mb" id="brestart">再 来 一 局</button><button class="mb" id="bmenu">返 回 菜 单</button>
    </div>
    <div id="mc"><div class="mob" id="bb">💣</div><div class="mob" id="bs">⚡</div></div>
    <div id="ac">
      <button class="abtn" id="abtn-mute" title="静音">♪</button>
    </div>
    <div id="audio-start">
      <button class="asbtn" id="asbtn-start"><span class="asicon">🔊</span>启动音频</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ========== CONFIG (横版 800×480) ==========
var CFG = {
  BW: 800, BH: 480,
  PA: { x: 30, y: 30, w: 740, h: 420 },
  PS: 300, PSZ: [28, 32], PFR: 140, PIT: 2000, PML: 5, PMH: 3, PMS: 100,
  BS: 650, EBS: -220,
  SII: 1800, SIM: 400, DRR: 0.4, BST: 120000,
  CT: 2500, DC: 3000, DD: 120, DDUR: 150,
  BMAX: 3, BDMG: 50,
  SH: { ph: { i: 3, d: 100 }, bomb: { i: 8, d: 300 }, be: { i: 15, d: 500 }, bp: { i: 5, d: 200 }, ee: { i: 2, d: 60 } },
  CL: { bg: '#0a0a1a', neon: '#00f0ff', mag: '#ff00ff', danger: '#ff2244', gold: '#ffd700', pb: '#00ffcc', eb: '#ff4444', sh: '#00ccff' }
};

// ========== UTILS ==========
var U = {
  r: function(a, b) { return Math.random() * (b - a) + a; },
  ri: function(a, b) { return Math.floor(U.r(a, b + 1)); },
  cl: function(v, a, b) { return Math.max(a, Math.min(b, v)); },
  dist: function(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); },
  ang: function(x1, y1, x2, y2) { return Math.atan2(y2 - y1, x2 - x1); },
  lerp: function(a, b, t) { return a + (b - a) * t; }
};

// ========== OBJECT POOL ==========
function Pool(createFn, resetFn, initialSize) {
  this.pool = [];
  this.createFn = createFn;
  this.resetFn = resetFn;
  initialSize = initialSize || 50;
  for (var i = 0; i < initialSize; i++) { this.pool.push(createFn()); }
}
Pool.prototype.acquire = function() {
  if (this.pool.length > 0) { return this.pool.pop(); }
  return this.createFn();
};
Pool.prototype.release = function(obj) { this.resetFn(obj); this.pool.push(obj); };

// ========== STORAGE ==========
var S = {
  get: function(k, d) {
    try { var v = localStorage.getItem('sf_' + k); return v !== null ? JSON.parse(v) : d; }
    catch (e) { return d; }
  },
  set: function(k, v) {
    try { localStorage.setItem('sf_' + k, JSON.stringify(v)); } catch (e) {}
  }
};

// ========== INPUT ==========
function Input() {
  this.keys = {}; this.jp = {}; this.ta = false; this.tx = 0; this.ty = 0; this.tdx = 0; this.tdy = 0;
  this._bind();
}
Input.prototype._bind = function() {
  var self = this;
  window.addEventListener('keydown', function(e) {
    if (!self.keys[e.code]) { self.jp[e.code] = true; }
    self.keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyB','Escape'].indexOf(e.code) !== -1) { e.preventDefault(); }
  });
  window.addEventListener('keyup', function(e) { self.keys[e.code] = false; });
  window.addEventListener('blur', function() { self.keys = {}; });
  var cv = document.getElementById('cv');
  cv.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0], r = cv.getBoundingClientRect();
    self.ta = true; self.tx = t.clientX - r.left; self.ty = t.clientY - r.top;
    self.tdx = 0; self.tdy = 0;
  }, { passive: false });
  cv.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var t = e.touches[0], r = cv.getBoundingClientRect();
    var nx = t.clientX - r.left, ny = t.clientY - r.top;
    self.tdx = nx - self.tx; self.tdy = ny - self.ty;
    self.tx = nx; self.ty = ny;
  }, { passive: false });
  cv.addEventListener('touchend', function(e) {
    e.preventDefault();
    self.ta = false; self.tdx = 0; self.tdy = 0;
  }, { passive: false });
};
Input.prototype.isDown = function(c) { return !!this.keys[c]; };
Input.prototype.wasPressed = function(c) {
  if (this.jp[c]) { this.jp[c] = false; return true; }
  return false;
};
Input.prototype.getMovement = function() {
  var dx = 0, dy = 0;
  if (this.isDown('ArrowLeft') || this.isDown('KeyA')) { dx = -1; }
  if (this.isDown('ArrowRight') || this.isDown('KeyD')) { dx = 1; }
  if (this.isDown('ArrowUp') || this.isDown('KeyW')) { dy = -1; }
  if (this.isDown('ArrowDown') || this.isDown('KeyS')) { dy = 1; }
  if (this.ta) { dx = U.cl(this.tdx * 0.8, -1, 1); dy = U.cl(this.tdy * 0.8, -1, 1); }
  if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
  return { dx: dx, dy: dy };
};
Input.prototype.clearFrame = function() { this.jp = {}; this.tdx = 0; this.tdy = 0; };

// ========== AUDIO ENGINE ==========
function AudioManager() {
  this.masterGain = null;
  this.musicGain = null;
  this.sfxGain = null;
  this.envGain = null;
  this.ctx = null;
  this.enabled = false;
  this.initialized = false;
  this.musicVol = 0.5;
  this.sfxVol = 0.6;
  this.envVol = 0.3;
  this.muted = false;

  // BGM状态
  this.musicState = 'ambient'; // ambient | explore | battle | boss
  this.musicTarget = 'ambient';
  this.musicFadeTime = 0;
  this.musicFadeDuration = 1.5;
  this.musicNodes = {};

  // 音效池
  this.sfxPool = [];
  this.maxSfx = 12;

  // 环境音
  this.envNodes = null;

  // 空间效果
  this.reverbNode = null;
  this.reverbGain = null;

  this._init();
}

AudioManager.prototype._init = function() {
  try {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { return; }

  // 主控
  this.masterGain = this.ctx.createGain();
  this.masterGain.gain.value = 0.8;
  this.masterGain.connect(this.ctx.destination);

  // 分轨
  this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0;
  this.musicGain.connect(this.masterGain);
  this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = this.sfxVol;
  this.sfxGain.connect(this.masterGain);
  this.envGain = this.ctx.createGain(); this.envGain.gain.value = 0;
  this.envGain.connect(this.masterGain);

  // 简易混响（延迟网络模拟）
  this._setupReverb();

  this.initialized = true;
};

AudioManager.prototype._setupReverb = function() {
  this.reverbGain = this.ctx.createGain();
  this.reverbGain.gain.value = 0.15;
  this.reverbGain.connect(this.sfxGain);
  var delays = [0.023, 0.037, 0.051, 0.067, 0.079, 0.097];
  for (var i = 0; i < delays.length; i++) {
    var d = this.ctx.createDelay(0.1);
    d.delayTime.value = delays[i];
    var g = this.ctx.createGain();
    g.gain.value = 0.12 / (i + 1);
    var f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 2000 - i * 300;
    d.connect(f); f.connect(g); g.connect(this.reverbGain);
    d.connect(this.reverbGain);
    this.reverbNode = d;
  }
};

AudioManager.prototype._ensure = function() {
  if (!this.initialized || !this.ctx) { return false; }
  if (this.ctx.state === 'suspended') { this.ctx.resume(); }
  return this.ctx.state === 'running';
};

// ============ 用户激活 ============
AudioManager.prototype.activate = function() {
  if (!this.initialized) { return; }
  this._ensure();
  this.enabled = true;
  this.musicGain.gain.value = this.musicVol;
  this.sfxGain.gain.value = this.sfxVol;
  this.envGain.gain.value = this.envVol;
  this._startEnv();
  this._startMusic();
};

// ============ 音量控制 ============
AudioManager.prototype.setMusicVolume = function(v) {
  this.musicVol = v;
  if (this.enabled) { this.musicGain.gain.setTargetAtTime(this.muted ? 0 : v, this.ctx.currentTime, 0.1); }
};
AudioManager.prototype.setSfxVolume = function(v) {
  this.sfxVol = v;
  if (this.enabled) { this.sfxGain.gain.setTargetAtTime(this.muted ? 0 : v, this.ctx.currentTime, 0.1); }
};
AudioManager.prototype.setEnvVolume = function(v) {
  this.envVol = v;
  if (this.enabled) { this.envGain.gain.setTargetAtTime(this.muted ? 0 : v, this.ctx.currentTime, 0.1); }
};
AudioManager.prototype.toggleMute = function() {
  this.muted = !this.muted;
  var t = this.ctx.currentTime;
  this.musicGain.gain.setTargetAtTime(this.muted ? 0 : this.musicVol, t, 0.08);
  this.sfxGain.gain.setTargetAtTime(this.muted ? 0 : this.sfxVol, t, 0.08);
  this.envGain.gain.setTargetAtTime(this.muted ? 0 : this.envVol, t, 0.08);
  return this.muted;
};

// ============ 基础音效播放 ============
AudioManager.prototype._playTone = function(freq, type, duration, vol, gainNode, rampDown, freqEnd) {
  if (!this._ensure() || this.muted) { return; }
  if (vol === undefined) { vol = 0.1; }
  if (rampDown === undefined) { rampDown = true; }
  var t = this.ctx.currentTime;
  var osc = this.ctx.createOscillator();
  var g = this.ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (freqEnd) { osc.frequency.exponentialRampToValueAtTime(freqEnd, t + duration); }
  g.gain.setValueAtTime(vol, t);
  if (rampDown) { g.gain.exponentialRampToValueAtTime(0.001, t + duration); }
  osc.connect(g);
  var target = gainNode || this.sfxGain;
  g.connect(target);
  // 也发送到混响
  g.connect(this.reverbGain);
  osc.start(t); osc.stop(t + duration);
  return osc;
};

AudioManager.prototype._playNoise = function(duration, vol, filterFreq, gainNode) {
  if (!this._ensure() || this.muted) { return; }
  var t = this.ctx.currentTime;
  var len = this.ctx.sampleRate * duration;
  var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.5);
  }
  var src = this.ctx.createBufferSource(); src.buffer = buf;
  var g = this.ctx.createGain();
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + duration);
  var target = gainNode || this.sfxGain;
  if (filterFreq) {
    var f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(filterFreq, t);
    src.connect(f); f.connect(g);
  } else { src.connect(g); }
  g.connect(target);
  g.connect(this.reverbGain);
  src.start(t);
};

// ============ 音效池管理 ============
AudioManager.prototype._acquireSfxSlot = function() {
  var now = this.ctx.currentTime;
  this.sfxPool = this.sfxPool.filter(function(s) { return s.endTime > now; });
  if (this.sfxPool.length >= this.maxSfx) { this.sfxPool.shift(); }
  var slot = { endTime: now + 2 };
  this.sfxPool.push(slot);
  return slot;
};

// ============ 武器音效 ============
AudioManager.prototype.shoot = function() {
  this._acquireSfxSlot();
  // 激光射击：高频电子冲击
  this._playTone(1200, 'square', 0.04, 0.04, null, true, 400);
  this._playTone(1800, 'sine', 0.03, 0.02, null, true, 600);
  // 枪口低频能量
  this._playTone(60, 'sine', 0.06, 0.03, null, false);
};

AudioManager.prototype.shootLaser = function() {
  this._acquireSfxSlot();
  this._playTone(1400, 'square', 0.05, 0.05, null, true, 300);
  this._playTone(2000, 'sine', 0.03, 0.03, null, true, 500);
};

AudioManager.prototype.shootPlasma = function() {
  this._acquireSfxSlot();
  this._playTone(80, 'sawtooth', 0.12, 0.06, null, false);
  this._playTone(200, 'sine', 0.1, 0.04, null, true, 50);
  this._playNoise(0.08, 0.03, 300);
};

AudioManager.prototype.shootMissile = function() {
  this._acquireSfxSlot();
  this._playNoise(0.1, 0.04, 600);
  this._playTone(300, 'sawtooth', 0.15, 0.04, null, true, 80);
};

// ============ 命中音效 ============
AudioManager.prototype.hit = function() {
  this._acquireSfxSlot();
  // 金属撞击 + 能量破裂
  this._playTone(200, 'square', 0.06, 0.05, null, true, 50);
  this._playTone(800, 'sine', 0.04, 0.03, null, true, 200);
  this._playNoise(0.04, 0.03, 2000);
};

AudioManager.prototype.hitHeavy = function() {
  this._acquireSfxSlot();
  this._playTone(100, 'square', 0.1, 0.07, null, true, 30);
  this._playTone(500, 'sawtooth', 0.08, 0.04, null, true, 100);
  this._playNoise(0.06, 0.05, 1500);
};

// ============ 爆炸音效 ============
AudioManager.prototype.explode = function(size) {
  this._acquireSfxSlot();
  var s = size || 'small';
  var dur, vol, ff;
  switch (s) {
    case 'small': dur = 0.2; vol = 0.07; ff = 400; break;
    case 'medium': dur = 0.35; vol = 0.1; ff = 300; break;
    case 'large': dur = 0.5; vol = 0.14; ff = 200; break;
    case 'boss': dur = 0.8; vol = 0.18; ff = 150; break;
    default: dur = 0.2; vol = 0.07; ff = 400;
  }
  // 第一阶段：能量释放（高频）
  this._playTone(600, 'square', dur * 0.3, vol * 0.5, null, true, 100);
  this._playTone(300, 'sawtooth', dur * 0.4, vol * 0.4, null, true, 50);
  // 第二阶段：低频冲击
  this._playTone(40, 'sine', dur * 0.8, vol * 0.7, null, false);
  // 第三阶段：碎片散落（噪声）
  this._playNoise(dur, vol, ff);
  // Boss额外：超低频震动
  if (s === 'boss') {
    this._playTone(20, 'sine', 1.0, 0.12, null, false);
    this._playTone(60, 'sawtooth', 0.6, 0.06, null, true, 20);
  }
};

// ============ 奖励音效 ============
AudioManager.prototype.powerup = function() {
  this._acquireSfxSlot();
  // 科技感上升音阶
  this._playTone(400, 'sine', 0.06, 0.05, null, true, 800);
  var self = this;
  setTimeout(function() { self._playTone(600, 'sine', 0.06, 0.05, null, true, 1200); }, 50);
  setTimeout(function() { self._playTone(900, 'sine', 0.08, 0.06, null, true, 1600); }, 100);
};

AudioManager.prototype.levelUp = function() {
  this._acquireSfxSlot();
  var notes = [400, 500, 600, 800, 1000, 1200];
  var self = this;
  for (var i = 0; i < notes.length; i++) {
    (function(n, idx) {
      setTimeout(function() { self._playTone(n, 'sine', 0.1, 0.04, null, true, n * 1.2); }, idx * 60);
    })(notes[i], i);
  }
};

// ============ 特殊音效 ============
AudioManager.prototype.bomb = function() {
  this._acquireSfxSlot();
  this._playTone(30, 'sawtooth', 0.5, 0.12, null, true, 10);
  this._playTone(60, 'sine', 0.6, 0.08, null, false);
  this._playNoise(0.4, 0.06, 200);
};

AudioManager.prototype.bossWarning = function() {
  this._acquireSfxSlot();
  for (var i = 0; i < 3; i++) {
    var self = this;
    (function(idx) {
      setTimeout(function() {
        self._playTone(80, 'square', 0.25, 0.08, null, true, 40);
        self._playTone(120, 'sawtooth', 0.2, 0.04, null, true, 60);
      }, idx * 300);
    })(i);
  }
};

AudioManager.prototype.dash = function() {
  this._acquireSfxSlot();
  this._playTone(1500, 'sine', 0.08, 0.04, null, true, 300);
  this._playTone(1000, 'square', 0.06, 0.03, null, true, 200);
};

// ============ 环境音效 ============
AudioManager.prototype._startEnv = function() {
  if (!this._ensure() || this.envNodes) { return; }
  var t = this.ctx.currentTime;
  this.envNodes = {};

  // 1. 深空低频氛围
  var osc1 = this.ctx.createOscillator();
  osc1.type = 'sine'; osc1.frequency.value = 35;
  var g1 = this.ctx.createGain(); g1.gain.value = 0.03;
  // 加入轻微频率调制
  var lfo1 = this.ctx.createOscillator();
  lfo1.type = 'sine'; lfo1.frequency.value = 0.08;
  var lfoG1 = this.ctx.createGain(); lfoG1.gain.value = 3;
  lfo1.connect(lfoG1); lfoG1.connect(osc1.frequency);
  osc1.connect(g1); g1.connect(this.envGain);
  osc1.start(t); lfo1.start(t);
  this.envNodes.deepSpace = { osc: osc1, gain: g1, lfo: lfo1 };

  // 2. 飞船引擎低鸣
  var osc2 = this.ctx.createOscillator();
  osc2.type = 'sawtooth'; osc2.frequency.value = 55;
  var g2 = this.ctx.createGain(); g2.gain.value = 0.015;
  var f2 = this.ctx.createBiquadFilter();
  f2.type = 'lowpass'; f2.frequency.value = 120;
  osc2.connect(f2); f2.connect(g2); g2.connect(this.envGain);
  osc2.start(t);
  this.envNodes.engine = { osc: osc2, gain: g2, filter: f2 };

  // 3. 能量核心运行声
  var osc3 = this.ctx.createOscillator();
  osc3.type = 'triangle'; osc3.frequency.value = 180;
  var g3 = this.ctx.createGain(); g3.gain.value = 0.008;
  var f3 = this.ctx.createBiquadFilter();
  f3.type = 'bandpass'; f3.frequency.value = 400; f3.Q.value = 3;
  var lfo3 = this.ctx.createOscillator();
  lfo3.type = 'sine'; lfo3.frequency.value = 0.15;
  var lfoG3 = this.ctx.createGain(); lfoG3.gain.value = 20;
  lfo3.connect(lfoG3); lfoG3.connect(f3.frequency);
  osc3.connect(f3); f3.connect(g3); g3.connect(this.envGain);
  osc3.start(t); lfo3.start(t);
  this.envNodes.core = { osc: osc3, gain: g3, lfo: lfo3 };
};

// 太空通讯/无线电效果（随机触发）
AudioManager.prototype.spaceComms = function() {
  if (!this._ensure() || this.muted) { return; }
  var t = this.ctx.currentTime;
  var dur = 0.3 + Math.random() * 0.5;
  var len = this.ctx.sampleRate * dur;
  var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < data.length; i++) {
    var p = i / data.length;
    data[i] = (Math.random() * 2 - 1) * Math.sin(p * Math.PI * 20) * Math.pow(1 - p, 0.5) * 0.3;
  }
  var src = this.ctx.createBufferSource(); src.buffer = buf;
  var f = this.ctx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 800 + Math.random() * 1200; f.Q.value = 8;
  var g = this.ctx.createGain(); g.gain.setValueAtTime(0.02, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(this.envGain);
  src.start(t);
};

// ============ BGM 动态音乐系统 ============
AudioManager.prototype._startMusic = function() {
  if (!this._ensure() || this.musicNodes.ambient) { return; }
  var t = this.ctx.currentTime;

  // Layer 1: 宇宙环境层 (always on, lowest)
  var oscA1 = this.ctx.createOscillator();
  oscA1.type = 'sine'; oscA1.frequency.value = 55;
  var oscA2 = this.ctx.createOscillator();
  oscA2.type = 'sine'; oscA2.frequency.value = 65.4;
  var oscA3 = this.ctx.createOscillator();
  oscA3.type = 'sine'; oscA3.frequency.value = 82.4;
  var gA = this.ctx.createGain(); gA.gain.value = 0;
  // 低频调制
  var lfoA = this.ctx.createOscillator();
  lfoA.type = 'sine'; lfoA.frequency.value = 0.06;
  var lfoAG = this.ctx.createGain(); lfoAG.gain.value = 2;
  lfoA.connect(lfoAG); lfoAG.connect(oscA1.frequency);
  lfoAG.connect(oscA2.frequency);
  lfoAG.connect(oscA3.frequency);
  var fA = this.ctx.createBiquadFilter();
  fA.type = 'lowpass'; fA.frequency.value = 200;
  oscA1.connect(gA); oscA2.connect(gA); oscA3.connect(gA);
  gA.connect(fA); fA.connect(this.musicGain);
  oscA1.start(t); oscA2.start(t); oscA3.start(t); lfoA.start(t);
  this.musicNodes.ambient = { oscs: [oscA1, oscA2, oscA3], gain: gA, lfo: lfoA, filter: fA };

  // Layer 2: 探索层 (melodic)
  var oscE1 = this.ctx.createOscillator();
  oscE1.type = 'triangle'; oscE1.frequency.value = 220;
  var oscE2 = this.ctx.createOscillator();
  oscE2.type = 'sine'; oscE2.frequency.value = 330;
  var gE = this.ctx.createGain(); gE.gain.value = 0;
  var fE = this.ctx.createBiquadFilter();
  fE.type = 'bandpass'; fE.frequency.value = 600; fE.Q.value = 1.5;
  // 旋律调制
  var lfoE = this.ctx.createOscillator();
  lfoE.type = 'sine'; lfoE.frequency.value = 0.12;
  var lfoEG = this.ctx.createGain(); lfoEG.gain.value = 30;
  lfoE.connect(lfoEG); lfoEG.connect(oscE1.frequency);
  oscE1.connect(gE); oscE2.connect(gE);
  gE.connect(fE); fE.connect(this.musicGain);
  oscE1.start(t); oscE2.start(t); lfoE.start(t);
  this.musicNodes.explore = { oscs: [oscE1, oscE2], gain: gE, lfo: lfoE, filter: fE };

  // Layer 3: 战斗层 (rhythmic + bass)
  var oscB1 = this.ctx.createOscillator();
  oscB1.type = 'sawtooth'; oscB1.frequency.value = 110;
  var oscB2 = this.ctx.createOscillator();
  oscB2.type = 'square'; oscB2.frequency.value = 55;
  var gB = this.ctx.createGain(); gB.gain.value = 0;
  var fB = this.ctx.createBiquadFilter();
  fB.type = 'lowpass'; fB.frequency.value = 300;
  // 节奏脉动
  var lfoB = this.ctx.createOscillator();
  lfoB.type = 'square'; lfoB.frequency.value = 2.5;
  var lfoBG = this.ctx.createGain(); lfoBG.gain.value = 0.5;
  lfoB.connect(lfoBG); lfoBG.connect(gB.gain);
  oscB1.connect(gB); oscB2.connect(gB);
  gB.connect(fB); fB.connect(this.musicGain);
  oscB1.start(t); oscB2.start(t); lfoB.start(t);
  this.musicNodes.battle = { oscs: [oscB1, oscB2], gain: gB, lfo: lfoB, filter: fB };

  // Layer 4: Boss层 (史诗)
  var oscBo1 = this.ctx.createOscillator();
  oscBo1.type = 'sawtooth'; oscBo1.frequency.value = 82.4;
  var oscBo2 = this.ctx.createOscillator();
  oscBo2.type = 'square'; oscBo2.frequency.value = 41.2;
  var gBo = this.ctx.createGain(); gBo.gain.value = 0;
  var fBo = this.ctx.createBiquadFilter();
  fBo.type = 'lowpass'; fBo.frequency.value = 400;
  var lfoBo = this.ctx.createOscillator();
  lfoBo.type = 'sine'; lfoBo.frequency.value = 0.2;
  var lfoBoG = this.ctx.createGain(); lfoBoG.gain.value = 0.3;
  lfoBo.connect(lfoBoG); lfoBoG.connect(gBo.gain);
  oscBo1.connect(gBo); oscBo2.connect(gBo);
  gBo.connect(fBo); fBo.connect(this.musicGain);
  oscBo1.start(t); oscBo2.start(t); lfoBo.start(t);
  this.musicNodes.boss = { oscs: [oscBo1, oscBo2], gain: gBo, lfo: lfoBo, filter: fBo };

  // 默认：环境层开启
  this.musicState = 'ambient';
  this._setMusicLayer('ambient', 1.0, 0);
  this._setMusicLayer('explore', 0, 0);
  this._setMusicLayer('battle', 0, 0);
  this._setMusicLayer('boss', 0, 0);
};

AudioManager.prototype._setMusicLayer = function(layer, targetVol, fadeTime) {
  var node = this.musicNodes[layer];
  if (!node) { return; }
  var t = this.ctx.currentTime;
  node.gain.gain.setTargetAtTime(targetVol, t, fadeTime * 0.3 + 0.1);
};

AudioManager.prototype.setMusicState = function(state) {
  if (state === this.musicTarget) { return; }
  this.musicTarget = state;
  this.musicFadeTime = this.musicFadeDuration;
  this.musicFadeDuration = (state === 'battle' || state === 'boss') ? 0.5 : 1.5;
};

AudioManager.prototype._updateMusic = function(dt) {
  if (!this._ensure() || !this.musicNodes.ambient) { return; }
  if (this.musicFadeTime > 0 && this.musicTarget !== this.musicState) {
    this.musicFadeTime -= dt;
    // Cross-fade
    var fadeOut = this.musicState;
    var fadeIn = this.musicTarget;
    var progress = 1 - (this.musicFadeTime / this.musicFadeDuration);
    this._setMusicLayer(fadeOut, Math.max(0, 1 - progress), 0.05);
    this._setMusicLayer(fadeIn, Math.min(1, progress), 0.05);
    if (this.musicFadeTime <= 0) {
      this._setMusicLayer(fadeOut, 0, 0.1);
      this._setMusicLayer(fadeIn, 1, 0.1);
      this.musicState = this.musicTarget;
    }
  }
};

// ============ 空间音效 ============
AudioManager.prototype.playSpatial = function(type, x, y) {
  // 根据位置计算立体声pan
  if (!this._ensure() || this.muted) { return; }
  var pan = U.cl((x - CFG.BW / 2) / (CFG.BW / 2), -1, 1);
  var dist = Math.abs(x - (CFG.PA.x + 30)) / CFG.BW;
  var volMul = Math.max(0.2, 1 - dist);

  var t = this.ctx.currentTime;
  var panner = this.ctx.createStereoPanner();
  panner.pan.value = pan;
  var g = this.ctx.createGain();
  g.gain.value = volMul;
  panner.connect(g); g.connect(this.sfxGain);

  this._playTone(200, 'square', 0.06, 0.05 * volMul, g, true, 50);
};

// 旧接口兼容
AudioManager.prototype.play = function(type) {
  switch (type) {
    case 'shoot': this.shoot(); break;
    case 'hit': this.hit(); break;
    case 'explosion': this.explode(); break;
    case 'powerup': this.powerup(); break;
    case 'warning': this.bossWarning(); break;
    case 'dash': this.dash(); break;
    case 'bomb': this.bomb(); break;
  }
};

// ============ 清理 ============
AudioManager.prototype.stopAll = function() {
  // 停止环境音
  if (this.envNodes) {
    for (var k in this.envNodes) {
      var n = this.envNodes[k];
      if (n.osc) { try { n.osc.stop(); } catch(e) {} }
      if (n.lfo) { try { n.lfo.stop(); } catch(e) {} }
    }
    this.envNodes = null;
  }
  // 停止音乐
  if (this.musicNodes.ambient) {
    for (var mk in this.musicNodes) {
      var mn = this.musicNodes[mk];
      if (mn.oscs) {
        for (var oi = 0; oi < mn.oscs.length; oi++) { try { mn.oscs[oi].stop(); } catch(e) {} }
      }
      if (mn.lfo) { try { mn.lfo.stop(); } catch(e) {} }
    }
    this.musicNodes = {};
  }
};

// ========== CAMERA ==========
// 震动类型参数配置：[频率, 衰减指数, 余震概率, 余震强度比, 余震延迟ms]
var SHAKE_TYPES = {
  light:  { freq: 45, decay: 2.2, aftershock: 0,   aftRatio: 0,   aftDelay: 0   },
  medium: { freq: 30, decay: 1.5, aftershock: 0.2, aftRatio: 0.4, aftDelay: 200 },
  heavy:  { freq: 18, decay: 1.0, aftershock: 0.5, aftRatio: 0.5, aftDelay: 300 },
  bomb:   { freq: 12, decay: 0.7, aftershock: 0.8, aftRatio: 0.6, aftDelay: 150 }
};

function Camera() {
  this.shakeLayers = [];  // 多震动叠加层
  this.ox = 0; this.oy = 0; this.or = 0;  // r = 微旋转偏移
  this.targetX = 0; this.targetY = 0;
}
Camera.prototype.shake = function(intensity, duration, type) {
  if (!type) { type = 'medium'; }
  this.shakeLayers.push({
    intensity: intensity,
    duration: duration,
    timer: 0,
    type: type,
    freqX: SHAKE_TYPES[type].freq + U.r(-3, 3),
    freqY: SHAKE_TYPES[type].freq + U.r(-3, 3) - 3,
    aftershockFired: false
  });
};
Camera.prototype.update = function(dt) {
  var totalOx = 0, totalOy = 0, totalOr = 0;
  var i = this.shakeLayers.length;
  while (i--) {
    var s = this.shakeLayers[i];
    var cfg = SHAKE_TYPES[s.type];
    s.timer += dt * 1000;
    var progress = s.timer / s.duration;
    if (progress < 1) {
      var decay = Math.pow(1 - progress, cfg.decay);
      totalOx += Math.sin(progress * s.freqX) * s.intensity * decay * 0.8;
      totalOy += Math.cos(progress * s.freqY) * s.intensity * decay * 0.6;
      // 微旋转偏移（极微小，增加临场感）
      totalOr += Math.sin(progress * s.freqX * 0.7) * s.intensity * decay * 0.002;
      // bomb类型：多重波叠加
      if (s.type === 'bomb') {
        totalOx += Math.sin(progress * s.freqX * 2.3 + 1.5) * s.intensity * decay * 0.4;
        totalOy += Math.cos(progress * s.freqY * 1.7 + 0.8) * s.intensity * decay * 0.3;
      }
    } else {
      // 余震机制
      if (!s.aftershockFired && Math.random() < cfg.aftershock) {
        s.aftershockFired = true;
        var ai = s.intensity * cfg.aftRatio;
        var ad = s.duration * 0.4;
        this.shakeLayers.push({
          intensity: ai, duration: ad, timer: 0, type: s.type,
          freqX: cfg.freq + U.r(-3, 3), freqY: cfg.freq + U.r(-3, 3) - 3,
          aftershockFired: true  // 余震不再产生余震
        });
      }
      this.shakeLayers.splice(i, 1);
    }
  }
  if (this.shakeLayers.length > 0) {
    this.ox = totalOx;
    this.oy = totalOy;
    this.or = totalOr;
  } else {
    this.ox = U.lerp(this.ox, 0, dt * 8);
    this.oy = U.lerp(this.oy, 0, dt * 8);
    this.or = U.lerp(this.or, 0, dt * 8);
    if (Math.abs(this.ox) < 0.1 && Math.abs(this.oy) < 0.1) {
      this.ox = 0; this.oy = 0; this.or = 0;
    }
  }
};

// ========== PARTICLE ==========
function Particle() { this.reset(); }
Particle.prototype.reset = function() {
  this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
  this.life = 0; this.maxLife = 0; this.active = false;
  this.size = 2; this.endSize = 0; this.color = '#fff'; this.opacity = 1; this.gravity = 0;
  this.type = 'default'; // default, glow, trail, flash, sparkle, debris
  this.glowColor = ''; this.blur = 0;
  this.rotation = 0; this.rotationSpeed = 0;
  this.vertices = null; this.arcStart = 0; this.arcEnd = 0;
  this.depth = 1; this.midColor = '';
};
Particle.prototype.init = function(x, y, vx, vy, life, size, color, opts) {
  this.x = x; this.y = y; this.vx = vx; this.vy = vy;
  this.life = life; this.maxLife = life; this.active = true;
  this.size = size; this.endSize = (opts && opts.endSize) || 0;
  this.color = color; this.opacity = 1; this.gravity = 0;
  this.type = (opts && opts.type) || 'default';
  this.glowColor = (opts && opts.glowColor) || color;
  this.blur = (opts && opts.blur) || 0;
  this.rotation = (opts && opts.rotation) || 0;
  this.rotationSpeed = (opts && opts.rotationSpeed) || 0;
  this.midColor = (opts && opts.midColor) || '';
  this.depth = (opts && opts.depth !== undefined) ? opts.depth : 1;
  if (opts && opts.gravity) { this.gravity = opts.gravity; }
  // debris: generate random 3-5 vertex polygon
  if (this.type === 'debris') {
    var nv = U.ri(3, 5);
    this.vertices = [];
    for (var i = 0; i < nv; i++) {
      this.vertices.push({ a: (Math.PI * 2 / nv) * i + U.r(-0.3, 0.3), r: U.r(0.5, 1) });
    }
  }
  // energyRing: random arc segment
  if (this.type === 'energyRing') {
    this.arcStart = U.r(0, Math.PI * 2);
    this.arcEnd = this.arcStart + U.r(Math.PI * 0.8, Math.PI * 1.8);
  }
  // sparkle: random rotation speed
  if (this.type === 'sparkle') {
    this.rotationSpeed = U.r(-12, 12);
    this.rotation = U.r(0, Math.PI * 2);
  }
};
Particle.prototype.update = function(dt) {
  this.life -= dt;
  if (this.life <= 0) { this.active = false; return; }
  this.x += this.vx * dt; this.y += this.vy * dt;
  // debris: stronger gravity
  var grav = this.gravity;
  if (this.type === 'debris') { grav *= 2.5; }
  this.vy += grav * dt;
  this.opacity = this.life / this.maxLife;
  // 速度衰减
  this.vx *= 0.98;
  this.vy *= 0.98;
  // rotation
  this.rotation += this.rotationSpeed * dt;
};
Particle.prototype.render = function(ctx) {
  var alpha = this.opacity;
  // depth modulation: far(0) = dimmer/slower, near(1) = brighter
  var depthScale = 0.4 + this.depth * 0.6;
  var currentSize = this.endSize ? this.size + (this.endSize - this.size) * (1 - this.opacity) : this.size;
  currentSize *= depthScale;
  alpha *= (0.3 + this.depth * 0.7);
  ctx.globalAlpha = alpha;
  if (this.type === 'glow') {
    // inner white core
    var coreR = currentSize * 0.25;
    ctx.fillStyle = 'rgba(255,255,255,' + (alpha * 0.9) + ')';
    ctx.beginPath(); ctx.arc(this.x, this.y, coreR, 0, Math.PI * 2); ctx.fill();
    // 3-color radial gradient glow
    var grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, currentSize);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.2, this.color);
    var midC = this.midColor || this.glowColor;
    grad.addColorStop(0.55, midC);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(this.x, this.y, currentSize, 0, Math.PI * 2); ctx.fill();
  } else if (this.type === 'trail') {
    // motion blur: stretch along velocity direction
    var speed = Math.hypot(this.vx, this.vy);
    var stretch = Math.min(speed * 0.06, currentSize * 3);
    var ang = Math.atan2(this.vy, this.vx);
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(ang);
    // size gradient: head larger, tail smaller
    var headSize = currentSize * 1.2;
    var tailSize = currentSize * 0.5;
    ctx.shadowColor = this.glowColor;
    ctx.shadowBlur = Math.max(this.blur || 0, currentSize * 4);
    var grad = ctx.createLinearGradient(-stretch, 0, 0, 0);
    grad.addColorStop(0, this.glowColor || this.color);
    grad.addColorStop(1, this.color);
    ctx.fillStyle = grad;
    // draw tapered shape
    ctx.beginPath();
    ctx.moveTo(0, -headSize / 2);
    ctx.lineTo(-stretch, -tailSize / 2);
    ctx.lineTo(-stretch, tailSize / 2);
    ctx.lineTo(0, headSize / 2);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  } else if (this.type === 'sparkle') {
    // cross star flash
    var len = currentSize * 2;
    var flicker = 0.5 + 0.5 * Math.sin(this.life * 40 + this.rotation * 5);
    ctx.globalAlpha = alpha * flicker;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.strokeStyle = this.color;
    ctx.lineWidth = Math.max(1, currentSize * 0.3);
    ctx.shadowColor = this.color;
    ctx.shadowBlur = currentSize * 3;
    // main cross
    ctx.beginPath();
    ctx.moveTo(-len, 0); ctx.lineTo(len, 0);
    ctx.moveTo(0, -len); ctx.lineTo(0, len);
    ctx.stroke();
    // diagonal cross (smaller)
    var dLen = len * 0.5;
    ctx.lineWidth = Math.max(0.5, currentSize * 0.15);
    ctx.beginPath();
    ctx.moveTo(-dLen, -dLen); ctx.lineTo(dLen, dLen);
    ctx.moveTo(dLen, -dLen); ctx.lineTo(-dLen, dLen);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  } else if (this.type === 'debris') {
    // irregular polygon with metallic reflection
    if (!this.vertices || this.vertices.length < 3) { ctx.globalAlpha = 1; return; }
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    // metallic highlight based on rotation
    var metalBright = 0.6 + 0.4 * Math.sin(this.rotation * 2);
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.glowColor || this.color;
    ctx.shadowBlur = currentSize;
    ctx.beginPath();
    for (var vi = 0; vi < this.vertices.length; vi++) {
      var v = this.vertices[vi];
      var px = Math.cos(v.a) * v.r * currentSize;
      var py = Math.sin(v.a) * v.r * currentSize;
      if (vi === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
    }
    ctx.closePath();
    ctx.fill();
    // metallic edge highlight
    ctx.strokeStyle = 'rgba(255,255,255,' + (metalBright * 0.5) + ')';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  } else if (this.type === 'shockwave') {
    var progress = 1 - this.opacity;
    var r = this.ringRadius + (this.endSize - this.ringRadius) * progress;
    var edgeFade = Math.pow(1 - progress, 1.5);
    // color gradient: white center to colored edge
    var grad = ctx.createRadialGradient(this.x, this.y, r * 0.6, this.x, this.y, r);
    grad.addColorStop(0, 'rgba(255,255,255,' + (edgeFade * 0.3) + ')');
    grad.addColorStop(1, this.color);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3 * edgeFade + 1;
    ctx.shadowColor = this.glowColor;
    ctx.shadowBlur = 10 * edgeFade;
    ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    // inner energy radial lines
    var lineCount = 8;
    ctx.globalAlpha = alpha * 0.4 * edgeFade;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 0.8;
    for (var li = 0; li < lineCount; li++) {
      var la = (Math.PI * 2 / lineCount) * li + this.rotation;
      ctx.beginPath();
      ctx.moveTo(this.x + Math.cos(la) * r * 0.3, this.y + Math.sin(la) * r * 0.3);
      ctx.lineTo(this.x + Math.cos(la) * r * 0.85, this.y + Math.sin(la) * r * 0.85);
      ctx.stroke();
    }
    // inner ring
    ctx.globalAlpha = alpha * 0.5 * edgeFade;
    ctx.strokeStyle = 'rgba(255,255,255,' + (edgeFade * 0.6) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(this.x, this.y, r * 0.75, 0, Math.PI * 2); ctx.stroke();
  } else if (this.type === 'energyRing') {
    var pr = 1 - this.opacity;
    var er = this.ringRadius + (this.endSize - this.ringRadius) * pr;
    var fade = 1 - pr;
    // arc segment ring
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2.5 * fade;
    ctx.shadowColor = this.glowColor;
    ctx.shadowBlur = 8 * fade;
    ctx.beginPath(); ctx.arc(this.x, this.y, er, this.arcStart + this.rotation, this.arcEnd + this.rotation); ctx.stroke();
    // secondary arc (opposite)
    ctx.globalAlpha = alpha * 0.5;
    ctx.lineWidth = 1.5 * fade;
    ctx.beginPath(); ctx.arc(this.x, this.y, er * 0.85, this.arcStart + this.rotation + Math.PI, this.arcEnd + this.rotation + Math.PI * 0.5); ctx.stroke();
    ctx.shadowBlur = 0;
    // energy particles along ring
    var numDots = 4;
    ctx.fillStyle = this.color;
    ctx.globalAlpha = alpha * 0.8;
    for (var di = 0; di < numDots; di++) {
      var da = this.arcStart + this.rotation + (this.arcEnd - this.arcStart) * (di / numDots) + pr * Math.PI * 2;
      var dx = this.x + Math.cos(da) * er;
      var dy = this.y + Math.sin(da) * er;
      ctx.beginPath(); ctx.arc(dx, dy, Math.max(1, currentSize * 0.4), 0, Math.PI * 2); ctx.fill();
    }
  } else {
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = currentSize * 2;
    ctx.fillRect(this.x - currentSize / 2, this.y - currentSize / 2, currentSize, currentSize);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
};

// ========== PARTICLE SYSTEM ==========
function ParticleSystem() {
  this.particles = [];
  this.pool = new Pool(function() { return new Particle(); }, function(p) { p.reset(); }, 800);
  this.envParticles = [];
  this.envTimer = 0;
  this.maxParticles = 600;
  // 3D space: player velocity tracking (captured from emitEngine)
  this._playerVx = 0; this._playerVy = 0; this._playerSpeed = 0;
  // ambient glow pulse phase
  this._glowPhase = 0;
}
ParticleSystem.prototype.emit = function(x, y, count, cfg) {
  for (var i = 0; i < count; i++) {
    if (this.particles.length >= this.maxParticles) { break; }
    var p = this.pool.acquire();
    var angle = cfg.angle !== undefined ? cfg.angle : U.r(0, Math.PI * 2);
    var speed = cfg.speed || U.r(50, 200);
    var spread = cfg.spread || 0;
    var a = angle + U.r(-spread, spread);
    var opts = {
      type: cfg.type || 'default', glowColor: cfg.glowColor, blur: cfg.blur,
      endSize: cfg.endSize, gravity: cfg.gravity,
      rotation: cfg.rotation, rotationSpeed: cfg.rotationSpeed,
      midColor: cfg.midColor, depth: cfg.depth
    };
    p.init(x, y, Math.cos(a) * speed, Math.sin(a) * speed,
      cfg.life || U.r(0.2, 0.6), cfg.size || U.r(1, 3), cfg.color || '#ff4444', opts);
    if (cfg.ringRadius) { p.ringRadius = cfg.ringRadius; }
    this.particles.push(p);
  }
};

// 引擎尾焰粒子
ParticleSystem.prototype.emitEngine = function(x, y, vx, vy, isPlayer) {
  if (this.particles.length >= this.maxParticles) { return; }
  // capture player velocity for 3D effects
  if (isPlayer) {
    this._playerVx = -vx; this._playerVy = vy;
    this._playerSpeed = Math.hypot(this._playerVx, this._playerVy);
  }
  var count = isPlayer ? 3 : 1;
  for (var i = 0; i < count; i++) {
    var p = this.pool.acquire();
    var sx = x + U.r(-3, 3), sy = y + U.r(-2, 2);
    var svx = vx * 0.5 + U.r(-20, 20), svy = vy * 0.5 + U.r(-15, 15);
    var color = isPlayer ? ['#00ccff', '#0088ff', '#00aaff'][U.ri(0, 2)] : ['#ff6644', '#ff4422', '#ff5533'][U.ri(0, 2)];
    p.init(sx, sy, svx, svy, U.r(0.15, 0.4), U.r(1.5, 3.5), color,
      { type: 'glow', glowColor: isPlayer ? '#004488' : '#441100', midColor: isPlayer ? '#0066cc' : '#882200', endSize: 0.5, depth: U.r(0.6, 1) });
    this.particles.push(p);
  }
  // outer glow halo particle
  if (this.particles.length < this.maxParticles) {
    var hp = this.pool.acquire();
    var hColor = isPlayer ? '#0066ff' : '#ff3300';
    var hGlow = isPlayer ? '#0033aa' : '#aa1100';
    hp.init(x + U.r(-2, 2), y + U.r(-1, 1), vx * 0.3 + U.r(-8, 8), vy * 0.3 + U.r(-6, 6), U.r(0.2, 0.35), U.r(4, 7), hColor,
      { type: 'glow', glowColor: hGlow, midColor: isPlayer ? '#0044cc' : '#cc2200', endSize: 1.5, depth: U.r(0.3, 0.6) });
    this.particles.push(hp);
  }
  // white-hot core particle
  if (this.particles.length < this.maxParticles) {
    var cp = this.pool.acquire();
    cp.init(x + U.r(-1, 1), y + U.r(-1, 1), vx * 0.4 + U.r(-5, 5), vy * 0.4 + U.r(-4, 4), U.r(0.08, 0.18), U.r(1, 2), '#ffffff',
      { type: 'glow', glowColor: isPlayer ? '#00aaff' : '#ff6633', endSize: 0.2, depth: U.r(0.8, 1) });
    this.particles.push(cp);
  }
};

// 飞行轨迹粒子
ParticleSystem.prototype.emitTrail = function(x, y, color) {
  if (this.particles.length >= this.maxParticles) { return; }
  for (var i = 0; i < 2; i++) {
    var p = this.pool.acquire();
    // richer color: vary hue slightly
    var colors = [color, color, '#ffffff'];
    var c = colors[U.ri(0, 2)];
    p.init(x + U.r(-2, 2), y + U.r(-2, 2), U.r(-8, 8), U.r(-8, 8), U.r(0.3, 0.7), U.r(1, 3), c,
      { type: 'trail', glowColor: color, midColor: color, blur: 8, endSize: 0.2, depth: U.r(0.5, 1) });
    this.particles.push(p);
  }
};

// 爆炸粒子接口（第二阶段接入）
ParticleSystem.prototype.createExplosion = function(x, y, type) {
  var cfg;
  switch (type) {
    case 'small':
      cfg = { count: 6, color: '#ff8844', speed: 140, spread: Math.PI * 2, life: 0.35, size: 2.5 };
      break;
    case 'medium':
      cfg = { count: 14, color: '#ff6644', speed: 200, spread: Math.PI * 2, life: 0.55, size: 3.5 };
      break;
    case 'large':
      cfg = { count: 30, color: '#ff4466', speed: 280, spread: Math.PI * 2, life: 0.75, size: 4.5 };
      break;
    case 'boss':
      cfg = { count: 50, color: '#ff2244', speed: 350, spread: Math.PI * 2, life: 1.0, size: 6 };
      break;
    default:
      cfg = { count: 10, color: '#ffaa44', speed: 160, spread: Math.PI * 2, life: 0.45, size: 3 };
  }

  // 第一阶段：白色能量闪光
  this.emit(x, y, cfg.count, {
    color: '#ffffff', speed: cfg.speed * 0.3, spread: cfg.spread, life: cfg.life * 0.2,
    size: cfg.size * 2, type: 'glow', glowColor: '#ffffff', endSize: 0
  });

  // 第二阶段：火焰粒子
  this.emit(x, y, cfg.count, cfg);

  // 碎片类型粒子 (debris)
  this.emitDebris(x, y, Math.floor(cfg.count * 0.4), cfg.color, cfg.speed * 0.8);

  // 闪光类型粒子 (sparkle)
  this.emitSparkle(x, y, Math.floor(cfg.count * 0.3), '#ffd700');

  // 冲击波增强
  this.emitShockwave(x, y, cfg.size * 3, cfg.color);
  if (cfg.count >= 14) {
    this.emitShockwave(x, y, cfg.size * 5, '#ffffff');
  }

  // 金属碎片 (trail)
  this.emit(x, y, Math.floor(cfg.count * 0.6), {
    color: cfg.color, speed: cfg.speed * 0.7, spread: cfg.spread, life: cfg.life * 0.8,
    size: cfg.size * 0.6, type: 'trail', glowColor: '#ffaa44', blur: 4, gravity: 80
  });

  // 第三阶段：光晕粒子（缓慢扩散）
  this.emit(x, y, Math.floor(cfg.count / 2), {
    color: '#ffffff', speed: cfg.speed * 0.4, spread: cfg.spread, life: cfg.life * 0.7,
    size: cfg.size * 1.8, type: 'glow', glowColor: cfg.color, endSize: cfg.size * 3
  });

  // 残留火花
  this.emit(x, y, Math.floor(cfg.count * 0.3), {
    color: '#ffd700', speed: cfg.speed * 0.5, spread: cfg.spread, life: cfg.life * 0.6,
    size: cfg.size * 0.7, type: 'trail', glowColor: '#ffaa00', blur: 6, gravity: 30
  });

  // 烟尘效果（灰色半透明缓慢扩散）
  this.emit(x, y, Math.floor(cfg.count * 0.5), {
    color: '#888888', speed: cfg.speed * 0.15, spread: cfg.spread, life: cfg.life * 1.5,
    size: cfg.size * 2, type: 'glow', glowColor: '#555555', midColor: '#666666', endSize: cfg.size * 5, depth: 0.3
  });
};

// 冲击波效果
ParticleSystem.prototype.emitShockwave = function(x, y, radius, color) {
  if (this.particles.length >= this.maxParticles) { return; }
  var p = this.pool.acquire();
  p.init(x, y, 0, 0, 0.4, radius, color || '#ffffff', {
    type: 'shockwave', glowColor: color || '#ffffff', blur: 0, endSize: radius * 2.5,
    rotationSpeed: U.r(-1.5, 1.5)
  });
  p.ringRadius = radius;
  this.particles.push(p);
};

// 枪口闪光
ParticleSystem.prototype.emitMuzzleFlash = function(x, y, color) {
  if (this.particles.length >= this.maxParticles) { return; }
  // 中心闪光
  for (var i = 0; i < 4; i++) {
    var p = this.pool.acquire();
    var a = U.r(0, Math.PI * 2);
    var spd = U.r(30, 80);
    p.init(x, y, Math.cos(a) * spd, Math.sin(a) * spd, U.r(0.05, 0.12), U.r(2, 5), '#ffffff',
      { type: 'glow', glowColor: color || '#00ccff', midColor: color || '#00ccff', endSize: 0.5, depth: 1 });
    this.particles.push(p);
  }
  // 光晕扩散
  this.emit(x, y, 3, {
    color: color || '#00ccff', speed: 10, spread: Math.PI * 2, life: 0.1,
    size: 4, type: 'glow', glowColor: color || '#00ccff', endSize: 8
  });
};

// 命中火花
ParticleSystem.prototype.emitHitSpark = function(x, y, color) {
  this.emit(x, y, 4, {
    color: '#ffffff', speed: 120, spread: Math.PI * 0.6, life: 0.15,
    size: 1.5, type: 'trail', glowColor: color || '#ffaa44', blur: 4
  });
  this.emit(x, y, 2, {
    color: color || '#ffaa44', speed: 60, spread: Math.PI * 0.4, life: 0.2,
    size: 2, type: 'glow', glowColor: color || '#ffaa44', endSize: 4
  });
  // sparkle on hit
  this.emitSparkle(x, y, 2, color || '#ffaa44');
};

// 能量波纹
ParticleSystem.prototype.emitEnergyRing = function(x, y, size, color) {
  if (this.particles.length >= this.maxParticles) { return; }
  var p = this.pool.acquire();
  p.init(x, y, 0, 0, 0.3, size, color || '#00ccff', {
    type: 'energyRing', glowColor: color || '#00ccff', blur: 0, endSize: size * 3,
    rotationSpeed: U.r(1, 3)
  });
  p.ringRadius = size;
  this.particles.push(p);
};

// 子弹类型效果接口
ParticleSystem.prototype.createBulletEffect = function(type, x, y, color) {
  switch (type) {
    case 'laser':
      // 细长光束拖尾
      this.emit(x, y, 1, { color: color || '#00ccff', speed: 5, spread: 0, life: 0.15, size: 2, type: 'glow', glowColor: color || '#00ccff', endSize: 6 });
      break;
    case 'plasma':
      // 球状电浆
      this.emit(x, y, 2, { color: color || '#ff00ff', speed: 30, spread: Math.PI * 0.3, life: 0.2, size: 3, type: 'glow', glowColor: color || '#ff00ff', endSize: 1 });
      break;
    case 'missile':
      // 火焰尾焰
      this.emit(x, y, 2, { color: '#ff8800', speed: 40, spread: Math.PI * 0.4, life: 0.25, size: 2.5, type: 'trail', glowColor: '#ff6600', blur: 5, endSize: 0.5 });
      break;
    default:
      this.emitTrail(x, y, color || '#00ccff');
  }
};

// 碎片粒子发射
ParticleSystem.prototype.emitDebris = function(x, y, count, color, speed) {
  this.emit(x, y, count, {
    color: color || '#ffaa44', speed: speed || 150, spread: Math.PI * 2, life: U.r(0.4, 1.0),
    size: U.r(2, 5), type: 'debris', glowColor: color || '#ffaa44', gravity: 120,
    rotationSpeed: U.r(-8, 8), depth: U.r(0.5, 1)
  });
};

// 闪光粒子发射
ParticleSystem.prototype.emitSparkle = function(x, y, count, color) {
  this.emit(x, y, count, {
    color: color || '#ffffff', speed: U.r(20, 80), spread: Math.PI * 2, life: U.r(0.15, 0.4),
    size: U.r(2, 4), type: 'sparkle', glowColor: color || '#ffffff', depth: U.r(0.6, 1)
  });
};

// 环境粒子
ParticleSystem.prototype._updateEnv = function(dt) {
  this.envTimer -= dt;
  if (this.envTimer <= 0) {
    this.envTimer = U.r(0.15, 0.5);
    if (this.envParticles.length < 50) {
      var rtype = U.ri(0, 5); // 0-1: star, 2-3: dust, 4: energy fragment, 5: floating orb
      var ep;
      if (rtype <= 1) {
        // 星星闪烁
        ep = {
          x: U.r(0, CFG.BW), y: U.r(0, CFG.BH),
          vx: U.r(-15, -5), vy: U.r(-3, 3),
          life: U.r(3, 8), maxLife: 0, size: U.r(0.5, 2),
          color: ['#aaccff','#ddeeff','#eeddff','#99bbff','#ffffff','#ffeedd','#ffe0c0'][U.ri(0, 6)],
          twinkleOff: U.r(0, Math.PI * 2), twinkleSpd: U.r(0.5, 2),
          etype: 'star', depth: U.r(0.2, 1)
        };
      } else if (rtype <= 3) {
        // 宇宙尘埃（小灰点，慢速漂浮）
        ep = {
          x: U.r(0, CFG.BW), y: U.r(0, CFG.BH),
          vx: U.r(-8, -2), vy: U.r(-1, 1),
          life: U.r(5, 12), maxLife: 0, size: U.r(0.3, 1),
          color: ['#667788','#778899','#556677','#889999'][U.ri(0, 3)],
          twinkleOff: U.r(0, Math.PI * 2), twinkleSpd: U.r(0.2, 0.8),
          etype: 'dust', depth: U.r(0.1, 0.4)
        };
      } else if (rtype === 4) {
        // 能量碎片（发光小点，快速移动）
        ep = {
          x: U.r(0, CFG.BW), y: U.r(0, CFG.BH),
          vx: U.r(-60, -20), vy: U.r(-20, 20),
          life: U.r(1, 3), maxLife: 0, size: U.r(0.5, 1.5),
          color: ['#00ccff','#ff66ff','#44ffaa','#ffaa44'][U.ri(0, 3)],
          twinkleOff: U.r(0, Math.PI * 2), twinkleSpd: U.r(2, 6),
          etype: 'energy', depth: U.r(0.6, 1)
        };
      } else {
        // 漂浮光点（大而透明的柔和光球）
        ep = {
          x: U.r(0, CFG.BW), y: U.r(0, CFG.BH),
          vx: U.r(-6, -1), vy: U.r(-2, 2),
          life: U.r(6, 15), maxLife: 0, size: U.r(8, 20),
          color: ['#334466','#443366','#335544','#554433'][U.ri(0, 3)],
          twinkleOff: U.r(0, Math.PI * 2), twinkleSpd: U.r(0.3, 1),
          etype: 'orb', depth: U.r(0.1, 0.3)
        };
      }
      ep.maxLife = ep.life;
      this.envParticles.push(ep);
    }
  }
  for (var i = this.envParticles.length - 1; i >= 0; i--) {
    var ep = this.envParticles[i];
    ep.life -= dt;
    if (ep.life <= 0) { this.envParticles.splice(i, 1); continue; }
    // depth modulates speed
    var dFactor = 0.3 + (ep.depth || 1) * 0.7;
    ep.x += ep.vx * dFactor * dt;
    ep.y += ep.vy * dFactor * dt;
    if (ep.x < -30 || ep.x > CFG.BW + 30 || ep.y < -30 || ep.y > CFG.BH + 30) { this.envParticles.splice(i, 1); }
  }
};

ParticleSystem.prototype._renderEnv = function(ctx, time) {
  for (var i = 0; i < this.envParticles.length; i++) {
    var ep = this.envParticles[i];
    var dFactor = 0.3 + (ep.depth || 1) * 0.7;
    var alpha = (ep.life / ep.maxLife) * 0.5 * dFactor;
    var twinkle = 0.5 + 0.5 * Math.sin(time * ep.twinkleSpd + ep.twinkleOff);
    ctx.globalAlpha = alpha * twinkle;
    var sz = ep.size * dFactor;
    if (ep.etype === 'orb') {
      // soft glow orb
      var grad = ctx.createRadialGradient(ep.x, ep.y, 0, ep.x, ep.y, sz);
      grad.addColorStop(0, ep.color);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(ep.x, ep.y, sz, 0, Math.PI * 2); ctx.fill();
    } else if (ep.etype === 'energy') {
      // bright energy dot
      ctx.fillStyle = ep.color;
      ctx.shadowColor = ep.color;
      ctx.shadowBlur = sz * 6;
      ctx.beginPath(); ctx.arc(ep.x, ep.y, sz, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      // star / dust
      ctx.fillStyle = ep.color;
      ctx.shadowColor = ep.color;
      ctx.shadowBlur = sz * 4;
      ctx.fillRect(ep.x - sz / 2, ep.y - sz / 2, sz, sz);
      ctx.shadowBlur = 0;
    }
  }
  ctx.globalAlpha = 1;
};

ParticleSystem.prototype.update = function(dt) {
  for (var i = this.particles.length - 1; i >= 0; i--) {
    this.particles[i].update(dt);
    if (!this.particles[i].active) { this.pool.release(this.particles[i]); this.particles.splice(i, 1); }
  }
  this._updateEnv(dt);
  this._glowPhase += dt * 0.5;
};

ParticleSystem.prototype.render = function(ctx, time) {
  var t = time || 0;
  this._renderEnv(ctx, t);
  for (var i = 0; i < this.particles.length; i++) { this.particles[i].render(ctx); }

  // === 3D Space Enhancement ===
  var W = CFG.BW, H = CFG.BH;
  var cx = W / 2, cy = H / 2;

  // Speed lines (when player moves fast)
  var pSpd = this._playerSpeed;
  if (pSpd > 80) {
    var lineAlpha = Math.min((pSpd - 80) / 400, 0.35);
    var lineCount = Math.floor(lineAlpha * 30);
    var pAng = Math.atan2(this._playerVy, this._playerVx);
    ctx.save();
    ctx.globalAlpha = lineAlpha;
    ctx.strokeStyle = '#aaccff';
    ctx.lineWidth = 0.8;
    for (var si = 0; si < lineCount; si++) {
      // deterministic positions using sin hash to avoid flicker
      var seed = si * 7.31 + 0.5;
      var la = (Math.sin(seed * 3.7) * 0.5 + 0.5) * Math.PI * 2;
      var dist = 0.3 + (Math.sin(seed * 2.3) * 0.5 + 0.5) * 0.6;
      var lx = cx + Math.cos(la) * W * dist * 0.5;
      var ly = cy + Math.sin(la) * H * dist * 0.5;
      // line direction: from center outward
      var ldx = (lx - cx), ldy = (ly - cy);
      var ll = Math.hypot(ldx, ldy);
      if (ll < 1) continue;
      ldx /= ll; ldy /= ll;
      var len = (10 + (Math.sin(seed * 5.1) * 0.5 + 0.5) * 20) * (pSpd / 200);
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + ldx * len, ly + ldy * len);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Vignette (dark corners)
  var vGrad = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.35, cx, cy, Math.max(W, H) * 0.75);
  vGrad.addColorStop(0, 'transparent');
  vGrad.addColorStop(1, 'rgba(10,5,30,0.45)');
  ctx.fillStyle = vGrad;
  ctx.fillRect(0, 0, W, H);

  // Ambient glow pulse (very subtle full-screen color shift)
  var glowVal = 0.015 + 0.01 * Math.sin(this._glowPhase);
  ctx.fillStyle = 'rgba(20,10,50,' + glowVal + ')';
  ctx.fillRect(0, 0, W, H);
};

ParticleSystem.prototype.clear = function() {
  for (var i = 0; i < this.particles.length; i++) { this.pool.release(this.particles[i]); }
  this.particles.length = 0;
  this.envParticles.length = 0;
};

StarField.prototype._initStars = function() {

StarField.prototype._createNebula = function() {
  var c = document.createElement('canvas');
  c.width = CFG.BW * 2; c.height = CFG.BH;

    { x: 550, y: 180, r: 170, h: 210, hl: 230 },  // 蓝紫星云

  ];
  for (var i = 0; i < nebulas.length; i++) {
    var n = nebulas[i];
    var grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    grad.addColorStop(0, 'hsla(' + n.h + ',75%,28%,0.09)');
    grad.addColorStop(0.2, 'hsla(' + n.hl + ',60%,22%,0.06)');
    grad.addColorStop(0.5, 'hsla(' + n.h + ',45%,14%,0.03)');
    grad.addColorStop(0.8, 'hsla(' + n.hl + ',30%,8%,0.01)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad; ctx.fillRect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
  }
  // 增强星云丝状结构（更明显的弯曲光带）
  ctx.globalAlpha = 0.05;
  for (var j = 0; j < 60; j++) {
    var sx = U.r(0, CFG.BW * 2), sy = U.r(0, CFG.BH);
    var hue = [200, 220, 260, 280, 300, 320][U.ri(0, 5)];
    ctx.strokeStyle = 'hsla(' + hue + ',65%,45%,0.6)';
    ctx.lineWidth = U.r(1, 6);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    var cx1 = sx + U.r(-120, 120), cy1 = sy + U.r(-60, 60);
    var cx2 = sx + U.r(-180, 180), cy2 = sy + U.r(-50, 50);
    var ex = sx + U.r(-200, 200), ey = sy + U.r(-40, 40);
    ctx.bezierCurveTo(cx1, cy1, cx2, cy2, ex, ey);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 星云内部亮点（新生恒星感）
  for (var k = 0; k < nebulas.length; k++) {
    var nb = nebulas[k];
    var numBright = U.ri(3, 8);
    for (var b = 0; b < numBright; b++) {
      var angle = U.r(0, Math.PI * 2);
      var dist = U.r(0, nb.r * 0.6);
      var bx = nb.x + Math.cos(angle) * dist;
      var by = nb.y + Math.sin(angle) * dist;
      var br = U.r(2, 8);
      var bGrad = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      bGrad.addColorStop(0, 'hsla(' + nb.h + ',80%,70%,0.12)');
      bGrad.addColorStop(0.5, 'hsla(' + nb.hl + ',60%,50%,0.05)');
      bGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = bGrad;
      ctx.fillRect(bx - br, by - br, br * 2, br * 2);
    }
  }
  return c;
};
StarField.prototype._createNebula2 = function() {

StarField.prototype.update = function(dt) {
  this.nebulaOffX -= this.nebulaSpeed * dt;
  if (this.nebulaOffX < -CFG.BW) { this.nebulaOffX += CFG.BW; }
  this.nebulaOffX2 -= this.nebulaSpeed2 * dt;
  if (this.nebulaOffX2 < -CFG.BW) { this.nebulaOffX2 += CFG.BW; }
  for (var li = 0; li < this.layers.length; li++) {
    var layer = this.layers[li];
    for (var i = 0; i < layer.stars.length; i++) {
      var s = layer.stars[i];
      s.x -= layer.speed * dt;
      if (s.x < 0) { s.x = CFG.BW; s.y = U.r(0, CFG.BH); }
    }
  }
  for (var j = 0; j < this.cosmicStructures.length; j++) {
    var cs = this.cosmicStructures[j];
    cs.x -= cs.speed * dt;
    if (cs.x < -10) { cs.x = CFG.BW + 10; cs.y = U.r(0, CFG.BH); }
  }
  // 小行星移动
  for (var ai = 0; ai < this.asteroids.length; ai++) {
    var ast = this.asteroids[ai];
    ast.x -= ast.speed * dt;
    ast.rotation += ast.rotSpeed * dt;
    if (ast.x < -ast.baseR * 2) { ast.x = CFG.BW + ast.baseR * 2; ast.y = U.r(30, CFG.BH - 30); }
  }
  // 远处星系移动
  for (var gi = 0; gi < this.distantGalaxies.length; gi++) {
    var gal = this.distantGalaxies[gi];
    gal.x -= gal.speed * dt;
    gal.rotation += gal.rotSpeed * dt;
    if (gal.x < -gal.rx * 2) { gal.x = CFG.BW + gal.rx * 2; gal.y = U.r(30, CFG.BH - 30); }
  }
  // 太空碎片移动
  for (var di = 0; di < this.spaceDebris.length; di++) {
    var deb = this.spaceDebris[di];
    deb.x -= deb.speed * dt;
    deb.rotation += deb.rotSpeed * dt;
    deb.flashTimer += dt;
    if (deb.x < -10) { deb.x = CFG.BW + 10; deb.y = U.r(0, CFG.BH); deb.flashTimer = 0; }
  }
  for (var k = 0; k < this.planets.length; k++) {
    var p = this.planets[k];
    p.x -= p.speed * dt;
    if (p.x < -p.r * 2) { p.x = CFG.BW + p.r * 2; p.y = U.r(40, CFG.BH - 40); }
  }
  // 流星生成与更新
  this.meteorTimer += dt;
  if (this.meteorTimer >= this.meteorInterval) {
    this.meteorTimer = 0;
    this.meteorInterval = U.r(1.5, 4.5);
    this.meteors.push({
      x: U.r(CFG.BW * 0.3, CFG.BW),
      y: U.r(0, CFG.BH * 0.5),
      vx: U.r(-350, -180),
      vy: U.r(80, 200),
      life: 1.0,
      decay: U.r(0.6, 1.2),
      length: U.r(40, 90),
      width: U.r(1.5, 3)
    });
  }
  for (var mi = this.meteors.length - 1; mi >= 0; mi--) {
    var m = this.meteors[mi];
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.life -= m.decay * dt;
    if (m.life <= 0) { this.meteors.splice(mi, 1); }
  }
  // 速度线更新
  this.speedLineTimer += dt;
  if (this.speedLineTimer > 0.08) {
    this.speedLineTimer = 0;
    if (Math.random() < 0.35) {
      this.speedLines.push({
        x: CFG.BW + 10, y: U.r(0, CFG.BH),
        speed: U.r(400, 800), length: U.r(20, 60),
        alpha: U.r(0.08, 0.2), life: 1.0
      });
    }
  }
  for (var si = this.speedLines.length - 1; si >= 0; si--) {
    var sl = this.speedLines[si];
    sl.x -= sl.speed * dt;
    sl.life -= dt * 1.5;
    if (sl.life <= 0 || sl.x + sl.length < 0) { this.speedLines.splice(si, 1); }
  }
};
StarField.prototype.render = function(ctx, time) {
  // 深空底色（微弱深蓝/紫色调）
  var bgGrad = ctx.createLinearGradient(0, 0, CFG.BW * 0.3, CFG.BH);
  bgGrad.addColorStop(0, '#03031a');
  bgGrad.addColorStop(0.3, '#050522');
  bgGrad.addColorStop(0.6, '#040420');
  bgGrad.addColorStop(1, '#020212');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, CFG.BW, CFG.BH);

  // 第二层星云（更远，更慢，先绘制）
  ctx.globalAlpha = 0.35;
  ctx.drawImage(this.nebulaCanvas2, this.nebulaOffX2, 0, CFG.BW, CFG.BH, 0, 0, CFG.BW, CFG.BH);
  ctx.drawImage(this.nebulaCanvas2, this.nebulaOffX2 + CFG.BW, 0, CFG.BW, CFG.BH, 0, 0, CFG.BW, CFG.BH);
  ctx.globalAlpha = 1;

  // 第一层星云流动
  ctx.globalAlpha = 0.55;
  ctx.drawImage(this.nebulaCanvas, this.nebulaOffX, 0, CFG.BW, CFG.BH, 0, 0, CFG.BW, CFG.BH);
  ctx.drawImage(this.nebulaCanvas, this.nebulaOffX + CFG.BW, 0, CFG.BW, CFG.BH, 0, 0, CFG.BW, CFG.BH);
  ctx.globalAlpha = 1;

  // 远处星系（最远层，极淡）
  for (var gi = 0; gi < this.distantGalaxies.length; gi++) {
    var gal = this.distantGalaxies[gi];
    this._renderGalaxy(ctx, gal, time);
  }

  // 宇宙尘埃
  for (var j = 0; j < this.cosmicStructures.length; j++) {
    var cs = this.cosmicStructures[j];
    var twinkle = 0.5 + 0.5 * Math.sin(time * cs.twinkleSpeed + cs.twinkleOffset);
    ctx.globalAlpha = cs.alpha * twinkle;
    ctx.fillStyle = cs.color;
    ctx.beginPath();
    ctx.arc(cs.x, cs.y, cs.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 太空碎片（金属反光）
  for (var di = 0; di < this.spaceDebris.length; di++) {
    var deb = this.spaceDebris[di];
    ctx.save();
    ctx.translate(deb.x, deb.y);
    ctx.rotate(deb.rotation);
    // 偶尔金属反光
    var flash = (deb.flashTimer % deb.flashInterval < 0.1) ? 0.4 : 0;
    ctx.globalAlpha = deb.alpha + flash;
    ctx.fillStyle = flash > 0 ? '#ffffff' : deb.color;
    ctx.fillRect(-deb.size / 2, -deb.size / 4, deb.size, deb.size / 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 小行星
  for (var ai = 0; ai < this.asteroids.length; ai++) {
    var ast = this.asteroids[ai];
    this._renderAsteroid(ctx, ast);
  }

  // 星球
  for (var k = 0; k < this.planets.length; k++) {
    var p = this.planets[k];
    this._renderPlanet(ctx, p, time);
  }

  // 四层星空（带景深：远层更暗淡）
  var depthAlpha = [0.35, 0.55, 0.75, 0.95];
  for (var li = 0; li < this.layers.length; li++) {
    var layer = this.layers[li];
    ctx.globalAlpha = depthAlpha[li];
    for (var i = 0; i < layer.stars.length; i++) {
      var s = layer.stars[i];
      var twinkle = 0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinkleOffset);
      var starColor = layer.colors[s.colorIdx];

      if (s.superBright) {
        // 超亮星：十字光芒 + 强辉光
        var sbAlpha = 0.7 + twinkle * 0.3;
        ctx.globalAlpha = sbAlpha;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = starColor;
        ctx.shadowBlur = 12;
        ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3);
        // 十字光芒
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.25 * sbAlpha) + ')';
        ctx.lineWidth = 0.8;
        var crossLen = 6 + twinkle * 4;
        ctx.beginPath();
        ctx.moveTo(s.x - crossLen, s.y); ctx.lineTo(s.x + crossLen, s.y);
        ctx.moveTo(s.x, s.y - crossLen); ctx.lineTo(s.x, s.y + crossLen);
        ctx.stroke();
        // 45度十字（更短更淡）
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.12 * sbAlpha) + ')';
        ctx.lineWidth = 0.5;
        var crossLen2 = crossLen * 0.6;
        ctx.beginPath();
        ctx.moveTo(s.x - crossLen2 * 0.7, s.y - crossLen2 * 0.7); ctx.lineTo(s.x + crossLen2 * 0.7, s.y + crossLen2 * 0.7);
        ctx.moveTo(s.x + crossLen2 * 0.7, s.y - crossLen2 * 0.7); ctx.lineTo(s.x - crossLen2 * 0.7, s.y + crossLen2 * 0.7);
        ctx.stroke();
        ctx.shadowBlur = 0;
      } else {
        var alpha = s.brightness * twinkle;
        ctx.fillStyle = starColor;
        ctx.shadowColor = starColor;
        ctx.shadowBlur = layer.size * 2.5;
        var sz = layer.size * (li === 0 ? 1 : (0.8 + twinkle * 0.4));
        ctx.fillRect(s.x - sz / 2, s.y - sz / 2, sz, sz);
        ctx.shadowBlur = 0;
      }
    }
  }
  ctx.globalAlpha = 1;

  // 流星
  for (var mi = 0; mi < this.meteors.length; mi++) {
    var m = this.meteors[mi];
    var mAlpha = m.life * 0.9;
    var mGrad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 0.12, m.y - m.vy * 0.12);
    mGrad.addColorStop(0, 'rgba(255,255,255,' + mAlpha + ')');
    mGrad.addColorStop(0.3, 'rgba(200,220,255,' + (mAlpha * 0.6) + ')');
    mGrad.addColorStop(1, 'rgba(100,150,255,0)');
    ctx.strokeStyle = mGrad;
    ctx.lineWidth = m.width * m.life;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    var tailLen = m.length * m.life;
    var dir = Math.atan2(m.vy, m.vx);
    ctx.lineTo(m.x - Math.cos(dir) * tailLen, m.y - Math.sin(dir) * tailLen);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // 速度线
  for (var si = 0; si < this.speedLines.length; si++) {
    var sl = this.speedLines[si];
    ctx.globalAlpha = sl.alpha * sl.life;
    ctx.strokeStyle = 'rgba(150,180,255,0.5)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(sl.x, sl.y);
    ctx.lineTo(sl.x + sl.length, sl.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 深空暗角
  ctx.drawImage(this.vignetteCanvas, 0, 0);

  // 扫描线效果
  ctx.fillStyle = 'rgba(0,0,0,0.02)';
  for (var y = 0; y < CFG.BH; y += 3) { ctx.fillRect(0, y, CFG.BW, 1); }
};

StarField.prototype._renderPlanet = function(ctx, p, time) {
  ctx.save();
  ctx.globalAlpha = 0.65;

  // 大气层光晕（外发光）
  var atmoGrad = ctx.createRadialGradient(p.x, p.y, p.r * 0.85, p.x, p.y, p.r * 1.4);
  atmoGrad.addColorStop(0, 'transparent');
  atmoGrad.addColorStop(0.4, p.atmosphereColor + '0.08)');
  atmoGrad.addColorStop(0.7, p.atmosphereColor + '0.04)');
  atmoGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = atmoGrad;
  ctx.fillRect(p.x - p.r * 1.5, p.y - p.r * 1.5, p.r * 3, p.r * 3);

  // 星球主体
  var grad = ctx.createRadialGradient(p.x - p.r * 0.35, p.y - p.r * 0.35, p.r * 0.08, p.x, p.y, p.r);
  grad.addColorStop(0, '#7788aa');
  grad.addColorStop(0.3, p.color);
  grad.addColorStop(0.85, '#080815');
  grad.addColorStop(1, '#020208');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fill();

  // 昼夜分界线（明暗分割）
  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.clip();
  // 右侧为暗面
  var nightGrad = ctx.createLinearGradient(p.x - p.r, p.y, p.x + p.r, p.y);
  nightGrad.addColorStop(0, 'rgba(0,0,0,0)');
  nightGrad.addColorStop(0.45, 'rgba(0,0,0,0)');
  nightGrad.addColorStop(0.6, 'rgba(0,0,5,0.25)');
  nightGrad.addColorStop(1, 'rgba(0,0,5,0.55)');
  ctx.fillStyle = nightGrad;
  ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);

  // 气态行星条纹
  if (p.bands && p.bandData) {
    for (var bi = 0; bi < p.bandData.length; bi++) {
      var bd = p.bandData[bi];
      ctx.globalAlpha = bd.alpha;
      ctx.fillStyle = 'hsla(220,30%,40%,' + bd.alpha + ')';
      ctx.fillRect(p.x - p.r, p.y + bd.y, p.r * 2, bd.height);
    }
  }

  // 环形山（岩石行星）
  if (p.type === 'rocky') {
    for (var i = 0; i < p.craters.length; i++) {
      var cr = p.craters[i];
      var cx = p.x + Math.cos(cr.angle) * cr.dist;
      var cy = p.y + Math.sin(cr.angle) * cr.dist;
      // 仅在星球圆内绘制
      var dx = cx - p.x, dy = cy - p.y;
      if (dx * dx + dy * dy < p.r * p.r) {
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.arc(cx, cy, cr.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  ctx.restore();

  // 大气层边缘发光（边缘线）
  ctx.globalAlpha = 0.3;
  var edgeGrad = ctx.createRadialGradient(p.x, p.y, p.r * 0.92, p.x, p.y, p.r * 1.05);
  edgeGrad.addColorStop(0, 'transparent');
  edgeGrad.addColorStop(0.5, p.atmosphereColor + '0.15)');
  edgeGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = edgeGrad;
  ctx.fillRect(p.x - p.r * 1.1, p.y - p.r * 1.1, p.r * 2.2, p.r * 2.2);

  // 光环（增强）
  if (p.ring) {
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = p.ringColor;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r * 1.8, p.r * 0.5, -0.35, 0, Math.PI * 2);
    ctx.stroke();
    // 第二环
    ctx.globalAlpha = 0.12;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r * 2.1, p.r * 0.58, -0.35, 0, Math.PI * 2);
    ctx.stroke();
    // 第三环（淡）
    ctx.globalAlpha = 0.06;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r * 2.35, p.r * 0.65, -0.35, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
};

StarField.prototype._renderAsteroid = function(ctx, ast) {
  ctx.save();
  ctx.translate(ast.x, ast.y);
  ctx.rotate(ast.rotation);
  ctx.globalAlpha = ast.alpha;

  // 不规则多边形
  ctx.beginPath();
  var v0 = ast.vertices[0];
  ctx.moveTo(Math.cos(v0.a) * v0.r, Math.sin(v0.a) * v0.r);
  for (var v = 1; v < ast.vertices.length; v++) {
    var vt = ast.vertices[v];
    ctx.lineTo(Math.cos(vt.a) * vt.r, Math.sin(vt.a) * vt.r);
  }
  ctx.closePath();

  // 简单纹理：径向渐变模拟光照
  var astGrad = ctx.createRadialGradient(-ast.baseR * 0.3, -ast.baseR * 0.3, 0, 0, 0, ast.baseR);
  astGrad.addColorStop(0, ast.highlightColor);
  astGrad.addColorStop(0.6, ast.color);
  astGrad.addColorStop(1, '#1a1510');
  ctx.fillStyle = astGrad;
  ctx.fill();

  // 边缘
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  ctx.restore();
};

StarField.prototype._renderGalaxy = function(ctx, gal, time) {
  ctx.save();
  ctx.translate(gal.x, gal.y);
  ctx.rotate(gal.rotation);
  ctx.globalAlpha = gal.alpha;

  // 椭圆模糊渐变
  var galGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, gal.rx);
  galGrad.addColorStop(0, 'hsla(' + gal.hue + ',50%,55%,0.3)');
  galGrad.addColorStop(0.3, 'hsla(' + gal.hue + ',40%,35%,0.15)');
  galGrad.addColorStop(0.6, 'hsla(' + gal.hue + ',30%,20%,0.06)');
  galGrad.addColorStop(1, 'transparent');

  ctx.save();
  ctx.scale(1, gal.ry / gal.rx);
  ctx.fillStyle = galGrad;
  ctx.beginPath();
  ctx.arc(0, 0, gal.rx, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 螺旋臂
  if (gal.spiral) {
    ctx.globalAlpha = gal.alpha * 0.5;
    ctx.strokeStyle = 'hsla(' + gal.hue + ',50%,50%,0.2)';
    ctx.lineWidth = 1.5;
    for (var arm = 0; arm < 2; arm++) {
      ctx.beginPath();
      var startAngle = arm * Math.PI;
      for (var t = 0; t < 3; t += 0.1) {
        var a = startAngle + t * 1.5;
        var r = t * gal.rx * 0.3;
        var px = Math.cos(a) * r;
        var py = Math.sin(a) * r * (gal.ry / gal.rx);
        if (t === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  // 中心亮点
  ctx.globalAlpha = gal.alpha * 1.5;
  ctx.fillStyle = 'hsla(' + gal.hue + ',60%,70%,0.3)';
  ctx.beginPath();
  ctx.arc(0, 0, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
};

// ========== ENTITY BASE ==========
function Entity(x, y, w, h) {
  this.x = x; this.y = y; this.width = w; this.height = h;
  this.vx = 0; this.vy = 0;
  this.active = true; this.rotation = 0; this.opacity = 1; this.scale = 1;
}
Entity.prototype.update = function(dt) {};
Entity.prototype.render = function(ctx) {};
Entity.prototype.getBounds = function() {
  return { x: this.x - this.width / 2, y: this.y - this.height / 2, w: this.width, h: this.height };
};
Entity.prototype.collidesWith = function(other) {
  var a = this.getBounds(), b = other.getBounds();
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
};

// ========== BULLET ==========
function Bullet() { Entity.call(this, 0, 0, 4, 10); this.reset(); }
Bullet.prototype = Object.create(Entity.prototype);
Bullet.prototype.constructor = Bullet;

Bullet.prototype.reset = function() {
  this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
  this.active = false; this.damage = 1; this.isEnemy = false;
  this.color = '#fff'; this.trail = [];
  this.homing = false; this.homingTarget = null; this.homingStrength = 0;
  this.bulletType = 'default'; this.age = 0;
};
Bullet.prototype.init = function(x, y, vx, vy, damage, color, isEnemy) {
  this.x = x; this.y = y; this.vx = vx; this.vy = vy;
  this.active = true; this.damage = damage; this.color = color; this.isEnemy = !!isEnemy;
  this.width = isEnemy ? 6 : 10; this.height = isEnemy ? 4 : 3;
  this.homing = false; this.homingTarget = null; this.trail = [];
  this.age = 0;
  // 自动判断子弹类型
  if (isEnemy) {
    if (color === '#ff2244' || color === '#ff6644') { this.bulletType = 'enemy_elite'; }
    else { this.bulletType = 'enemy_default'; }
  } else {
    if (color === '#ff8800' || this.homing) { this.bulletType = 'missile'; }
    else { this.bulletType = 'default'; }
  }
};
Bullet.prototype.update = function(dt) {
  if (this.homing && this.homingTarget && this.homingTarget.active) {
    var angle = U.ang(this.x, this.y, this.homingTarget.x, this.homingTarget.y);
    var currentAngle = Math.atan2(this.vy, this.vx);
    var diff = angle - currentAngle;
    while (diff > Math.PI) { diff -= Math.PI * 2; }
    while (diff < -Math.PI) { diff += Math.PI * 2; }
    var newAngle = currentAngle + U.cl(diff, -this.homingStrength * dt, this.homingStrength * dt);
    var speed = Math.hypot(this.vx, this.vy);
    this.vx = Math.cos(newAngle) * speed; this.vy = Math.sin(newAngle) * speed;
  }
  this.age += dt;
  this.trail.push({ x: this.x, y: this.y, life: 0.12 });
  this.x += this.vx * dt; this.y += this.vy * dt;
  for (var i = this.trail.length - 1; i >= 0; i--) {
    this.trail[i].life -= dt;
    if (this.trail[i].life <= 0) { this.trail.splice(i, 1); }
  }
  var pa = CFG.PA;
  if (this.x < pa.x - 20 || this.x > pa.x + pa.w + 20 || this.y < pa.y - 20 || this.y > pa.y + pa.h + 20) { this.active = false; }
};
Bullet.prototype.render = function(ctx) {
  var bt = this.bulletType;
  var dir = this.isEnemy ? -1 : 1; // 飞行方向：玩家向右1，敌机向左-1

  // ===== 玩家默认能量弹 =====
  if (bt === 'default') {
    // 锥形渐变拖尾
    var tLen = this.trail.length;
    for (var i = 0; i < tLen; i++) {
      var t = this.trail[i];
      var ratio = i / tLen;
      var alpha = (t.life / 0.12) * 0.7 * ratio;
      var tw = 3 + ratio * 3;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = this.color;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.moveTo(t.x + tw * dir, t.y);
      ctx.lineTo(t.x - tw * 0.3 * dir, t.y - tw * 0.4);
      ctx.lineTo(t.x - tw * 0.3 * dir, t.y + tw * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    // 拖尾闪烁小亮点
    if (this.trail.length > 2 && Math.random() < 0.3) {
