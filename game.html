  ctx.shadowBlur = 4;
  for (var k = 0; k < 3; k++) {
    var la = Math.PI / 3 * (k * 2) - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(la) * hw * 0.8, Math.sin(la) * hw * 0.8);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
};

// 狙击手 - 修长型
Enemy.prototype._renderSniper = function(ctx, w, h, t) {
  var hw = w / 2, hh = h / 2;
  var grad = ctx.createLinearGradient(-hw, 0, hw, 0);
  grad.addColorStop(0, '#1a0505');
  grad.addColorStop(0.3, '#3a0a0a');
  grad.addColorStop(0.5, '#5a1010');
  grad.addColorStop(0.7, '#3a0a0a');
  grad.addColorStop(1, '#1a0505');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 5;
  ctx.beginPath();
  ctx.moveTo(-hw, -hh * 0.3);
  ctx.lineTo(-hw * 0.5, -hh);
  ctx.lineTo(hw * 0.5, -hh * 0.5);
  ctx.lineTo(hw, 0);
  ctx.lineTo(hw * 0.5, hh * 0.5);
  ctx.lineTo(-hw * 0.5, hh);
  ctx.lineTo(-hw, hh * 0.3);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // 狙击镜线
  ctx.strokeStyle = 'rgba(255,100,100,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(hw, 0); ctx.lineTo(hw - 6, 0);
  ctx.stroke();
};

// 神风 - 尖刺型
Enemy.prototype._renderKamikaze = function(ctx, w, h, t) {
  var hw = w / 2, hh = h / 2;
  var flicker = 0.6 + Math.sin(t * 10) * 0.4;
  ctx.fillStyle = '#331100';
  ctx.beginPath();
  ctx.moveTo(-hw, 0);
  ctx.lineTo(0, -hh);
  ctx.lineTo(hw, -hh * 0.2);
  ctx.lineTo(hw, hh * 0.2);
  ctx.lineTo(0, hh);
  ctx.closePath();
  ctx.fill();
  // 尖刺
  ctx.fillStyle = '#ff6600';
  ctx.shadowColor = '#ff8800';
  ctx.shadowBlur = 8 * flicker;
  ctx.beginPath();
  ctx.moveTo(-hw, 0);
  ctx.lineTo(-hw - 4, -3);
  ctx.lineTo(-hw, -3);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-hw, 0);
  ctx.lineTo(-hw - 4, 3);
  ctx.lineTo(-hw, 3);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // 能量核心
  var core = ctx.createRadialGradient(0, 0, 0, 0, 0, 4);
  core.addColorStop(0, '#ff8800');
  core.addColorStop(0.5, '#ff4400');
  core.addColorStop(1, 'transparent');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
};

// 轰炸机 - 方形装甲
Enemy.prototype._renderBomber = function(ctx, w, h, t) {
  var hw = w / 2, hh = h / 2;
  var grad = ctx.createLinearGradient(0, -hh, 0, hh);
  grad.addColorStop(0, '#1a3a1a');
  grad.addColorStop(0.3, '#2a5a2a');
  grad.addColorStop(0.5, '#3a7a3a');
  grad.addColorStop(0.7, '#2a5a2a');
  grad.addColorStop(1, '#1a3a1a');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#44ff44';
  ctx.shadowBlur = 5;
  ctx.fillRect(-hw, -hh, w, h);
  ctx.shadowBlur = 0;
  // 装甲板线
  ctx.strokeStyle = 'rgba(100,255,100,0.3)';
  ctx.lineWidth = 0.8;
  ctx.strokeRect(-hw + 2, -hh + 2, w - 4, h - 4);
  // 能量核心
  ctx.fillStyle = '#88ff88';
  ctx.shadowColor = '#44ff44';
  ctx.shadowBlur = 4;
  ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
};

// ========== BOSS (横版：从右侧进入) ==========
function Boss() { Entity.call(this, 0, 0, 70, 80); this.reset(); }
Boss.prototype = Object.create(Entity.prototype);
Boss.prototype.constructor = Boss;

Boss.prototype.reset = function() {
  this.x = CFG.BW + 100; this.y = CFG.BH / 2; this.active = false;
  this.entering = false; this.phase = 1;
  this.hp = 300; this.maxHp = 300;
  this.name = '虚空守护者';
  this.phaseHp = [300, 200, 100];
  this.moveTimer = 0; this.fireTimer = 0; this.specialTimer = 0; this.time = 0;
  this.orbiters = [];
  this.targetY = CFG.BH / 2; this.entered = false;
};

Boss.prototype.init = function() {
  this.active = true; this.entering = true; this.entered = false;
  this.x = CFG.BW + 100; this.y = CFG.BH / 2; this.phase = 1;
  this.hp = this.phaseHp[0]; this.maxHp = this.phaseHp[0];
  this.moveTimer = 0; this.fireTimer = 0; this.specialTimer = 0; this.time = 0;
  this.orbiters = [];
  for (var i = 0; i < 4; i++) {
    this.orbiters.push({ angle: Math.PI / 2 * i, dist: 50, hp: 50, maxHp: 50, active: true, size: 12 });
  }
  this.targetY = CFG.BH / 2;
};

Boss.prototype._onPhaseChange = function(enemyBullets) {
  enemyBullets.list.length = 0;
  this.specialTimer = 1000;
  if (this.phase === 3) {
    for (var i = 0; i < this.orbiters.length; i++) { this.orbiters[i].active = false; }
  }
};

Boss.prototype._firePattern = function(player, enemyBullets) {
  var pool = enemyBullets.pool, list = enemyBullets.list;
  var cx = this.x, cy = this.y;

  if (this.phase === 1) {
    this.fireTimer = 800;
    for (var oi = 0; oi < this.orbiters.length; oi++) {
      var orb = this.orbiters[oi];
      if (!orb.active) { continue; }
      var ox = cx + Math.cos(orb.angle) * orb.dist;
      var oy = cy + Math.sin(orb.angle) * orb.dist;
      for (var i = 0; i < 6; i++) {
        var a = Math.PI * 2 / 6 * i + this.time;
        var b = pool.acquire();
        b.init(ox, oy, Math.cos(a) * 120, Math.sin(a) * 120, 1, '#ff6644', true);
        b.width = 4; b.height = 4; list.push(b);
      }
    }
    if (player && player.active) {
      var pa = U.ang(cx, cy, player.x, player.y);
      for (var j = -1; j <= 1; j++) {
        var bb = pool.acquire();
        var sa = pa + j * 0.2;
        bb.init(cx - 30, cy, Math.cos(sa) * 180, Math.sin(sa) * 180, 1, '#ff2244', true);
        list.push(bb);
      }
    }
  } else if (this.phase === 2) {
    this.fireTimer = 500;
    for (var oi2 = 0; oi2 < this.orbiters.length; oi2++) {
      var orb2 = this.orbiters[oi2];
      if (!orb2.active) { continue; }
      var ox2 = cx + Math.cos(orb2.angle) * orb2.dist;
      var oy2 = cy + Math.sin(orb2.angle) * orb2.dist;
      for (var k = 0; k < 10; k++) {
        var a2 = Math.PI * 2 / 10 * k + this.time * 2;
        var b2 = pool.acquire();
        b2.init(ox2, oy2, Math.cos(a2) * 100, Math.sin(a2) * 100, 1, '#ff6644', true);
        b2.width = 3; b2.height = 3; list.push(b2);
      }
    }
    if (this.specialTimer <= 0) {
      this.specialTimer = 3000;
      var sweepAngle = this.time * 2 % (Math.PI * 2);
      for (var m = 0; m < 8; m++) {
        var a3 = sweepAngle + m * 0.15;
        var b3 = pool.acquire();
        b3.init(cx - 30, cy, Math.cos(a3) * 250, Math.sin(a3) * 250, 1, '#ff0066', true);
        b3.width = 12; b3.height = 3; list.push(b3);
      }
    }
  } else {
    this.fireTimer = 300;
    for (var n = 0; n < 16; n++) {
      var a4 = Math.PI * 2 / 16 * n + this.time * 1.5;
      var b4 = pool.acquire();
      b4.init(cx, cy, Math.cos(a4) * 150, Math.sin(a4) * 150, 1, '#ff2244', true);
      b4.width = 3; b4.height = 3; list.push(b4);
    }
    if (Math.random() < 0.3) {
      for (var p = 0; p < 5; p++) {
        var b5 = pool.acquire();
        b5.init(CFG.BW + 10, U.r(40, CFG.BH - 40), U.r(-300, -150), U.r(-30, 30), 1, '#ff8800', true);
        b5.width = 5; b5.height = 5; list.push(b5);
      }
    }
  }
};

Boss.prototype.update = function(dt, player, enemyBullets) {
  if (!this.active) { return; }
  this.time += dt; this.moveTimer += dt;
  this.fireTimer -= dt * 1000; this.specialTimer -= dt * 1000;

  if (this.entering) {
    this.x = U.lerp(this.x, CFG.BW - 150, dt * 2);
    if (Math.abs(this.x - (CFG.BW - 150)) < 2) { this.x = CFG.BW - 150; this.entering = false; this.entered = true; }
    return;
  }

  var hr = this.hp / this.phaseHp[0];
  if (hr <= 0.33 && this.phase < 3) { this.phase = 3; this._onPhaseChange(enemyBullets); }
  else if (hr <= 0.66 && this.phase < 2) { this.phase = 2; this._onPhaseChange(enemyBullets); }

  if (this.phase === 1) {
    this.targetY = CFG.BH / 2 + Math.sin(this.time * 0.5) * 120;
  } else if (this.phase === 2) {
    if (player && player.active) { this.targetY = U.lerp(this.targetY, player.y, dt * 1.5); }
  } else {
    this.targetY = CFG.BH / 2 + Math.sin(this.time * 2) * 150;
  }
  this.y = U.lerp(this.y, this.targetY, dt * 2);

  for (var i = 0; i < this.orbiters.length; i++) {
    var o = this.orbiters[i];
    if (!o.active) { continue; }
    o.angle += dt * (this.phase >= 2 ? 3 : 1.5);
    o.dist = 50 + Math.sin(this.time * 2 + o.angle) * 15;
  }

  if (this.fireTimer <= 0) { this._firePattern(player, enemyBullets); }
};

Boss.prototype.render = function(ctx) {
  if (!this.active) { return; }
  var cx = this.x, cy = this.y;
  var t = this.time;

  // 环绕粒子
  for (var i = 0; i < this.orbiters.length; i++) {
    var o = this.orbiters[i];
    if (!o.active) { continue; }
    var ox = cx + Math.cos(o.angle) * o.dist;
    var oy = cy + Math.sin(o.angle) * o.dist;
    // 轨道器光晕
    var oGlow = ctx.createRadialGradient(ox, oy, 0, ox, oy, o.size);
    oGlow.addColorStop(0, 'rgba(255,100,50,0.4)');
    oGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = oGlow;
    ctx.beginPath(); ctx.arc(ox, oy, o.size, 0, Math.PI * 2); ctx.fill();
    // 轨道器主体
    var oGrad = ctx.createRadialGradient(ox - 2, oy - 2, 1, ox, oy, o.size / 2);
    oGrad.addColorStop(0, '#ffcc88');
    oGrad.addColorStop(0.5, '#ff6644');
    oGrad.addColorStop(1, '#881100');
    ctx.fillStyle = oGrad;
    ctx.shadowColor = '#ff6644'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(ox, oy, o.size / 2, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // 轨道器血条
    if (o.hp < o.maxHp) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(ox - 8, oy - o.size - 4, 16, 2);
      ctx.fillStyle = '#ff4466'; ctx.fillRect(ox - 8, oy - o.size - 4, 16 * (o.hp / o.maxHp), 2);
    }
  }

  // === 能量护盾 ===
  var shieldAlpha = 0.08 + 0.04 * Math.sin(t * 1.5);
  var shieldR = this.width * 1.1;
  ctx.strokeStyle = 'rgba(255,50,50,' + shieldAlpha + ')';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.ellipse(cx, cy, shieldR, shieldR * 0.7, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // === 多层装甲主体 ===
  var w = this.width, h = this.height;
  var hw = w / 2, hh = h / 2;

  // 最外层 - 暗色金属基座
  ctx.fillStyle = '#0a0505';
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw, hh, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 第二层 - 装甲板
  var armorGrad = ctx.createRadialGradient(cx - hw * 0.2, cy - hh * 0.2, hw * 0.1, cx, cy, hw * 0.8);
  armorGrad.addColorStop(0, '#4a1515');
  armorGrad.addColorStop(0.4, '#2a0a0a');
  armorGrad.addColorStop(0.7, '#3a1010');
  armorGrad.addColorStop(1, '#1a0505');
  ctx.fillStyle = armorGrad;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw * 0.85, hh * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();

  // 第三层 - 核心区
  var coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, hw * 0.5);
  coreGrad.addColorStop(0, '#ff2244');
  coreGrad.addColorStop(0.3, '#cc1133');
  coreGrad.addColorStop(0.6, '#881122');
  coreGrad.addColorStop(1, '#330a0a');
  ctx.fillStyle = coreGrad;
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw * 0.5, hh * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // === 装甲板分割线 ===
  ctx.strokeStyle = 'rgba(255,100,80,0.3)';
  ctx.lineWidth = 1;
  for (var j = 0; j < 6; j++) {
    var la = Math.PI / 3 * j + t * 0.3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(la) * hw * 0.8, cy + Math.sin(la) * hh * 0.8);
    ctx.stroke();
  }

  // === 中央能量核心 ===
  // 核心脉动
  var pulse = 1 + Math.sin(t * 3) * 0.15;
  var icGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 12 * pulse);
  icGlow.addColorStop(0, '#ffffff');
  icGlow.addColorStop(0.2, '#ff6688');
  icGlow.addColorStop(0.5, '#ff2244');
  icGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = icGlow;
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 20 * pulse;
  ctx.beginPath();
  ctx.arc(cx, cy, 12 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 核心亮点
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#ff8888';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // === 发光线路 ===
  ctx.strokeStyle = 'rgba(255,80,80,' + (0.4 + Math.sin(t * 4) * 0.2) + ')';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#ff4444';
  ctx.shadowBlur = 6;
  // 水平线
  ctx.beginPath();
  ctx.moveTo(cx - hw * 0.4, cy);
  ctx.lineTo(cx + hw * 0.4, cy);
  ctx.stroke();
  // 垂直线
  ctx.beginPath();
  ctx.moveTo(cx, cy - hh * 0.4);
  ctx.lineTo(cx, cy + hh * 0.4);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // === 装甲边缘高光 ===
  ctx.strokeStyle = 'rgba(255,150,130,0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw * 0.85, hh * 0.85, 0, 0, Math.PI * 2);
  ctx.stroke();

  // === 环绕粒子轨道 ===
  ctx.strokeStyle = 'rgba(255,100,50,0.12)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw * 0.9, hh * 0.9, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
};

Boss.prototype.getOrbiterBounds = function(index) {
  var o = this.orbiters[index];
  if (!o || !o.active) { return null; }
  var ox = this.x + Math.cos(o.angle) * o.dist;
  var oy = this.y + Math.sin(o.angle) * o.dist;
  return { x: ox - o.size / 2 - 2, y: oy - o.size / 2 - 2, w: o.size + 4, h: o.size + 4 };
};

// ========== POWERUP ==========
function PowerUp() { Entity.call(this, 0, 0, 20, 20); this.reset(); }
PowerUp.prototype = Object.create(Entity.prototype);
PowerUp.prototype.constructor = PowerUp;

PowerUp.prototype.reset = function() {
  this.x = 0; this.y = 0; this.active = false;
  this.type = 'weapon'; this.vx = -100; this.glowTimer = 0;
};

var POWERUP_CONFIGS = {
  weapon:    { color: '#ff4466', symbol: 'W' },
  subweapon: { color: '#4488ff', symbol: 'S' },
  health:    { color: '#44ff44', symbol: '\u2665' },
  shield:    { color: '#00ccff', symbol: '\u25C8' },
  bomb:      { color: '#ff8800', symbol: '\uD83D\uDCA3' },
  coin:      { color: '#ffd700', symbol: '$' },
  life:      { color: '#ff66ff', symbol: '1UP' },
  power:     { color: '#aa44ff', symbol: '\u26A1' }
};

PowerUp.prototype.init = function(x, y, type) {
  this.x = x; this.y = y; this.active = true;
  this.type = type; this.vx = -100; this.glowTimer = 0;
  this.cfg = POWERUP_CONFIGS[type] || POWERUP_CONFIGS.weapon;
};

PowerUp.prototype.update = function(dt) {
  this.x += this.vx * dt;
  this.glowTimer += dt;
  if (this.x < -30) { this.active = false; }
};

PowerUp.prototype.render = function(ctx) {
  var pulse = 1 + Math.sin(this.glowTimer * 4) * 0.15;
  ctx.save();
  ctx.translate(this.x, this.y);
  ctx.scale(pulse, pulse);
  // 外层光晕
  var glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.width / 2 + 2);
  glowGrad.addColorStop(0, this.cfg.color + '66');
  glowGrad.addColorStop(0.5, this.cfg.color + '22');
  glowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrad;
  ctx.beginPath(); ctx.arc(0, 0, this.width / 2 + 2, 0, Math.PI * 2); ctx.fill();
  // 边框
  ctx.strokeStyle = this.cfg.color;
  ctx.lineWidth = 1.5;
  ctx.shadowColor = this.cfg.color;
  ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2); ctx.stroke();
  ctx.shadowBlur = 0;
  // 填充
  ctx.fillStyle = this.cfg.color + '33';
  ctx.beginPath(); ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2); ctx.fill();
  // 符号
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = this.cfg.color;
  ctx.shadowBlur = 6;
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(this.cfg.symbol, 0, 0);
  ctx.shadowBlur = 0;
  ctx.restore();
};

// ========== COLLISION ==========
var Col = {};

Col.checkBulletEnemy = function(bullets, enemies, particles, audio) {
  for (var bi = 0; bi < bullets.length; bi++) {
    var b = bullets[bi];
    if (!b.active || b.isEnemy) { continue; }
    for (var ei = 0; ei < enemies.length; ei++) {
      var e = enemies[ei];
      if (!e.active) { continue; }
      if (b.collidesWith(e)) {
        b.active = false; e.hp -= b.damage;
        // 命中反馈
        particles.emitHitSpark(b.x, b.y, e.color);
        particles.emitEnergyRing(b.x, b.y, 8, '#ffffff');
        e.hitFlash = 0.08;
        audio.hit();
        if (e.hp <= 0) {
          e.active = false;
          particles.createExplosion(e.x, e.y, 'small');
          particles.emitShockwave(e.x, e.y, 20, e.color);
          audio.explode('small');
          return { killed: true, enemy: e, x: e.x, y: e.y, score: e.score };
        }
        return { killed: false };
      }
    }
  }
  return null;
};

Col.checkBulletPlayer = function(enemyBullets, player, particles, audio, camera) {
  if (!player.active || player.invincible || player.dashing) { return false; }
  for (var i = 0; i < enemyBullets.length; i++) {
    var b = enemyBullets[i];
    if (!b.active) { continue; }
    if (b.collidesWith(player)) {
      b.active = false;
      if (player.takeDamage(1)) {
        particles.emit(player.x, player.y, 10, { color: '#ff4466', speed: 200, spread: Math.PI * 2, life: 0.3, size: 3 });
        audio.hit(); camera.shake(CFG.SH.ph.i, CFG.SH.ph.d);
        return true;
      }
    }
  }
  return false;
};

Col.checkBulletBoss = function(bullets, boss, particles) {
  if (!boss.active || !boss.entered) { return null; }
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    if (!b.active || b.isEnemy) { continue; }
    if (b.collidesWith(boss)) {
      b.active = false; boss.hp -= b.damage;
      particles.emitHitSpark(b.x, b.y, '#ff6644');
      particles.emitEnergyRing(b.x, b.y, 10, '#ff4466');
      return { hit: true, damage: b.damage };
    }
    for (var oi = 0; oi < boss.orbiters.length; oi++) {
      var ob = boss.getOrbiterBounds(oi);
      if (!ob) { continue; }
      var bb = b.getBounds();
      if (bb.x < ob.x + ob.w && bb.x + bb.w > ob.x && bb.y < ob.y + ob.h && bb.y + bb.h > ob.y) {
        b.active = false; boss.orbiters[oi].hp -= b.damage;
        if (boss.orbiters[oi].hp <= 0) { boss.orbiters[oi].active = false; }
        particles.emitHitSpark(b.x, b.y, '#ff8844');
        particles.emitEnergyRing(b.x, b.y, 6, '#ff8844');
        return { hit: false };
      }
    }
  }
  return null;
};

Col.checkEnemyPlayer = function(enemies, player, particles, audio, camera) {
  if (!player.active || player.invincible || player.dashing) { return; }
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    if (!e.active) { continue; }
    if (e.collidesWith(player)) {
      e.active = false;
      particles.createExplosion(e.x, e.y, 'small');
      particles.emitShockwave(e.x, e.y, 20, '#ff4466');
      if (player.takeDamage(1)) { audio.explode(); camera.shake(CFG.SH.ph.i, CFG.SH.ph.d); }
    }
  }
};

Col.checkPowerupPlayer = function(powerups, player, audio) {
  for (var i = 0; i < powerups.length; i++) {
    var p = powerups[i];
    if (!p.active) { continue; }
    if (p.collidesWith(player)) {
      p.active = false; audio.powerup();
      return p.type;
    }
  }
  return null;
};

// ========== SPAWNER (横版：从右侧生成敌人) ==========
function Spawner() {
  this.timer = 0; this.eliteTimer = 0;
  this.currentInterval = CFG.SII;
  this.totalTime = 0; this.bossSpawned = false; this.bossDefeated = false;
}
Spawner.prototype.reset = function() {
  this.timer = 0; this.eliteTimer = 0;
  this.currentInterval = CFG.SII;
  this.totalTime = 0; this.bossSpawned = false; this.bossDefeated = false;
};
Spawner.prototype.update = function(dt, enemies, pool) {
  this.totalTime += dt * 1000;
  this.timer -= dt * 1000;
  this.eliteTimer -= dt * 1000;
  this.currentInterval = Math.max(CFG.SIM, CFG.SII - this.totalTime * CFG.DRR / 1000);
  if (this.timer <= 0) { this.timer = this.currentInterval; this._spawnWave(enemies, pool); }
};
Spawner.prototype._getWeights = function() {
  var t = this.totalTime / 1000;
  return {
    scout: Math.max(10, 40 - t * 0.5),
    fighter: 25, tank: Math.min(30, 5 + t * 0.3),
    sniper: Math.min(25, 5 + t * 0.2),
    kamikaze: Math.min(20, 5 + t * 0.15),
    bomber: Math.min(20, 5 + t * 0.15)
  };
};
Spawner.prototype._weightedRandom = function(items, weights) {
  var total = 0;
  var keys = Object.keys(weights);
  for (var i = 0; i < keys.length; i++) { total += weights[keys[i]]; }
  var r = Math.random() * total;
  for (var j = 0; j < items.length; j++) { r -= weights[items[j]] || 0; if (r <= 0) { return items[j]; } }
  return items[0];
};
Spawner.prototype._spawnWave = function(enemies, pool) {
  var pa = CFG.PA;
  var types = ['scout', 'scout', 'fighter', 'fighter', 'tank', 'sniper', 'kamikaze', 'bomber'];
  var weights = this._getWeights();
  var type = this._weightedRandom(types, weights);
  var count = type === 'scout' ? U.ri(1, 3) : 1;
  for (var i = 0; i < count; i++) {
    var e = pool.acquire();
    var x = CFG.BW + U.r(0, 100);
    var y = U.r(pa.y + 30, pa.y + pa.h - 30);
    e.init(type, x, y); enemies.push(e);
  }
};
Spawner.prototype.shouldSpawnBoss = function() {
  return !this.bossSpawned && this.totalTime >= CFG.BST;
};

// ========== COMBO ==========
function Combo() {
  this.count = 0; this.timer = 0; this.multiplier = 1.0;
  this.displayTimer = 0; this.displayText = '';
}
Combo.prototype.reset = function() {
  this.count = 0; this.timer = 0; this.multiplier = 1.0;
  this.displayTimer = 0; this.displayText = '';
};
Combo.prototype.addKill = function() {
  this.count++; this.timer = CFG.CT / 1000;
  this._updateMultiplier(); this.displayTimer = 1.5;
  this.displayText = '\u00D7' + this.multiplier.toFixed(1);
};
Combo.prototype._updateMultiplier = function() {
  if (this.count >= 200) { this.multiplier = 10.0; }
  else if (this.count >= 100) { this.multiplier = 5.0; }
  else if (this.count >= 50) { this.multiplier = 3.0; }
  else if (this.count >= 30) { this.multiplier = 2.0; }
  else if (this.count >= 10) { this.multiplier = 1.5; }
  else { this.multiplier = 1.0; }
};
Combo.prototype.update = function(dt) {
  if (this.timer > 0) { this.timer -= dt; if (this.timer <= 0) { this.count = 0; this.multiplier = 1.0; } }
  if (this.displayTimer > 0) { this.displayTimer -= dt; }
};
Combo.prototype.getMultiplierColor = function() {
  if (this.multiplier >= 10) { return '#ff00ff'; }
  if (this.multiplier >= 5) { return '#ffd700'; }
  if (this.multiplier >= 3) { return '#aa44ff'; }
  if (this.multiplier >= 2) { return '#4488ff'; }
  if (this.multiplier >= 1.5) { return '#44ff44'; }
  return '#ffffff';
};

// ========== POWERUP MANAGER ==========
var PUM = {
  dropTypes: ['weapon', 'weapon', 'subweapon', 'subweapon', 'health', 'shield', 'bomb', 'coin', 'coin', 'coin', 'life', 'power'],
  spawn: function(x, y, powerups, pool) {
    var type = this.dropTypes[U.ri(0, this.dropTypes.length - 1)];
    var p = pool.acquire();
    p.init(x, y, type); powerups.push(p);
  },
  apply: function(type, player) {
    switch (type) {
      case 'weapon': player.weaponLevel = Math.min(5, player.weaponLevel + 1); break;
      case 'subweapon': player.subWeaponLevel = Math.min(4, player.subWeaponLevel + 1); break;
      case 'health': player.hp = Math.min(player.maxHp, player.hp + 1); break;
      case 'shield': player.shield = Math.min(player.maxShield, player.shield + 30); break;
      case 'bomb': player.bombs = Math.min(CFG.BMAX + 2, player.bombs + 1); break;
      case 'coin': return 500;
      case 'life': player.lives = Math.min(CFG.PML, player.lives + 1); break;
      case 'power': player.weaponLevel = 5; player.invincible = true; player.invincibleTimer = 5000; break;
    }
    return 0;
  }
};

// ========== MAIN GAME ==========
function Game() {
  this.cv = document.getElementById('cv');
  this.ctx = this.cv.getContext('2d');
  this.state = 'MENU';
  this.time = 0; this.lastTime = 0;
  this.score = 0; this.highScore = S.get('highscore', 0);
  this.enemiesKilled = 0; this.bossesDefeated = 0;
  this.bossIntroTimer = 0;
  this.bombActive = false; this.bombTimer = 0; this.bombFlash = 0;
  this.screenFlash = 0;       // 屏幕闪光
  this.slowMotion = 0;        // 慢动作系数
  this.slowMotionTarget = 0;  // 慢动作目标值

  this.input = new Input();
  this.audio = new AudioManager();
  this.camera = new Camera();
  this.particles = new ParticleSystem();
  this.starField = new StarField();
  this.combo = new Combo();
  this.spawner = new Spawner();

  this.player = new Player();
  this.playerBullets = { list: [], pool: new Pool(function() { return new Bullet(); }, function(b) { b.reset(); }, 200) };
  this.enemyBullets = { list: [], pool: new Pool(function() { return new Bullet(); }, function(b) { b.reset(); }, 400) };
  this.enemies = [];
  this.enemyPool = new Pool(function() { return new Enemy(); }, function(e) { e.reset(); }, 40);
  this.powerups = [];
  this.powerupPool = new Pool(function() { return new PowerUp(); }, function(p) { p.reset(); }, 20);
  this.boss = new Boss();

  this._initUI();
  this._initAudio();
  this._resize();
  window.addEventListener('resize', this._resize.bind(this));

  this.lastTime = performance.now();
  this._loop = this._loop.bind(this);
  window._gameInstance = this;
  requestAnimationFrame(this._loop);
  this._showMenu();
}

Game.prototype._resize = function() {
  var container = document.getElementById('gc');
  var maxW = window.innerWidth;
  var maxH = window.innerHeight;
  var scale = Math.min(maxW / CFG.BW, maxH / CFG.BH);
  this.cv.width = CFG.BW;
  this.cv.height = CFG.BH;
  container.style.width = (CFG.BW * scale) + 'px';
  container.style.height = (CFG.BH * scale) + 'px';
  container.style.setProperty('--scale', scale);
};

Game.prototype._initUI = function() {
  var self = this;
  document.getElementById('bstart').addEventListener('click', function() { self._startGame(); });
  document.getElementById('brestart').addEventListener('click', function() { self._startGame(); });
  document.getElementById('bresume').addEventListener('click', function() { self._resumeGame(); });
  document.getElementById('bquit').addEventListener('click', function() { self._quitToMenu(); });
  document.getElementById('bmenu').addEventListener('click', function() { self._quitToMenu(); });
  document.getElementById('bb').addEventListener('click', function() { if (self.state === 'PLAYING') { self._triggerBomb(); } });
  document.getElementById('bs').addEventListener('click', function() { if (self.state === 'PLAYING') { self._triggerDash(); } });
};

Game.prototype._initAudio = function() {
  var self = this;
  // 首次启动音频按钮（浏览器要求用户交互）
  document.getElementById('audio-start').style.display = 'flex';
  document.getElementById('asbtn-start').addEventListener('click', function() {
    self.audio.activate();
    document.getElementById('audio-start').style.display = 'none';
    document.getElementById('ac').style.display = 'flex';
  });
  // 静音按钮
  document.getElementById('abtn-mute').addEventListener('click', function() {
    var muted = self.audio.toggleMute();
    this.textContent = muted ? '✕' : '♪';
    this.className = 'abtn' + (muted ? ' muted' : '');
  });
  // 通讯定时器
  this._commsTimer = U.r(8, 20);
};

Game.prototype._show = function() {
  for (var i = 0; i < arguments.length; i++) { document.getElementById(arguments[i]).style.display = 'flex'; }
};
Game.prototype._hide = function() {
  for (var i = 0; i < arguments.length; i++) { document.getElementById(arguments[i]).style.display = 'none'; }
};

Game.prototype._showMenu = function() {
  this.state = 'MENU';
  this.highScore = S.get('highscore', 0);
  this._show('menu'); this._hide('hud', 'bhp', 'pause', 'go', 'warn');
  document.getElementById('mhs').textContent = '最高分：' + this.highScore.toLocaleString();
  this.audio.setMusicState('ambient');
};

Game.prototype._startGame = function() {
  this.state = 'PLAYING';
  this.score = 0; this.enemiesKilled = 0; this.bossesDefeated = 0;
  this.bossIntroTimer = 0; this.bombActive = false; this.bombTimer = 0; this.bombFlash = 0;

  this.player.reset(); this.combo.reset(); this.spawner.reset();
  this.particles.clear(); this.boss.reset();

  this.playerBullets.list.length = 0;
  this.enemyBullets.list.length = 0;
  this.enemies.length = 0;
  this.powerups.length = 0;

  this._hide('menu', 'pause', 'go', 'warn', 'bhp');
  this._show('hud');
  this.audio._ensure();
};

Game.prototype._pauseGame = function() {
  if (this.state === 'PLAYING' || this.state === 'BOSS_INTRO') { this.state = 'PAUSED'; this._show('pause'); }
};
Game.prototype._resumeGame = function() {
  if (this.state === 'PAUSED') { this.state = 'PLAYING'; this._hide('pause'); }
};
Game.prototype._quitToMenu = function() { this._showMenu(); };

Game.prototype._triggerBomb = function() {
  if (this.state !== 'PLAYING') { return; }
  if (!this.player.useBomb()) { return; }
  this.bombActive = true; this.bombTimer = 0.4; this.bombFlash = 0;
  this.audio.bomb(); this.camera.shake(CFG.SH.bomb.i, CFG.SH.bomb.d);
  this.enemyBullets.list.length = 0;

  for (var i = 0; i < this.enemies.length; i++) {
    var e = this.enemies[i];
    if (!e.active) { continue; }
    e.hp -= CFG.BDMG;
    if (e.hp <= 0) {
      e.active = false;
      this.particles.emit(e.x, e.y, 8, { color: e.color, speed: 150, spread: Math.PI * 2, life: 0.4, size: 2.5 });
      this.enemiesKilled++;
      this.score += Math.floor(e.score * this.combo.multiplier);
      this.combo.addKill();
      if (Math.random() < e.dropChance) { PUM.spawn(e.x, e.y, this.powerups, this.powerupPool); }
    }
  }
  if (this.boss.active && this.boss.entered) {
    this.boss.hp -= CFG.BDMG;
    for (var j = 0; j < this.boss.orbiters.length; j++) { this.boss.orbiters[j].hp -= CFG.BDMG; }
  }
};

Game.prototype._triggerDash = function() {
  if (this.state !== 'PLAYING') { return; }
  this.player.dash(this.input); this.audio.dash();
};

Game.prototype._updateHUD = function() {
  var p = this.player;
  document.getElementById('hl').textContent = '\u2665'.repeat(p.lives);
  document.getElementById('hsh').textContent = p.shield > 0 ? '\u25C8'.repeat(Math.ceil(p.shield / 20)) : '';
  document.getElementById('hb').textContent = '\uD83D\uDCA3\u00D7' + p.bombs;
  document.getElementById('hsc').textContent = this.score.toLocaleString();

  var c = this.combo;
  document.getElementById('hco').textContent = c.count >= 10 ? c.count + '连击 \u00D7' + c.multiplier.toFixed(1) : '';
  document.getElementById('hco').style.color = c.getMultiplierColor();

  document.getElementById('hskd').textContent = p.dashCooldown <= 0 ? '闪现 就绪' : '闪现 ' + Math.ceil(p.dashCooldown / 1000) + 's';
  document.getElementById('hskd').className = 'hsk' + (p.dashCooldown <= 0 ? ' rdy' : '');
  document.getElementById('hskb').textContent = '炸弹 [B] \u00D7' + p.bombs;
  document.getElementById('hskb').className = 'hsk' + (p.bombs > 0 ? ' rdy' : '');

  if (this.boss.active && this.boss.entered) {
    this._show('bhp');
    document.getElementById('bn').textContent = this.boss.name;
    document.getElementById('bhi').style.width = Math.max(0, this.boss.hp / this.boss.phaseHp[0] * 100) + '%';
  } else { this._hide('bhp'); }
};

Game.prototype._updateMusicState = function() {
  // 根据游戏状态自动切换BGM层
  if (this.boss.active && this.boss.entered) {
    this.audio.setMusicState('boss');
  } else if (this.enemies.length > 3 || this.combo.count > 5) {
    this.audio.setMusicState('battle');
  } else if (this.state === 'PLAYING') {
    this.audio.setMusicState('explore');
  } else {
    this.audio.setMusicState('ambient');
  }
};

Game.prototype._gameOver = function() {
  this.state = 'GAMEOVER';
  var isNewRecord = this.score > this.highScore;
  if (isNewRecord) { this.highScore = this.score; S.set('highscore', this.highScore); }
  this._hide('hud', 'bhp'); this._show('go');
  document.getElementById('gosc').textContent = this.score.toLocaleString();
  document.getElementById('gonr').style.display = isNewRecord ? 'block' : 'none';
  document.getElementById('gost').innerHTML =
    '击杀数：<span>' + this.enemiesKilled + '</span><br>' +
    '最大连击：<span>\u00D7' + this.combo.multiplier.toFixed(1) + '</span><br>' +
    'Boss击杀：<span>' + this.bossesDefeated + '</span>';

  var grade, gColor;
  if (this.score >= 500000) { grade = 'S'; gColor = '#ffd700'; }
  else if (this.score >= 300000) { grade = 'A'; gColor = '#ff4466'; }
  else if (this.score >= 150000) { grade = 'B'; gColor = '#ff8800'; }
  else if (this.score >= 50000) { grade = 'C'; gColor = '#44ff44'; }
  else { grade = 'D'; gColor = '#8899aa'; }
  var stars = ['D','C','B','A','S'].indexOf(grade) + 1;
  var gog = document.getElementById('gog');
  gog.textContent = '\u2B50'.repeat(stars) + ' ' + grade + ' 级';
  gog.style.color = gColor;
};

Game.prototype._cleanup = function(bulletList) {
  for (var i = bulletList.list.length - 1; i >= 0; i--) {
    if (!bulletList.list[i].active) { bulletList.pool.release(bulletList.list[i]); bulletList.list.splice(i, 1); }
  }
};

Game.prototype._cleanupArray = function(arr, pool) {
  for (var i = arr.length - 1; i >= 0; i--) {
    if (!arr[i].active) { pool.release(arr[i]); arr.splice(i, 1); }
  }
};

Game.prototype._loop = function(timestamp) {
  requestAnimationFrame(this._loop);
  var dt = (timestamp - this.lastTime) / 1000;
  this.lastTime = timestamp;
  if (dt > 0.1) { dt = 0.1; }

  // 慢动作
  this.slowMotion = U.lerp(this.slowMotion, this.slowMotionTarget, dt * 12);
  if (Math.abs(this.slowMotion - this.slowMotionTarget) < 0.001) { this.slowMotion = this.slowMotionTarget; }
  var slowFactor = 1 - this.slowMotion * 0.6;
  dt *= slowFactor;
  this.time += dt;

  this._update(dt);
  this._render();
  this.input.clearFrame();
};

Game.prototype._update = function(dt) {
  this.camera.update(dt);
  // 屏幕闪光衰减
  if (this.screenFlash > 0) { this.screenFlash -= dt * 3; }
  // 慢动作自动恢复
  if (this.slowMotionTarget > 0) { this.slowMotionTarget = Math.max(0, this.slowMotionTarget - dt * 0.8); }

  if (this.state === 'MENU' || this.state === 'GAMEOVER') {
    this.starField.update(dt); return;
  }
  if (this.state === 'PAUSED') { return; }

  if (this.input.wasPressed('Escape')) { this._pauseGame(); return; }
  if (this.input.wasPressed('KeyB')) { this._triggerBomb(); }
  if (this.input.wasPressed('Space')) { this._triggerDash(); }

  if (this.bombActive) {
    this.bombTimer -= dt; this.bombFlash += dt;
    if (this.bombTimer <= 0) { this.bombActive = false; }
  }

  if (this.state === 'BOSS_INTRO') {
    this.bossIntroTimer -= dt;
    if (this.bossIntroTimer <= 0) { this.state = 'PLAYING'; this._hide('warn'); }
    this.starField.update(dt); this.particles.update(dt);
    return;
  }

  this.starField.update(dt);
  this.particles.update(dt);
  this.combo.update(dt);

  // 音频更新
  if (this.audio.enabled) {
    this.audio._updateMusic(dt);
    // 太空通讯定时
    this._commsTimer -= dt;
    if (this._commsTimer <= 0) {
      this._commsTimer = U.r(10, 25);
      this.audio.spaceComms();
    }
    // 引擎音量随速度变化
    if (this.audio.envNodes && this.audio.envNodes.engine) {
      var speed = Math.hypot(this.player.vx || 0, this.player.vy || 0);
      var engineVol = 0.008 + speed * 0.00005;
      this.audio.envNodes.engine.gain.gain.setTargetAtTime(engineVol, this.audio.ctx.currentTime, 0.1);
    }
  }

  // BGM动态切换
  this._updateMusicState();

  this.player.update(dt, this.input);
  if (this.player.canFire()) { this.player.fire(this.playerBullets, this.particles); }
  this.player.fireSubWeapon(this.playerBullets, this.enemies);

  // 引擎尾焰粒子
  if (this.player.active) {
    this.particles.emitEngine(this.player.x - this.player.width / 2, this.player.y, -this.player.vx, this.player.vy, true);
  }
  // 敌机引擎尾焰
  for (var ei = 0; ei < this.enemies.length; ei++) {
    var e = this.enemies[ei];
    if (e.active) {
      this.particles.emitEngine(e.x + e.width / 2, e.y + e.floatOff, -e.vx, e.vy, false);
    }
  }

  for (var i = 0; i < this.playerBullets.list.length; i++) {
    var b = this.playerBullets.list[i];
    if (!b.active) { continue; }
    if (b.homing) {
      var target = null, minDist = Infinity;
      for (var j = 0; j < this.enemies.length; j++) {
        var e = this.enemies[j]; if (!e.active) { continue; }
        var d = U.dist(b.x, b.y, e.x, e.y);
        if (d < minDist) { minDist = d; target = e; }
      }
      if (this.boss.active && this.boss.entered) {
        var db = U.dist(b.x, b.y, this.boss.x, this.boss.y);
        if (db < minDist) { minDist = db; target = this.boss; }
      }
      b.homingTarget = target;
    }
    b.update(dt);
    // 子弹飞行轨迹粒子
    if (!b.isEnemy) {
      this.particles.createBulletEffect('default', b.x, b.y, b.color);
    }
  }

  for (var k = 0; k < this.enemyBullets.list.length; k++) {
    if (this.enemyBullets.list[k].active) { this.enemyBullets.list[k].update(dt); }
  }

  this.spawner.update(dt, this.enemies, this.enemyPool);

  for (var m = 0; m < this.enemies.length; m++) {
    var enemy = this.enemies[m];
    if (!enemy.active) { continue; }
    enemy.update(dt, this.player);
    if (enemy.canFire()) { enemy.fire(this.enemyBullets, this.player); }
  }

  if (this.boss.active) { this.boss.update(dt, this.player, this.enemyBullets); }

  if (this.spawner.shouldSpawnBoss() && !this.boss.active) {
    this.spawner.bossSpawned = true; this.boss.init();
    this.state = 'BOSS_INTRO'; this.bossIntroTimer = 2.0;
    this._show('warn'); this.audio.bossWarning();
    this.camera.shake(3, 1500);
  }

  for (var n = 0; n < this.powerups.length; n++) {
    if (this.powerups[n].active) { this.powerups[n].update(dt); }
  }

  var colResult;
  while ((colResult = Col.checkBulletEnemy(this.playerBullets.list, this.enemies, this.particles, this.audio)) !== null) {
    if (colResult.killed) {
      this.enemiesKilled++;
      this.score += Math.floor(colResult.score * this.combo.multiplier);
      this.combo.addKill();
      this.camera.shake(3, 120);
      this.screenFlash = Math.min(1, this.screenFlash + 0.08);
      this.slowMotionTarget = Math.min(1, this.slowMotionTarget + 0.15);
      if (Math.random() < colResult.enemy.dropChance) { PUM.spawn(colResult.x, colResult.y, this.powerups, this.powerupPool); }
    }
  }

  var bossHit = Col.checkBulletBoss(this.playerBullets.list, this.boss, this.particles);
  if (bossHit && bossHit.hit) {
    if (this.boss.hp <= 0) {
      this.boss.active = false; this.bossesDefeated++;
      this.score += 50000;
      this.particles.createExplosion(this.boss.x, this.boss.y, 'boss');
      this.particles.emitShockwave(this.boss.x, this.boss.y, 40, '#ff4466');
      this.audio.explode('boss'); this.camera.shake(CFG.SH.be.i, CFG.SH.be.d);
      this.screenFlash = Math.min(1, this.screenFlash + 0.3);
      this.slowMotionTarget = 1;
      PUM.spawn(this.boss.x, this.boss.y, this.powerups, this.powerupPool);
      PUM.spawn(this.boss.x, this.boss.y - 30, this.powerups, this.powerupPool);
      PUM.spawn(this.boss.x, this.boss.y + 30, this.powerups, this.powerupPool);
      this.spawner.bossDefeated = true; this.spawner.bossSpawned = false;
      var self = this;
      setTimeout(function() { if (self.state === 'PLAYING') { self.spawner.bossSpawned = false; } }, 60000);
    }
  }

  Col.checkBulletPlayer(this.enemyBullets.list, this.player, this.particles, this.audio, this.camera);
  Col.checkEnemyPlayer(this.enemies, this.player, this.particles, this.audio, this.camera);

  var puType = Col.checkPowerupPlayer(this.powerups, this.player, this.audio);
  if (puType) { var bonus = PUM.apply(puType, this.player); if (bonus > 0) { this.score += bonus; } }

  if (!this.player.active) { this._gameOver(); return; }

  this._cleanup(this.playerBullets);
  this._cleanup(this.enemyBullets);
  this._cleanupArray(this.enemies, this.enemyPool);
  this._cleanupArray(this.powerups, this.powerupPool);

  this._updateHUD();
};

Game.prototype._render = function() {
  var ctx = this.ctx;
  var ox = this.camera.ox, oy = this.camera.oy;

  ctx.clearRect(0, 0, CFG.BW, CFG.BH);
  ctx.save();
  ctx.translate(ox, oy);

  this.starField.render(ctx, this.time);

  if (this.state === 'MENU' || this.state === 'GAMEOVER') { ctx.restore(); return; }

  if (this.bombActive) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + Math.sin(this.bombFlash * 20) * 0.2) + ')';
    ctx.fillRect(0, 0, CFG.BW, CFG.BH);
  }

  for (var i = 0; i < this.powerups.length; i++) { if (this.powerups[i].active) { this.powerups[i].render(ctx); } }
  for (var j = 0; j < this.enemies.length; j++) { if (this.enemies[j].active) { this.enemies[j].render(ctx); } }
  this.boss.render(ctx);
  for (var k = 0; k < this.enemyBullets.list.length; k++) { if (this.enemyBullets.list[k].active) { this.enemyBullets.list[k].render(ctx); } }
  for (var m = 0; m < this.playerBullets.list.length; m++) { if (this.playerBullets.list[m].active) { this.playerBullets.list[m].render(ctx); } }
  this.player.render(ctx);
  this.particles.render(ctx, this.time);

  ctx.restore();

  // 屏幕闪光
  if (this.screenFlash > 0.01) {
    ctx.fillStyle = 'rgba(255,255,255,' + (this.screenFlash * 0.15) + ')';
    ctx.fillRect(0, 0, CFG.BW, CFG.BH);
  }

  ctx.strokeStyle = '#00f0ff11';
  ctx.lineWidth = 1;
  ctx.strokeRect(CFG.PA.x, CFG.PA.y, CFG.PA.w, CFG.PA.h);
};

// ========== BOOT ==========
// 全局声音接口 - 可从外部调用
window.playSound = function(type) {
  var game = window._gameInstance;
  if (game && game.audio && game.audio.enabled) {
    game.audio.play(type);
  }
};
window.addEventListener('DOMContentLoaded', function() { window._gameInstance = new Game(); });
</script>
