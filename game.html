      var si = Math.floor(Math.random() * this.trail.length);
      var st = this.trail[si];
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(st.x, st.y, 1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = this.opacity;
    // 外层大光晕
    var outerR = 10 + Math.sin(this.age * 12) * 1.5;
    var glowGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, outerR);
    glowGrad.addColorStop(0, this.color + 'cc');
    glowGrad.addColorStop(0.4, this.color + '44');
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, outerR, outerR * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    // 中层能量环（水平拉长椭圆）
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.ellipse(this.x + dir * 2, this.y, 6, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 内核白热核心
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.ellipse(this.x + dir * 1.5, this.y, 3, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    return;
  }

  // ===== 玩家导弹 =====
  if (bt === 'missile') {
    // 烟雾拖尾
    for (var i = 0; i < this.trail.length; i++) {
      var t = this.trail[i];
      var ratio = i / this.trail.length;
      var alpha = (t.life / 0.12) * 0.4 * ratio;
      var sz = 2 + (1 - ratio) * 4;
      ctx.globalAlpha = alpha * 0.5;
      ctx.fillStyle = '#666666';
      ctx.beginPath();
      ctx.arc(t.x - dir * 3, t.y, sz, 0, Math.PI * 2);
      ctx.fill();
    }
    // 火焰尾焰（红橙黄渐变）
    for (var i = 0; i < this.trail.length; i++) {
      var t = this.trail[i];
      var ratio = i / this.trail.length;
      var alpha = (t.life / 0.12) * 0.8 * ratio;
      var flameW = (1 - ratio) * 6 + 2;
      var flameH = (1 - ratio) * 3 + 1;
      ctx.globalAlpha = alpha;
      // 黄色内核火焰
      ctx.fillStyle = '#ffee44';
      ctx.shadowColor = '#ff8800';
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.ellipse(t.x - dir * flameW * 0.5, t.y, flameW * 0.5, flameH, 0, 0, Math.PI * 2);
      ctx.fill();
      // 橙色外层火焰
      ctx.fillStyle = '#ff6600';
      ctx.shadowBlur = 3;
      ctx.beginPath();
      ctx.ellipse(t.x - dir * flameW * 0.8, t.y, flameW * 0.7, flameH * 1.3, 0, 0, Math.PI * 2);
      ctx.fill();
      // 红色最外层
      ctx.fillStyle = '#ff2200';
      ctx.globalAlpha = alpha * 0.5;
      ctx.beginPath();
      ctx.ellipse(t.x - dir * flameW, t.y, flameW, flameH * 1.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = this.opacity;
    // 导弹弹体：菱形/尖头
    ctx.save();
    ctx.translate(this.x, this.y);
    if (dir < 0) { ctx.scale(-1, 1); }
    // 金属外壳
    ctx.fillStyle = '#cc7700';
    ctx.shadowColor = '#ff8800';
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.moveTo(8, 0);        // 尖头
    ctx.lineTo(-2, -4);      // 上翼
    ctx.lineTo(-5, -2);
    ctx.lineTo(-5, 2);
    ctx.lineTo(-2, 4);       // 下翼
    ctx.closePath();
    ctx.fill();
    // 高光
    ctx.fillStyle = '#ffaa44';
    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(0, -2);
    ctx.lineTo(0, 2);
    ctx.closePath();
    ctx.fill();
    // 尾翼
    ctx.fillStyle = '#996600';
    ctx.fillRect(-6, -5, 2, 2);
    ctx.fillRect(-6, 3, 2, 2);
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.globalAlpha = 1;
    return;
  }

  // ===== 敌机普通子弹 =====
  if (bt === 'enemy_default') {
    // 红色渐消拖尾
    for (var i = 0; i < this.trail.length; i++) {
      var t = this.trail[i];
      var ratio = i / this.trail.length;
      var alpha = (t.life / 0.12) * 0.6 * ratio;
      var tw = 1 + ratio * 3;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ff4444';
      ctx.shadowColor = '#ff2222';
      ctx.shadowBlur = 3;
      ctx.beginPath();
      ctx.ellipse(t.x, t.y, tw * 0.8, tw * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = this.opacity;
    // 外层红色光晕
    var outerR = 8;
    var glowGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, outerR);
    glowGrad.addColorStop(0, '#ff444488');
    glowGrad.addColorStop(0.5, '#ff222244');
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, outerR, 0, Math.PI * 2);
    ctx.fill();
    // 红色能量球
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff2222';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // 内核橙白色
    ctx.fillStyle = '#ffcc88';
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.ellipse(this.x + dir, this.y, 2, 1.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(this.x + dir * 0.5, this.y, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    return;
  }

  // ===== 敌机精英子弹 =====
  if (bt === 'enemy_elite') {
    // 更强的拖尾
    for (var i = 0; i < this.trail.length; i++) {
      var t = this.trail[i];
      var ratio = i / this.trail.length;
      var alpha = (t.life / 0.12) * 0.7 * ratio;
      var tw = 2 + ratio * 4;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = this.color;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.ellipse(t.x, t.y, tw, tw * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = this.opacity;
    // 脉冲效果
    var pulse = 1 + Math.sin(this.age * 16) * 0.2;
    // 外层强光晕
    var outerR = 12 * pulse;
    var glowGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, outerR);
    glowGrad.addColorStop(0, this.color + 'aa');
    glowGrad.addColorStop(0.3, this.color + '55');
    glowGrad.addColorStop(0.7, this.color + '22');
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, outerR, 0, Math.PI * 2);
    ctx.fill();
    // 能量球（更大）
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, 5 * pulse, 4 * pulse, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 内核白热
    ctx.fillStyle = '#ffddcc';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.ellipse(this.x + dir, this.y, 2.5, 1.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(this.x + dir * 0.5, this.y, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    return;
  }

  // ===== 兜底：默认渲染 =====
  for (var i = 0; i < this.trail.length; i++) {
    var t = this.trail[i];
    var alpha = t.life / 0.12 * 0.6;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.isEnemy ? 4 : 6;
    ctx.fillRect(t.x - 2, t.y - 1, 4, 2);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = this.opacity;
  var glowGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.isEnemy ? 6 : 8);
  glowGrad.addColorStop(0, this.color);
  glowGrad.addColorStop(0.5, this.color + '88');
  glowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.isEnemy ? 6 : 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = this.color; ctx.shadowBlur = this.isEnemy ? 4 : 8;
  ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
};

// ========== PLAYER (横版：在左侧，朝右射击) ==========
function Player() {
  Entity.call(this, 100, CFG.BH / 2, CFG.PSZ[0], CFG.PSZ[1]);
  this.reset();
}
Player.prototype = Object.create(Entity.prototype);
Player.prototype.constructor = Player;

Player.prototype.reset = function() {
  this.x = 100; this.y = CFG.BH / 2; this.active = true;
  this.hp = CFG.PMH; this.maxHp = CFG.PMH;
  this.shield = 0; this.maxShield = CFG.PMS;
  this.lives = 3; this.weaponLevel = 1;
  this.subWeaponType = 'missile'; this.subWeaponLevel = 0;
  this.bombs = CFG.BMAX;
  this.invincible = false; this.invincibleTimer = 0;
  this.fireTimer = 0; this.subWeaponTimer = 0;
  this.dashCooldown = 0; this.dashing = false; this.dashTimer = 0;
  this.dashDX = 0; this.dashDY = 0;
  this.engineFlame = 0; this.flashTimer = 0; this.speed = CFG.PS;
  // 视觉状态
  this.tiltAngle = 0; this.targetTilt = 0;
  this.floatOffset = 0; this.floatSpeed = 1.5;
  this.prevX = 100; this.prevY = CFG.BH / 2;
  this.ghostTrail = [];
  this.trailTimer = 0;
};

Player.prototype.update = function(dt, input) {
  if (this.flashTimer > 0) { this.flashTimer -= dt; }
  if (this.invincible) {
    this.invincibleTimer -= dt * 1000;
    if (this.invincibleTimer <= 0) { this.invincible = false; }
  }
  if (this.dashCooldown > 0) { this.dashCooldown -= dt * 1000; }
  if (this.dashing) {
    this.dashTimer -= dt * 1000;
    this.x += this.dashDX * dt; this.y += this.dashDY * dt;
    if (this.dashTimer <= 0) { this.dashing = false; }
  } else {
    var m = input.getMovement();
    this.vx = m.dx * this.speed; this.vy = m.dy * this.speed;
    this.prevX = this.x; this.prevY = this.y;
    this.x += this.vx * dt; this.y += this.vy * dt;
    var pa = CFG.PA;
    this.x = U.cl(this.x, pa.x + this.width / 2, pa.x + pa.w - this.width / 2);
    this.y = U.cl(this.y, pa.y + this.height / 2, pa.y + pa.h - this.height / 2);
  }
  this.engineFlame += dt * 8;
  this.fireTimer -= dt * 1000;
  this.subWeaponTimer -= dt * 1000;

  // 倾斜动画
  this.targetTilt = this.vx * 0.004;
  this.tiltAngle = U.lerp(this.tiltAngle, this.targetTilt, dt * 8);
  // 上下浮动
  this.floatOffset = Math.sin(this.engineFlame * 0.5) * 1.5;

  // 更新残影
  this.trailTimer -= dt;
  if (this.trailTimer <= 0) {
    this.trailTimer = 0.03;
    var speed = Math.hypot(this.vx, this.vy);
    if (speed > 20) {
      this.ghostTrail.push({ x: this.x, y: this.y, life: 0.15, alpha: 0.3 });
      if (this.ghostTrail.length > 8) { this.ghostTrail.shift(); }
    }
  }
  for (var i = this.ghostTrail.length - 1; i >= 0; i--) {
    this.ghostTrail[i].life -= dt;
    if (this.ghostTrail[i].life <= 0) { this.ghostTrail.splice(i, 1); }
  }
};

Player.prototype.canFire = function() { return this.fireTimer <= 0; };

Player.prototype._getWeaponPattern = function() {
  var lv = this.weaponLevel;
  switch (lv) {
    case 1: return [{ ox: 18, oy: 0, vx: 1, vy: 0, color: '#00ffcc', damage: 1 }];
    case 2: return [
      { ox: 16, oy: -6, vx: 1, vy: 0, color: '#00ffcc', damage: 1 },
      { ox: 16, oy: 6, vx: 1, vy: 0, color: '#00ffcc', damage: 1 }
    ];
    case 3:
      var s3 = [];
      for (var i = -2; i <= 2; i++) {
        var a = i * 0.12;
        s3.push({ ox: 16, oy: 0, vx: Math.cos(a), vy: Math.sin(a), color: '#00ddff', damage: 1 });
      }
      return s3;
    case 4: return [
      { ox: 20, oy: 0, vx: 1, vy: 0, color: '#00aaff', damage: 3 },
      { ox: 14, oy: -8, vx: 1, vy: 0, color: '#00ccff', damage: 1 },
      { ox: 14, oy: 8, vx: 1, vy: 0, color: '#00ccff', damage: 1 }
    ];
    case 5:
      var s5 = [];
      for (var j = 0; j < 5; j++) {
        var aa = j / 5 * Math.PI * 2 + this.engineFlame * 0.5;
        s5.push({ ox: 16 + Math.cos(aa) * 5, oy: Math.sin(aa) * 10, vx: 1, vy: Math.sin(aa) * 0.2, color: j % 2 === 0 ? '#00ffcc' : '#ff00ff', damage: 2 });
      }
      return s5;
    default: return [{ ox: 18, oy: 0, vx: 1, vy: 0, color: '#00ffcc', damage: 1 }];
  }
};

Player.prototype.fire = function(bullets, particles) {
  this.fireTimer = CFG.PFR;
  var patterns = this._getWeaponPattern();
  var speed = CFG.BS;
  for (var i = 0; i < patterns.length; i++) {
    var p = patterns[i];
    var b = bullets.pool.acquire();
    var bx = this.x + p.ox, by = this.y + p.oy;
    b.init(bx, by, p.vx * speed, p.vy * speed, p.damage || 1, p.color || CFG.CL.pb);
    b.homing = p.homing || false; b.homingStrength = p.homingStrength || 0;
    bullets.list.push(b);
  }
  // 增强枪口闪光
  if (particles) {
    particles.emitMuzzleFlash(this.x + 18, this.y, '#00ccff');
    // 枪口能量环
    particles.emitEnergyRing(this.x + 18, this.y, 5, '#00ccff');
    // 白色闪光更亮
    particles.emit(this.x + 18, this.y, 3, {
      color: '#ffffff', speed: 60, spread: Math.PI * 0.5, life: 0.06,
      size: 3, type: 'glow', glowColor: '#ffffff', endSize: 0.5
    });
  }
};

Player.prototype.fireSubWeapon = function(bullets, enemies, particles) {
  if (this.subWeaponLevel <= 0) { return; }
  if (this.subWeaponTimer > 0) { return; }
  this.subWeaponTimer = 500;
  if (this.subWeaponType === 'missile') {
    var count = this.subWeaponLevel;
    var target = null; var minDist = Infinity;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (!e.active) { continue; }
      var d = U.dist(this.x, this.y, e.x, e.y);
      if (d < minDist) { minDist = d; target = e; }
    }
    for (var j = 0; j < count; j++) {
      var b = bullets.pool.acquire();
      var oy = (j - (count - 1) / 2) * 10;
      b.init(this.x + 15, this.y + oy, 400, U.r(-30, 30), 2, '#ff8800');
      if (target) { b.homing = true; b.homingTarget = target; b.homingStrength = 5; }
      b.width = 8; b.height = 5;
      bullets.list.push(b);
    }
    // 导弹发射枪口闪光
    if (particles) {
      particles.emitMuzzleFlash(this.x + 15, this.y, '#ff8800');
      particles.emitEnergyRing(this.x + 15, this.y, 4, '#ff6600');
      particles.emit(this.x + 15, this.y, 2, {
        color: '#ffffff', speed: 50, spread: Math.PI * 0.4, life: 0.06,
        size: 2.5, type: 'glow', glowColor: '#ff8800', endSize: 0.5
      });
    }
  }
};

Player.prototype.takeDamage = function(amount) {
  if (this.invincible || this.dashing) { return false; }
  if (this.shield > 0) {
    this.shield = Math.max(0, this.shield - amount * 2);
    this.invincible = true; this.invincibleTimer = 500;
    return true;
  }
  this.hp -= amount;
  this.invincible = true; this.invincibleTimer = CFG.PIT;
  this.flashTimer = CFG.PIT / 1000;
  if (this.hp <= 0) {
    this.lives--;
    if (this.lives > 0) {
      this.hp = this.maxHp; this.shield = 0;
      this.weaponLevel = Math.max(1, this.weaponLevel - 2);
      this.subWeaponLevel = Math.max(0, this.subWeaponLevel - 2);
      this.x = 100; this.y = CFG.BH / 2;
    } else { this.active = false; }
  }
  return true;
};

Player.prototype.dash = function(input) {
  if (this.dashCooldown > 0 || this.dashing) { return; }
  var m = input.getMovement();
  var ddx = m.dx, ddy = m.dy;
  if (ddx === 0 && ddy === 0) { ddx = 1; }
  var mag = Math.hypot(ddx, ddy);
  this.dashDX = (ddx / mag) * CFG.DD / (CFG.DDUR / 1000);
  this.dashDY = (ddy / mag) * CFG.DD / (CFG.DDUR / 1000);
  this.dashing = true; this.dashTimer = CFG.DDUR; this.dashCooldown = CFG.DC;
};

Player.prototype.useBomb = function() {
  if (this.bombs <= 0) { return false; }
  this.bombs--; return true;
};

Player.prototype.render = function(ctx) {
  if (this.flashTimer > 0 && Math.floor(this.flashTimer * 20) % 2 === 0) { return; }

  // 绘制残影
  for (var gi = 0; gi < this.ghostTrail.length; gi++) {
    var g = this.ghostTrail[gi];
    var ga = g.alpha * (g.life / 0.15);
    this._renderBody(ctx, g.x, g.y, ga, false);
  }

  // 闪现效果
  if (this.dashing) {
    ctx.globalAlpha = 0.4;
    for (var i = 0; i < 4; i++) {
      var dx = (i - 1.5) * 8;
      this._renderBody(ctx, this.x + dx, this.y, 0.25 - i * 0.05, false);
    }
    ctx.globalAlpha = 1;
  }

  this._renderBody(ctx, this.x, this.y + this.floatOffset, 1, true);
};

Player.prototype._renderBody = function(ctx, cx, cy, alpha, full) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.rotate(this.tiltAngle);

  var w = this.width, h = this.height;
  var hw = w / 2, hh = h / 2;
  var flame = this.engineFlame;

  // === 推进器尾焰 ===
  var speed = Math.hypot(this.vx, this.vy);
  var flameLen = 14 + speed * 0.03 + Math.sin(flame * 3) * 6;
  // 粒子喷射散点
  for (var pi = 0; pi < 6; pi++) {
    var ppx = -hw - 4 - Math.random() * flameLen * 0.7;
    var ppy = (Math.random() - 0.5) * 8;
    var psz = 1 + Math.random() * 1.5;
    ctx.fillStyle = 'rgba(0,180,255,' + (0.15 + Math.random() * 0.15) + ')';
    ctx.beginPath(); ctx.arc(ppx, ppy, psz, 0, Math.PI * 2); ctx.fill();
  }
  // 紫蓝色外层光晕环
  ctx.fillStyle = 'rgba(120,60,255,0.12)';
  ctx.beginPath();
  ctx.ellipse(-hw - 6, 0, flameLen * 0.8, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,180,255,0.1)';
  ctx.beginPath();
  ctx.ellipse(-hw - 4, 0, flameLen * 0.65, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  // 中层火焰（更动态）
  var fgOuter = ctx.createLinearGradient(-hw, 0, -hw - flameLen, 0);
  fgOuter.addColorStop(0, '#00eeff');
  fgOuter.addColorStop(0.2, '#0088ff');
  fgOuter.addColorStop(0.5, '#6644cc');
  fgOuter.addColorStop(0.8, '#2200aa');
  fgOuter.addColorStop(1, 'transparent');
  ctx.fillStyle = fgOuter;
  ctx.beginPath();
  ctx.moveTo(-hw - 2, -7);
  ctx.lineTo(-hw - flameLen, -3 + Math.sin(flame * 5) * 3);
  ctx.lineTo(-hw - flameLen * 0.85, 0);
  ctx.lineTo(-hw - flameLen, 3 - Math.sin(flame * 5) * 3);
  ctx.lineTo(-hw - 2, 7);
  ctx.closePath();
  ctx.fill();
  // 内层核心火焰（白热脉动更强）
  var hotPulse = 1 + Math.sin(flame * 8) * 0.35;
  var fgInner = ctx.createLinearGradient(-hw, 0, -hw - flameLen * 0.7, 0);
  fgInner.addColorStop(0, '#ffffff');
  fgInner.addColorStop(0.15, '#ccddff');
  fgInner.addColorStop(0.4, '#00aaff');
  fgInner.addColorStop(0.7, '#6644cc');
  fgInner.addColorStop(1, 'transparent');
  ctx.fillStyle = fgInner;
  ctx.beginPath();
  ctx.moveTo(-hw - 2, -3.5 * hotPulse);
  ctx.lineTo(-hw - flameLen * 0.7, -1 + Math.sin(flame * 7) * 1.5);
  ctx.lineTo(-hw - flameLen * 0.55, 0);
  ctx.lineTo(-hw - flameLen * 0.7, 1 - Math.sin(flame * 7) * 1.5);
  ctx.lineTo(-hw - 2, 3.5 * hotPulse);
  ctx.closePath();
  ctx.fill();
  // 双引擎尾焰（翼根处上下各一个）
  var wingFlame = 5 + Math.sin(flame * 4) * 2;
  for (var wfi = -1; wfi <= 1; wfi += 2) {
    var wfy = wfi * hh * 0.55;
    var wfg = ctx.createLinearGradient(-hw + 8, wfy, -hw + 8 - wingFlame, wfy);
    wfg.addColorStop(0, '#00ccff');
    wfg.addColorStop(0.4, '#0066cc');
    wfg.addColorStop(1, 'transparent');
    ctx.fillStyle = wfg;
    ctx.beginPath();
    ctx.moveTo(-hw + 8, wfy - 2);
    ctx.lineTo(-hw + 8 - wingFlame, wfy + Math.sin(flame * 6 + wfi) * 1);
    ctx.lineTo(-hw + 8, wfy + 2);
    ctx.closePath();
    ctx.fill();
  }

  // === 机身主体 ===
  // 底部暗色金属（增强3D阴影）
  ctx.fillStyle = '#060e1a';
  ctx.shadowColor = '#003366';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(hw + 2, 0);
  ctx.lineTo(1, -hh - 1);
  ctx.lineTo(-hw + 3, -hh * 0.62);
  ctx.lineTo(-hw - 1, -hh * 0.3);
  ctx.lineTo(-hw + 1, 0);
  ctx.lineTo(-hw - 1, hh * 0.3);
  ctx.lineTo(-hw + 3, hh * 0.62);
  ctx.lineTo(1, hh + 1);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // 金属装甲层（增强3D立体感：顶部更亮，底部更暗）
  var bodyGrad = ctx.createLinearGradient(0, -hh, 0, hh);
  bodyGrad.addColorStop(0, '#4a8acc');
  bodyGrad.addColorStop(0.15, '#3a6a9a');
  bodyGrad.addColorStop(0.35, '#2a4a7a');
  bodyGrad.addColorStop(0.5, '#3a6a9a');
  bodyGrad.addColorStop(0.65, '#2a4a7a');
  bodyGrad.addColorStop(0.85, '#1a3a5a');
  bodyGrad.addColorStop(1, '#0a2a4a');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(hw - 2, 0);
  ctx.lineTo(3, -hh + 2);
  ctx.lineTo(-hw + 7, -hh * 0.5);
  ctx.lineTo(-hw + 3, -hh * 0.25);
  ctx.lineTo(-hw + 5, 0);
  ctx.lineTo(-hw + 3, hh * 0.25);
  ctx.lineTo(-hw + 7, hh * 0.5);
  ctx.lineTo(3, hh - 2);
  ctx.closePath();
  ctx.fill();

  // 细微装甲纹理线（水平线条分区）
  ctx.strokeStyle = 'rgba(80,150,220,0.15)';
  ctx.lineWidth = 0.5;
  for (var ali = -2; ali <= 2; ali++) {
    var aly = ali * hh * 0.2;
    ctx.beginPath();
    ctx.moveTo(-hw + 8, aly);
    ctx.lineTo(hw - 6, aly);
    ctx.stroke();
  }

  // 机身边缘蓝紫色科幻光条（能量线沿轮廓流动）
  var edgeFlow = (flame * 0.3) % 1;
  ctx.strokeStyle = 'rgba(100,120,255,0.55)';
  ctx.lineWidth = 1.2;
  ctx.shadowColor = '#6644ff';
  ctx.shadowBlur = 5;
  ctx.beginPath();
  ctx.moveTo(hw - 2, 0);
  ctx.lineTo(3, -hh + 2);
  ctx.lineTo(-hw + 7, -hh * 0.5);
  ctx.lineTo(-hw + 3, -hh * 0.25);
  ctx.lineTo(-hw + 5, 0);
  ctx.lineTo(-hw + 3, hh * 0.25);
  ctx.lineTo(-hw + 7, hh * 0.5);
  ctx.lineTo(3, hh - 2);
  ctx.closePath();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 机头更锐利的棱角分明的未来战机感
  ctx.strokeStyle = 'rgba(0,240,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(hw + 1, 0);
  ctx.lineTo(hw - 4, -3);
  ctx.lineTo(hw - 10, -5);
  ctx.moveTo(hw + 1, 0);
  ctx.lineTo(hw - 4, 3);
  ctx.lineTo(hw - 10, 5);
  ctx.stroke();
  // 机头下方锐角
  ctx.strokeStyle = 'rgba(100,180,255,0.4)';
  ctx.lineWidth = 1;
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.moveTo(hw - 2, 0);
  ctx.lineTo(hw - 12, -2);
  ctx.moveTo(hw - 2, 0);
  ctx.lineTo(hw - 12, 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // === 能量核心 ===
  // 核心光晕（更大更亮，紫蓝色系）
  var coreGlow = ctx.createRadialGradient(0, 0, 1, 0, 0, 14);
  coreGlow.addColorStop(0, 'rgba(200,150,255,0.9)');
  coreGlow.addColorStop(0.15, 'rgba(100,120,255,0.7)');
  coreGlow.addColorStop(0.35, 'rgba(0,150,255,0.4)');
  coreGlow.addColorStop(0.6, 'rgba(0,80,255,0.15)');
  coreGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = coreGlow;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fill();
  // 核心脉动（呼吸感更强）
  var pulse = 1 + Math.sin(flame * 4) * 0.3;
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#aa88ff';
  ctx.shadowBlur = 12 * pulse;
  ctx.beginPath();
  ctx.arc(0, 0, 3 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // 能量涟漪效果（向外扩散的圆环）
  for (var ri = 0; ri < 2; ri++) {
    var rippleR = ((flame * 1.5 + ri * 0.5) % 1) * 12 + 4;
    var rippleA = Math.max(0, 0.3 - rippleR * 0.02);
    ctx.strokeStyle = 'rgba(120,150,255,' + rippleA + ')';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(0, 0, rippleR, 0, Math.PI * 2);
    ctx.stroke();
  }

  // === 机翼动态光线 ===
  var wingGlow = 0.6 + Math.sin(flame * 2.5) * 0.35;
  ctx.strokeStyle = 'rgba(0,200,255,' + wingGlow + ')';
  ctx.lineWidth = 1.8;
  ctx.shadowColor = '#00aaff';
  ctx.shadowBlur = 6;
  // 上翼
  ctx.beginPath();
  ctx.moveTo(5, -hh * 0.6);
  ctx.lineTo(-hw + 8, -hh * 0.45);
  ctx.stroke();
  // 下翼
  ctx.beginPath();
  ctx.moveTo(5, hh * 0.6);
  ctx.lineTo(-hw + 8, hh * 0.45);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // 翼尖闪烁灯效果
  var tipBlink = Math.sin(flame * 5) > 0.3 ? 1 : 0.2;
  ctx.fillStyle = 'rgba(0,255,255,' + tipBlink + ')';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(-hw + 8, -hh * 0.45, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-hw + 8, hh * 0.45, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // 能量从机身向翼尖流动的光线动画
  var flowPos = (flame * 0.6) % 1;
  for (var fli = 0; fli < 3; fli++) {
    var fp = (flowPos + fli * 0.33) % 1;
    var fAlpha = Math.sin(fp * Math.PI) * 0.5;
    // 上翼流动
    var fx1 = 5 + (-hw + 3) * fp;
    var fy1 = -hh * 0.6 + (hh * 0.15) * fp;
    ctx.fillStyle = 'rgba(100,220,255,' + fAlpha + ')';
    ctx.beginPath(); ctx.arc(fx1, fy1, 1.2, 0, Math.PI * 2); ctx.fill();
    // 下翼流动
    var fy2 = hh * 0.6 - (hh * 0.15) * fp;
    ctx.beginPath(); ctx.arc(fx1, fy2, 1.2, 0, Math.PI * 2); ctx.fill();
  }

  // === 驾驶舱 ===
  var cockpitGrad = ctx.createLinearGradient(0, -4, 0, 4);
  cockpitGrad.addColorStop(0, '#ccf0ff');
  cockpitGrad.addColorStop(0.3, '#88ddff');
  cockpitGrad.addColorStop(0.7, '#aaefff');
  cockpitGrad.addColorStop(1, '#4488cc');
  ctx.fillStyle = cockpitGrad;
  ctx.shadowColor = '#00ccff';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.ellipse(5, 0, 5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // HUD投影效果（微型光条）
  ctx.strokeStyle = 'rgba(0,240,255,0.5)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(2, -1.5); ctx.lineTo(8, -1.5);
  ctx.moveTo(2, 1.5); ctx.lineTo(8, 1.5);
  ctx.stroke();

  // === 能量护盾 ===
  if (this.shield > 0 && full) {
    var shieldAlpha = 0.2 + 0.1 * Math.sin(flame * 2);
    var shieldPulse = 1 + Math.sin(flame * 3) * 0.06;
    // 外层护盾
    ctx.strokeStyle = 'rgba(0,200,255,' + shieldAlpha + ')';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#00ccff';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.ellipse(0, 0, hw * 1.25 * shieldPulse, hh * 1.15 * shieldPulse, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // 六角形网格纹理护盾
    var srx = hw * 1.1 * shieldPulse, sry = hh * 1.05 * shieldPulse;
    ctx.strokeStyle = 'rgba(0,180,255,' + (shieldAlpha * 0.5) + ')';
    ctx.lineWidth = 0.7;
    // 外六角
    ctx.beginPath();
    for (var si = 0; si < 6; si++) {
      var sa = Math.PI / 3 * si - Math.PI / 2;
      var sx = Math.cos(sa) * srx, sy = Math.sin(sa) * sry;
      ctx[si === 0 ? 'moveTo' : 'lineTo'](sx, sy);
    }
    ctx.closePath();
    ctx.stroke();
    // 内六角网格
    ctx.strokeStyle = 'rgba(80,160,255,' + (shieldAlpha * 0.35) + ')';
    for (var si2 = 0; si2 < 6; si2++) {
      var sa2 = Math.PI / 3 * si2 - Math.PI / 2;
      var ox1 = Math.cos(sa2) * srx, oy1 = Math.sin(sa2) * sry;
      var sa3 = Math.PI / 3 * ((si2 + 1) % 6) - Math.PI / 2;
      var ox2 = Math.cos(sa3) * srx, oy2 = Math.sin(sa3) * sry;
      var mx = (ox1 + ox2) / 2, my = (oy1 + oy2) / 2;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(mx, my);
      ctx.stroke();
    }
    // 护盾表面能量流动波纹
    for (var swi = 0; swi < 3; swi++) {
      var swPhase = (flame * 0.8 + swi * 0.33) % 1;
      var swR = 0.4 + swPhase * 0.6;
      var swA = Math.sin(swPhase * Math.PI) * shieldAlpha * 0.5;
      ctx.strokeStyle = 'rgba(100,200,255,' + swA + ')';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.ellipse(0, 0, srx * swR, sry * swR, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // 受击闪烁（利用shield刚被击中的时刻判断）
    ctx.shadowBlur = 0;
  }

  ctx.restore();
};

// ========== ENEMY (横版：从右侧出现，向左移动) ==========
function Enemy() { Entity.call(this, 0, 0, 24, 24); this.reset(); }
Enemy.prototype = Object.create(Entity.prototype);
Enemy.prototype.constructor = Enemy;

Enemy.prototype.reset = function() {
  this.x = 0; this.y = -50; this.active = false;
  this.hp = 1; this.maxHp = 1; this.type = 'scout';
  this.movePattern = 'straight'; this.fireTimer = 0; this.fireInterval = 2000;
  this.moveTimer = 0; this.time = 0; this.score = 100;
  this.color = '#ff4466'; this.shape = 'diamond'; this.dropChance = 0.3;
  this.amplitude = 0; this.frequency = 0; this.originX = 0; this.originY = 0;
  this.canShoot = false; this.speed = 180;
  this.visualTime = 0; this.floatOff = 0;
  this.hitFlash = 0; // 受击闪白计时器
};

Enemy.prototype.init = function(type, x, y) {
  this.x = x; this.y = y; this.active = true; this.time = 0;
  this.originX = x; this.originY = y; this.type = type;

  var configs = {
    scout:    { hp: 1, speed: 180, score: 100, color: '#ff4466', shape: 'diamond',   size: [22, 20], move: 'straight',   fire: 0,    drop: 0.25 },
    fighter:  { hp: 2, speed: 130, score: 200, color: '#4488ff', shape: 'diamond',   size: [26, 24], move: 'straight',   fire: 1800, drop: 0.3  },
    tank:     { hp: 4, speed: 80,  score: 300, color: '#aa44ff', shape: 'hexagon',   size: [30, 30], move: 'zigzag',     fire: 1500, drop: 0.35, amp: 60, freq: 2 },
    sniper:   { hp: 3, speed: 100, score: 350, color: '#ff2244', shape: 'elongated', size: [30, 18], move: 'sniper',     fire: 2000, drop: 0.4  },
    kamikaze: { hp: 2, speed: 300, score: 250, color: '#ff8800', shape: 'spike',     size: [26, 22], move: 'kamikaze',   fire: 0,    drop: 0.2  },
    bomber:   { hp: 3, speed: 100, score: 300, color: '#44ff44', shape: 'square',    size: [26, 26], move: 'horizontal', fire: 2000, drop: 0.35 }
  };
  var cfg = configs[type] || configs.scout;
  this.hp = cfg.hp; this.maxHp = cfg.hp; this.speed = cfg.speed;
  this.score = cfg.score; this.color = cfg.color; this.shape = cfg.shape;
  this.width = cfg.size[0]; this.height = cfg.size[1];
  this.movePattern = cfg.move; this.fireInterval = cfg.fire;
  this.fireTimer = U.r(0, cfg.fire); this.canShoot = cfg.fire > 0;
  this.dropChance = cfg.drop; this.amplitude = cfg.amp || 0;
  this.frequency = cfg.freq || 0; this.vx = -cfg.speed; this.vy = 0; this.moveTimer = 0;
};

Enemy.prototype.update = function(dt, player) {
  this.time += dt; this.moveTimer += dt; this.fireTimer -= dt * 1000;
  this.visualTime += dt;
  this.floatOff = Math.sin(this.visualTime * 2) * 1.5;
  if (this.hitFlash > 0) { this.hitFlash -= dt; }
  var pa = CFG.PA;

  switch (this.movePattern) {
    case 'straight':
      this.x -= this.speed * dt;
      break;
    case 'zigzag':
      this.x -= this.speed * 0.7 * dt;
      this.y = this.originY + Math.sin(this.time * this.frequency) * this.amplitude;
      break;
    case 'sniper':
      if (this.x > pa.x + 200) { this.x -= this.speed * dt; }
      else if (player && player.active) { this.y = U.lerp(this.y, player.y, dt * 0.5); }
      break;
    case 'kamikaze':
      if (this.x > pa.x + 250) { this.x -= this.speed * 0.5 * dt; }
      else if (player && player.active) {
        var a = U.ang(this.x, this.y, player.x, player.y);
        this.vx = -Math.cos(a) * this.speed; this.vy = Math.sin(a) * this.speed;
        this.x += this.vx * dt; this.y += this.vy * dt;
      }
      break;
    case 'horizontal':
      this.x -= this.speed * 0.5 * dt;
      this.y += Math.sin(this.time * 1.5) * 80 * dt;
      this.y = U.cl(this.y, pa.y + this.height, pa.y + pa.h - this.height);
      break;
  }
  if (this.x < -50) { this.active = false; }
  if (this.y < pa.y - 30) { this.y = pa.y + pa.h + 30; }
  if (this.y > pa.y + pa.h + 30) { this.y = pa.y - 30; }
};

Enemy.prototype.canFire = function() { return this.canShoot && this.fireTimer <= 0; };

Enemy.prototype.fire = function(bullets, player) {
  this.fireTimer = this.fireInterval;
  var b;
  if (this.type === 'sniper' && player && player.active) {
    var a = U.ang(this.x, this.y, player.x, player.y);
    b = bullets.pool.acquire();
    b.init(this.x - this.width / 2, this.y, Math.cos(a) * 200, Math.sin(a) * 200, 1, CFG.CL.eb, true);
    bullets.list.push(b);
  } else if (this.type === 'tank') {
    for (var i = -1; i <= 1; i++) {
      b = bullets.pool.acquire();
      b.init(this.x - this.width / 2, this.y + i * 8, -200, i * 30, 1, CFG.CL.eb, true);
      bullets.list.push(b);
    }
  } else {
    b = bullets.pool.acquire();
    b.init(this.x - this.width / 2, this.y, CFG.EBS, 0, 1, CFG.CL.eb, true);
    bullets.list.push(b);
  }
};

Enemy.prototype.render = function(ctx) {
  ctx.save();
  ctx.translate(this.x, this.y + this.floatOff);
  var w = this.width, h = this.height;
  var hw = w / 2, hh = h / 2;
  var t = this.visualTime;

  // 受击闪白效果
  if (this.hitFlash > 0 && this.hitFlash > 0.03) {
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 12;
    ctx.fillRect(-hw - 2, -hh - 2, w + 4, h + 4);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // 推进器火焰（敌机向右飞，火焰在右侧，升级版）
  var flameLen = 6 + Math.sin(t * 6) * 3;
  // 外层光晕
  ctx.fillStyle = 'rgba(255,80,40,0.08)';
  ctx.beginPath();
  ctx.ellipse(hw + 3, 0, flameLen * 0.8, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  var fg = ctx.createLinearGradient(hw, 0, hw + flameLen, 0);
  fg.addColorStop(0, this.color);
  fg.addColorStop(0.3, this.color + 'cc');
  fg.addColorStop(0.6, this.color + '55');
  fg.addColorStop(1, 'transparent');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(hw, -4);
  ctx.lineTo(hw + flameLen, -1.5 + Math.sin(t * 8) * 1.5);
  ctx.lineTo(hw + flameLen * 0.7, 0);
  ctx.lineTo(hw + flameLen, 1.5 - Math.sin(t * 8) * 1.5);
  ctx.lineTo(hw, 4);
  ctx.closePath();
  ctx.fill();
  // 火焰内核
  var fg2 = ctx.createLinearGradient(hw, 0, hw + flameLen * 0.5, 0);
  fg2.addColorStop(0, '#ffffff');
  fg2.addColorStop(0.3, this.color);
  fg2.addColorStop(1, 'transparent');
  ctx.fillStyle = fg2;
  ctx.beginPath();
  ctx.moveTo(hw, -2);
  ctx.lineTo(hw + flameLen * 0.5, Math.sin(t * 10) * 0.8);
  ctx.lineTo(hw, 2);
  ctx.closePath();
  ctx.fill();

  // 根据类型渲染不同视觉
  switch (this.type) {
    case 'scout': this._renderScout(ctx, w, h, t); break;
    case 'fighter': this._renderFighter(ctx, w, h, t); break;
    case 'tank': this._renderTank(ctx, w, h, t); break;
    case 'sniper': this._renderSniper(ctx, w, h, t); break;
    case 'kamikaze': this._renderKamikaze(ctx, w, h, t); break;
    case 'bomber': this._renderBomber(ctx, w, h, t); break;
    default: this._renderScout(ctx, w, h, t); break;
  }

  // 血条
  if (this.maxHp >= 3 && this.hp < this.maxHp) {
    var bw = this.width, bh = 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-bw / 2, -hh - 6, bw, bh);
    ctx.fillStyle = '#ff4466'; ctx.fillRect(-bw / 2, -hh - 6, bw * (this.hp / this.maxHp), bh);
  }

  ctx.restore();
};

// 侦察机 - 小型无人战斗机（外星科技升级版）
Enemy.prototype._renderScout = function(ctx, w, h, t) {
  var hw = w / 2, hh = h / 2;
  // 更尖锐的外星机械造型
  var grad = ctx.createLinearGradient(0, -hh, 0, hh);
  grad.addColorStop(0, '#4a2020');
  grad.addColorStop(0.25, '#6a3030');
  grad.addColorStop(0.5, '#8a4040');
  grad.addColorStop(0.75, '#5a2828');
  grad.addColorStop(1, '#3a1818');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#ff4466';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(-hw - 2, 0);
  ctx.lineTo(-2, -hh - 1);
  ctx.lineTo(hw * 0.3, -hh * 0.7);
  ctx.lineTo(hw, -hh * 0.25);
  ctx.lineTo(hw, hh * 0.25);
  ctx.lineTo(hw * 0.3, hh * 0.7);
  ctx.lineTo(-2, hh + 1);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // 装甲线条
  ctx.strokeStyle = 'rgba(140,60,60,0.4)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(-hw + 2, -hh * 0.3); ctx.lineTo(hw - 2, -hh * 0.3);
  ctx.moveTo(-hw + 2, hh * 0.3); ctx.lineTo(hw - 2, hh * 0.3);
  ctx.stroke();
  // 薄翼展开效果
  ctx.fillStyle = 'rgba(120,40,40,0.35)';
  ctx.beginPath();
  ctx.moveTo(0, -hh);
  ctx.lineTo(hw * 0.8, -hh * 0.6);
  ctx.lineTo(hw * 0.3, -hh * 0.4);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, hh);
  ctx.lineTo(hw * 0.8, hh * 0.6);
  ctx.lineTo(hw * 0.3, hh * 0.4);
  ctx.closePath();
  ctx.fill();
  // 红色能量核心（更亮，脉冲环）
  var coreGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, 5);
  coreGlow.addColorStop(0, '#ff6666');
  coreGlow.addColorStop(0.3, '#ff3333');
  coreGlow.addColorStop(0.6, '#cc1111');
  coreGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = coreGlow;
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
  // 脉冲环
  var sp = (t * 2) % 1;
  ctx.strokeStyle = 'rgba(255,80,80,' + (0.5 * (1 - sp)) + ')';
  ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.arc(0, 0, 3 + sp * 6, 0, Math.PI * 2); ctx.stroke();
  // 扫描线/定位光效果
  var scanA = Math.sin(t * 4) * 0.4;
  ctx.strokeStyle = 'rgba(255,150,150,' + Math.abs(scanA) + ')';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(-hw, -hh * 0.5); ctx.lineTo(hw, -hh * 0.5);
  ctx.moveTo(-hw, hh * 0.5); ctx.lineTo(hw, hh * 0.5);
  ctx.stroke();
  // 边缘光（更亮）
  ctx.strokeStyle = 'rgba(255,100,100,0.55)';
  ctx.lineWidth = 1;
  ctx.shadowColor = '#ff4466';
  ctx.shadowBlur = 3;
  ctx.beginPath();
  ctx.moveTo(-hw - 2, 0); ctx.lineTo(-2, -hh - 1); ctx.lineTo(hw * 0.3, -hh * 0.7); ctx.lineTo(hw, -hh * 0.25);
  ctx.moveTo(hw, hh * 0.25); ctx.lineTo(hw * 0.3, hh * 0.7); ctx.lineTo(-2, hh + 1); ctx.lineTo(-hw - 2, 0);
  ctx.stroke();
  ctx.shadowBlur = 0;
};

// 战斗机 - 中型装甲（外星战舰升级版）
Enemy.prototype._renderFighter = function(ctx, w, h, t) {
  var hw = w / 2, hh = h / 2;
  // 更大的X形翼展开
  var grad = ctx.createLinearGradient(0, -hh, 0, hh);
  grad.addColorStop(0, '#2a3a6a');
  grad.addColorStop(0.2, '#3a5a9a');
  grad.addColorStop(0.4, '#4a6aaa');
  grad.addColorStop(0.6, '#3a5a9a');
  grad.addColorStop(0.8, '#2a4a7a');
  grad.addColorStop(1, '#1a2a4a');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(-hw - 2, -hh * 0.15);
  ctx.lineTo(-hw * 0.3, -hh - 1);
  ctx.lineTo(hw * 0.3, -hh - 1);
  ctx.lineTo(hw + 1, -hh * 0.5);
  ctx.lineTo(hw * 0.65, 0);
  ctx.lineTo(hw + 1, hh * 0.5);
  ctx.lineTo(hw * 0.3, hh + 1);
  ctx.lineTo(-hw * 0.3, hh + 1);
  ctx.lineTo(-hw - 2, hh * 0.15);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // 装甲板分割（更厚重）
  ctx.strokeStyle = 'rgba(80,130,200,0.35)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(-hw, -hh * 0.3); ctx.lineTo(hw, -hh * 0.3);
  ctx.moveTo(-hw, hh * 0.3); ctx.lineTo(hw, hh * 0.3);
  ctx.moveTo(-hw * 0.5, 0); ctx.lineTo(hw * 0.5, 0);
  ctx.stroke();
  // 多条发光线路（蓝色系，网络状）
  var lineA = 0.5 + Math.sin(t * 3) * 0.25;
  ctx.strokeStyle = 'rgba(100,180,255,' + lineA + ')';
  ctx.lineWidth = 1;
  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.moveTo(-hw * 0.6, -hh * 0.4); ctx.lineTo(hw * 0.6, -hh * 0.4);
  ctx.moveTo(-hw * 0.6, hh * 0.4); ctx.lineTo(hw * 0.6, hh * 0.4);
  ctx.moveTo(0, -hh * 0.6); ctx.lineTo(0, hh * 0.6);
  ctx.stroke();
  // 交叉能量线
  ctx.strokeStyle = 'rgba(120,200,255,' + (lineA * 0.6) + ')';
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(-hw * 0.5, -hh * 0.5); ctx.lineTo(hw * 0.5, hh * 0.5);
  ctx.moveTo(-hw * 0.5, hh * 0.5); ctx.lineTo(hw * 0.5, -hh * 0.5);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // 能量传输线动画
  var flowP = (t * 1.5) % 1;
  for (var fi = 0; fi < 2; fi++) {
    var fp2 = (flowP + fi * 0.5) % 1;
    var fa = Math.sin(fp2 * Math.PI) * 0.6;
    var fx2 = -hw * 0.6 + hw * 1.2 * fp2;
    ctx.fillStyle = 'rgba(150,220,255,' + fa + ')';
    ctx.beginPath(); ctx.arc(fx2, -hh * 0.4, 1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(fx2, hh * 0.4, 1, 0, Math.PI * 2); ctx.fill();
  }
  // 双核心发光（蓝色）
  for (var ci = -1; ci <= 1; ci += 2) {
    var cy2 = ci * hh * 0.35;
    var cGlow = ctx.createRadialGradient(0, cy2, 0, 0, cy2, 4);
    cGlow.addColorStop(0, '#aaddff');
    cGlow.addColorStop(0.4, '#4488ff');
    cGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = cGlow;
    ctx.beginPath(); ctx.arc(0, cy2, 4, 0, Math.PI * 2); ctx.fill();
  }
  // 中心核心亮点
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
};

// 坦克 - 重型装甲（六边形堡垒升级版）
Enemy.prototype._renderTank = function(ctx, w, h, t) {
  var hw = w / 2, hh = h / 2;
  // 阴影底层（3D立体感）
  ctx.fillStyle = '#1a0a22';
  ctx.beginPath();
  for (var si = 0; si < 6; si++) {
    var sa = Math.PI / 3 * si - Math.PI / 2;
    var sr = hw + 2;
    ctx[si === 0 ? 'moveTo' : 'lineTo'](Math.cos(sa) * sr, Math.sin(sa) * sr);
  }
  ctx.closePath();
  ctx.fill();
  // 六边形装甲板（有立体凸起效果）
  for (var i = 0; i < 6; i++) {
    var a = Math.PI / 3 * i - Math.PI / 2;
    var r = hw;
    var x = Math.cos(a) * r, y = Math.sin(a) * r;
    var bright = i % 2 === 0;
    ctx.fillStyle = bright ? '#664499' : '#442277';
    ctx.shadowColor = '#aa44ff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(Math.cos(a + Math.PI / 6) * r * 0.5, Math.sin(a + Math.PI / 6) * r * 0.5);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  // 六边形边框（更粗更亮）
  ctx.strokeStyle = 'rgba(180,120,255,0.6)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#bb66ff';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  for (var j = 0; j < 6; j++) {
    var a2 = Math.PI / 3 * j - Math.PI / 2;
    var r2 = hw;
    ctx[j === 0 ? 'moveTo' : 'lineTo'](Math.cos(a2) * r2, Math.sin(a2) * r2);
  }
  ctx.closePath(); ctx.stroke();
  ctx.shadowBlur = 0;
  // 复杂能量网（更多发光线路）
  var lineA2 = 0.5 + Math.sin(t * 2) * 0.2;
  ctx.strokeStyle = 'rgba(200,150,255,' + lineA2 + ')';
  ctx.lineWidth = 1;
  ctx.shadowColor = '#aa44ff';
  ctx.shadowBlur = 4;
  for (var k = 0; k < 6; k++) {
    var la = Math.PI / 3 * k - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(la) * hw * 0.85, Math.sin(la) * hw * 0.85);
    ctx.stroke();
  }
  // 中环能量线
  ctx.strokeStyle = 'rgba(180,130,255,' + (lineA2 * 0.6) + ')';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  for (var mi = 0; mi < 6; mi++) {
    var ma = Math.PI / 3 * mi - Math.PI / 2;
    var mx2 = Math.cos(ma) * hw * 0.55, my2 = Math.sin(ma) * hw * 0.55;
    ctx[mi === 0 ? 'moveTo' : 'lineTo'](mx2, my2);
  }
  ctx.closePath(); ctx.stroke();
  ctx.shadowBlur = 0;
  // 紫色核心（更大更亮，旋转光圈）
  var coreGlow2 = ctx.createRadialGradient(0, 0, 0, 0, 0, 7);
  coreGlow2.addColorStop(0, '#dd88ff');
  coreGlow2.addColorStop(0.3, '#aa44ff');
  coreGlow2.addColorStop(0.6, '#7722cc');
  coreGlow2.addColorStop(1, 'transparent');
  ctx.fillStyle = coreGlow2;
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
  // 旋转光圈
  for (var ri2 = 0; ri2 < 3; ri2++) {
    var ra = t * 3 + ri2 * Math.PI * 2 / 3;
    ctx.strokeStyle = 'rgba(200,150,255,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, 5, ra, ra + 0.8);
    ctx.stroke();
  }
  // 装甲板能量充盈脉动
  var pulseA = 0.15 + Math.sin(t * 3) * 0.1;
  ctx.fillStyle = 'rgba(170,100,255,' + pulseA + ')';
  ctx.beginPath();
  for (var pi2 = 0; pi2 < 6; pi2++) {
    var pa = Math.PI / 3 * pi2 - Math.PI / 2;
    ctx[pi2 === 0 ? 'moveTo' : 'lineTo'](Math.cos(pa) * hw * 0.9, Math.sin(pa) * hw * 0.9);
  }
  ctx.closePath(); ctx.fill();
  // 防御光幕效果
  ctx.strokeStyle = 'rgba(150,80,255,0.15)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (var di = 0; di < 6; di++) {
    var da = Math.PI / 3 * di - Math.PI / 2;
    ctx[di === 0 ? 'moveTo' : 'lineTo'](Math.cos(da) * (hw + 4), Math.sin(da) * (hw + 4));
  }
  ctx.closePath(); ctx.stroke();
};

// 狙击手 - 修长型（深空狙击舰升级版）
Enemy.prototype._renderSniper = function(ctx, w, h, t) {
  var hw = w / 2, hh = h / 2;
  // 更修长流线的外形
  var grad = ctx.createLinearGradient(-hw, 0, hw, 0);
  grad.addColorStop(0, '#1a0505');
  grad.addColorStop(0.2, '#2a0808');
  grad.addColorStop(0.4, '#4a1212');
  grad.addColorStop(0.6, '#5a1515');
  grad.addColorStop(0.8, '#3a0a0a');
  grad.addColorStop(1, '#1a0505');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(-hw - 3, 0);
  ctx.lineTo(-hw * 0.5, -hh - 1);
  ctx.lineTo(hw * 0.4, -hh * 0.5);
  ctx.lineTo(hw + 2, 0);
  ctx.lineTo(hw * 0.4, hh * 0.5);
  ctx.lineTo(-hw * 0.5, hh + 1);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // 流线装甲纹理
  ctx.strokeStyle = 'rgba(100,30,30,0.4)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(-hw, -hh * 0.4); ctx.lineTo(hw, -hh * 0.3);
  ctx.moveTo(-hw, hh * 0.4); ctx.lineTo(hw, hh * 0.3);
  ctx.stroke();
  // 深红色能量集中在前端
  var frontGlow = ctx.createRadialGradient(hw * 0.3, 0, 0, hw * 0.3, 0, 5);
  frontGlow.addColorStop(0, '#ff4455');
  frontGlow.addColorStop(0.4, '#cc2233');
  frontGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = frontGlow;
  ctx.beginPath(); ctx.arc(hw * 0.3, 0, 5, 0, Math.PI * 2); ctx.fill();
  // 瞄准激光线效果（向前延伸的红色细线）
  ctx.strokeStyle = 'rgba(255,50,50,' + (0.5 + Math.sin(t * 5) * 0.3) + ')';
  ctx.lineWidth = 0.8;
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.moveTo(hw, 0); ctx.lineTo(hw + 20, 0);
  ctx.stroke();
  // 瞄准激光点
  ctx.fillStyle = 'rgba(255,80,80,' + (0.6 + Math.sin(t * 5) * 0.3) + ')';
  ctx.beginPath(); ctx.arc(hw + 20, 0, 1, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // 能量蓄积脉动效果
  var chargePulse = Math.sin(t * 4) * 0.5 + 0.5;
  ctx.strokeStyle = 'rgba(255,60,60,' + (chargePulse * 0.3) + ')';
  ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.arc(hw * 0.3, 0, 3 + chargePulse * 3, 0, Math.PI * 2); ctx.stroke();
  // 光学迷彩边缘（半透明闪烁）
  var camoA = 0.1 + Math.sin(t * 6) * 0.08;
  ctx.strokeStyle = 'rgba(255,100,100,' + camoA + ')';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-hw - 3, 0); ctx.lineTo(-hw * 0.5, -hh - 1); ctx.lineTo(hw * 0.4, -hh * 0.5); ctx.lineTo(hw + 2, 0);
  ctx.lineTo(hw * 0.4, hh * 0.5); ctx.lineTo(-hw * 0.5, hh + 1); ctx.closePath();
  ctx.stroke();
};

// 神风 - 尖刺型（突击舰升级版）
Enemy.prototype._renderKamikaze = function(ctx, w, h, t) {
  var hw = w / 2, hh = h / 2;
  var flicker = 0.6 + Math.sin(t * 10) * 0.4;
  // 更尖锐的突击形态
  var grad = ctx.createLinearGradient(-hw, 0, hw, 0);
  grad.addColorStop(0, '#441100');
  grad.addColorStop(0.3, '#552200');
  grad.addColorStop(0.6, '#441100');
  grad.addColorStop(1, '#331100');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-hw - 3, 0);
  ctx.lineTo(-2, -hh - 1);
  ctx.lineTo(hw, -hh * 0.2);
  ctx.lineTo(hw, hh * 0.2);
  ctx.lineTo(-2, hh + 1);
  ctx.closePath();
  ctx.fill();
  // 全身能量过载效果（线条闪烁）
  ctx.strokeStyle = 'rgba(255,140,0,' + (flicker * 0.5) + ')';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-hw, -hh * 0.4); ctx.lineTo(hw, -hh * 0.15);
  ctx.moveTo(-hw, hh * 0.4); ctx.lineTo(hw, hh * 0.15);
  ctx.moveTo(-hw * 0.5, 0); ctx.lineTo(hw * 0.5, 0);
  ctx.stroke();
  // 尖刺（更强发光，蓄力感）
  ctx.fillStyle = '#ff8800';
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 12 * flicker;
  ctx.beginPath();
  ctx.moveTo(-hw - 3, 0);
  ctx.lineTo(-hw - 7, -4);
  ctx.lineTo(-hw - 1, -3);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-hw - 3, 0);
  ctx.lineTo(-hw - 7, 4);
  ctx.lineTo(-hw - 1, 3);
  ctx.closePath();
  ctx.fill();
  // 中间尖刺
  ctx.fillStyle = '#ffcc44';
  ctx.beginPath();
  ctx.moveTo(-hw - 3, 0);
  ctx.lineTo(-hw - 9, 0);
  ctx.lineTo(-hw - 1, -1);
  ctx.lineTo(-hw - 1, 1);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // 橙色能量核心（剧烈闪烁）
  var core = ctx.createRadialGradient(0, 0, 0, 0, 0, 5);
  core.addColorStop(0, '#ffcc44');
  core.addColorStop(0.3, '#ff8800');
  core.addColorStop(0.6, '#ff4400');
  core.addColorStop(1, 'transparent');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
  // 核心亮点
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 6 * flicker;
  ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // 速度线/尾迹效果
  for (var ti = 0; ti < 3; ti++) {
    var tx = hw + 3 + ti * 5;
    var ta = 0.15 - ti * 0.04;
    ctx.strokeStyle = 'rgba(255,150,50,' + ta + ')';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(tx, -1 - ti * 0.5);
    ctx.lineTo(tx + 4, -1 - ti * 0.5);
    ctx.moveTo(tx, 1 + ti * 0.5);
    ctx.lineTo(tx + 4, 1 + ti * 0.5);
    ctx.stroke();
  }
};

// 轰炸机 - 方形装甲（重装轰炸舰升级版）
Enemy.prototype._renderBomber = function(ctx, w, h, t) {
  var hw = w / 2, hh = h / 2;
  // 更方正厚重的装甲
  var grad = ctx.createLinearGradient(0, -hh, 0, hh);
  grad.addColorStop(0, '#1a4a1a');
  grad.addColorStop(0.2, '#2a6a2a');
  grad.addColorStop(0.4, '#3a8a3a');
  grad.addColorStop(0.6, '#2a6a2a');
  grad.addColorStop(0.8, '#2a5a2a');
  grad.addColorStop(1, '#1a3a1a');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#44ff44';
  ctx.shadowBlur = 6;
  // 方形主体（略微梯形增加厚重感）
  ctx.beginPath();
  ctx.moveTo(-hw - 1, -hh * 0.8);
  ctx.lineTo(hw + 1, -hh - 1);
  ctx.lineTo(hw + 1, hh + 1);
  ctx.lineTo(-hw - 1, hh * 0.8);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // 装甲板能量锁定光条
  ctx.strokeStyle = 'rgba(100,255,100,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.strokeRect(-hw + 2, -hh + 2, w - 4, h - 4);
  ctx.strokeStyle = 'rgba(80,200,80,0.25)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.strokeRect(-hw + 5, -hh + 5, w - 10, h - 10);
  // 水平装甲分割线
  ctx.strokeStyle = 'rgba(100,255,100,0.2)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(-hw, 0); ctx.lineTo(hw, 0);
  ctx.moveTo(-hw, -hh * 0.5); ctx.lineTo(hw, -hh * 0.5);
  ctx.moveTo(-hw, hh * 0.5); ctx.lineTo(hw, hh * 0.5);
  ctx.stroke();
  // 水平稳定翼
  ctx.fillStyle = '#1a4a1a';
  ctx.beginPath();
  ctx.moveTo(hw, -hh);
  ctx.lineTo(hw + 4, -hh - 3);
  ctx.lineTo(hw + 4, -hh + 2);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hw, hh);
  ctx.lineTo(hw + 4, hh + 3);
  ctx.lineTo(hw + 4, hh - 2);
  ctx.closePath();
  ctx.fill();
  // 绿色核心（弹仓发光）
  var coreGlow3 = ctx.createRadialGradient(0, 0, 0, 0, 0, 5);
  coreGlow3.addColorStop(0, '#aaffaa');
  coreGlow3.addColorStop(0.3, '#66ff66');
  coreGlow3.addColorStop(0.6, '#44cc44');
  coreGlow3.addColorStop(1, 'transparent');
  ctx.fillStyle = coreGlow3;
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
  // 底部弹仓门效果
  ctx.fillStyle = 'rgba(80,255,80,0.3)';
  ctx.shadowColor = '#44ff44';
  ctx.shadowBlur = 3;
  ctx.fillRect(-hw * 0.5, hh - 4, hw, 2);
  ctx.shadowBlur = 0;
  // 弹仓指示灯
  var bombPulse = Math.sin(t * 3) * 0.5 + 0.5;
  ctx.fillStyle = 'rgba(100,255,100,' + (bombPulse * 0.6) + ')';
  ctx.beginPath(); ctx.arc(-hw * 0.3, hh - 3, 1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hw * 0.3, hh - 3, 1, 0, Math.PI * 2); ctx.fill();
};

// ========== BOSS (横版：从右侧进入) ==========
function Boss() { Entity.call(this, 0, 0, 70, 80); this.reset(); }
Boss.prototype = Object.create(Entity.prototype);
Boss.prototype.constructor = Boss;

Boss.prototype.reset = function() {
  this.x = CFG.BW + 100; this.y = CFG.BH / 2; this.active = false;
  this.entering = false; this.phase = 1;
  this.hp = 300; this.maxHp = 300;
  this.name = '虚空守护者';
  this.phaseHp = [300, 200, 100];
  this.moveTimer = 0; this.fireTimer = 0; this.specialTimer = 0; this.time = 0;
  this.orbiters = [];
  this.targetY = CFG.BH / 2; this.entered = false;
};

Boss.prototype.init = function() {
  this.active = true; this.entering = true; this.entered = false;
  this.x = CFG.BW + 100; this.y = CFG.BH / 2; this.phase = 1;
  this.hp = this.phaseHp[0]; this.maxHp = this.phaseHp[0];
  this.moveTimer = 0; this.fireTimer = 0; this.specialTimer = 0; this.time = 0;
  this.orbiters = [];
  for (var i = 0; i < 4; i++) {
    this.orbiters.push({ angle: Math.PI / 2 * i, dist: 50, hp: 50, maxHp: 50, active: true, size: 12 });
  }
  this.targetY = CFG.BH / 2;
};

Boss.prototype._onPhaseChange = function(enemyBullets) {
  enemyBullets.list.length = 0;
  this.specialTimer = 1000;
  if (this.phase === 3) {
    for (var i = 0; i < this.orbiters.length; i++) { this.orbiters[i].active = false; }
  }
};

Boss.prototype._firePattern = function(player, enemyBullets) {
  var pool = enemyBullets.pool, list = enemyBullets.list;
  var cx = this.x, cy = this.y;

  if (this.phase === 1) {
    this.fireTimer = 800;
    for (var oi = 0; oi < this.orbiters.length; oi++) {
      var orb = this.orbiters[oi];
      if (!orb.active) { continue; }
      var ox = cx + Math.cos(orb.angle) * orb.dist;
      var oy = cy + Math.sin(orb.angle) * orb.dist;
      for (var i = 0; i < 6; i++) {
        var a = Math.PI * 2 / 6 * i + this.time;
        var b = pool.acquire();
        b.init(ox, oy, Math.cos(a) * 120, Math.sin(a) * 120, 1, '#ff6644', true);
        b.width = 4; b.height = 4; list.push(b);
      }
    }
    if (player && player.active) {
      var pa = U.ang(cx, cy, player.x, player.y);
      for (var j = -1; j <= 1; j++) {
        var bb = pool.acquire();
        var sa = pa + j * 0.2;
        bb.init(cx - 30, cy, Math.cos(sa) * 180, Math.sin(sa) * 180, 1, '#ff2244', true);
        list.push(bb);
      }
    }
  } else if (this.phase === 2) {
    this.fireTimer = 500;
    for (var oi2 = 0; oi2 < this.orbiters.length; oi2++) {
      var orb2 = this.orbiters[oi2];
      if (!orb2.active) { continue; }
      var ox2 = cx + Math.cos(orb2.angle) * orb2.dist;
      var oy2 = cy + Math.sin(orb2.angle) * orb2.dist;
      for (var k = 0; k < 10; k++) {
        var a2 = Math.PI * 2 / 10 * k + this.time * 2;
        var b2 = pool.acquire();
        b2.init(ox2, oy2, Math.cos(a2) * 100, Math.sin(a2) * 100, 1, '#ff6644', true);
        b2.width = 3; b2.height = 3; list.push(b2);
      }
    }
    if (this.specialTimer <= 0) {
      this.specialTimer = 3000;
      var sweepAngle = this.time * 2 % (Math.PI * 2);
      for (var m = 0; m < 8; m++) {
        var a3 = sweepAngle + m * 0.15;
        var b3 = pool.acquire();
        b3.init(cx - 30, cy, Math.cos(a3) * 250, Math.sin(a3) * 250, 1, '#ff0066', true);
        b3.width = 12; b3.height = 3; list.push(b3);
      }
    }
  } else {
    this.fireTimer = 300;
    for (var n = 0; n < 16; n++) {
      var a4 = Math.PI * 2 / 16 * n + this.time * 1.5;
      var b4 = pool.acquire();
      b4.init(cx, cy, Math.cos(a4) * 150, Math.sin(a4) * 150, 1, '#ff2244', true);
      b4.width = 3; b4.height = 3; list.push(b4);
    }
    if (Math.random() < 0.3) {
      for (var p = 0; p < 5; p++) {
        var b5 = pool.acquire();
        b5.init(CFG.BW + 10, U.r(40, CFG.BH - 40), U.r(-300, -150), U.r(-30, 30), 1, '#ff8800', true);
        b5.width = 5; b5.height = 5; list.push(b5);
      }
    }
  }
};

Boss.prototype.update = function(dt, player, enemyBullets) {
  if (!this.active) { return; }
  this.time += dt; this.moveTimer += dt;
  this.fireTimer -= dt * 1000; this.specialTimer -= dt * 1000;

  if (this.entering) {
    this.x = U.lerp(this.x, CFG.BW - 150, dt * 2);
    if (Math.abs(this.x - (CFG.BW - 150)) < 2) { this.x = CFG.BW - 150; this.entering = false; this.entered = true; }
    return;
  }

  var hr = this.hp / this.phaseHp[0];
  if (hr <= 0.33 && this.phase < 3) { this.phase = 3; this._onPhaseChange(enemyBullets); }
  else if (hr <= 0.66 && this.phase < 2) { this.phase = 2; this._onPhaseChange(enemyBullets); }

  if (this.phase === 1) {
    this.targetY = CFG.BH / 2 + Math.sin(this.time * 0.5) * 120;
  } else if (this.phase === 2) {
    if (player && player.active) { this.targetY = U.lerp(this.targetY, player.y, dt * 1.5); }
  } else {
    this.targetY = CFG.BH / 2 + Math.sin(this.time * 2) * 150;
  }
  this.y = U.lerp(this.y, this.targetY, dt * 2);

  for (var i = 0; i < this.orbiters.length; i++) {
    var o = this.orbiters[i];
    if (!o.active) { continue; }
    o.angle += dt * (this.phase >= 2 ? 3 : 1.5);
    o.dist = 50 + Math.sin(this.time * 2 + o.angle) * 15;
  }

  if (this.fireTimer <= 0) { this._firePattern(player, enemyBullets); }
};

Boss.prototype.render = function(ctx) {
  if (!this.active) { return; }
  var cx = this.x, cy = this.y;
  var t = this.time;
  var hpRatio = this.hp / this.maxHp;

  // 环绕粒子（升级版：更华丽）
  for (var i = 0; i < this.orbiters.length; i++) {
    var o = this.orbiters[i];
    if (!o.active) { continue; }
    var ox = cx + Math.cos(o.angle) * o.dist;
    var oy = cy + Math.sin(o.angle) * o.dist;
    // 轨道器光晕（更大）
    var oGlow = ctx.createRadialGradient(ox, oy, 0, ox, oy, o.size * 1.5);
    oGlow.addColorStop(0, 'rgba(255,100,50,0.5)');
    oGlow.addColorStop(0.5, 'rgba(255,60,30,0.2)');
    oGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = oGlow;
    ctx.beginPath(); ctx.arc(ox, oy, o.size * 1.5, 0, Math.PI * 2); ctx.fill();
    // 轨道器主体
    var oGrad = ctx.createRadialGradient(ox - 2, oy - 2, 1, ox, oy, o.size / 2);
    oGrad.addColorStop(0, '#ffdd99');
    oGrad.addColorStop(0.4, '#ff8844');
    oGrad.addColorStop(0.8, '#cc3311');
    oGrad.addColorStop(1, '#661100');
    ctx.fillStyle = oGrad;
    ctx.shadowColor = '#ff6644'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(ox, oy, o.size / 2, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // 轨道器自身光圈
    ctx.strokeStyle = 'rgba(255,150,80,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(ox, oy, o.size * 0.7, 0, Math.PI * 2); ctx.stroke();
    // 轨道器拖尾
    var tailA = o.angle - 0.3;
    var tx1 = cx + Math.cos(tailA) * o.dist;
    var ty1 = cy + Math.sin(tailA) * o.dist;
    ctx.strokeStyle = 'rgba(255,100,50,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(tx1, ty1); ctx.stroke();
    // 轨道器血条
    if (o.hp < o.maxHp) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(ox - 8, oy - o.size - 4, 16, 2);
      ctx.fillStyle = '#ff4466'; ctx.fillRect(ox - 8, oy - o.size - 4, 16 * (o.hp / o.maxHp), 2);
    }
  }

  // 细碎环绕粒子（碎石环绕）
  for (var di = 0; di < 8; di++) {
    var da = t * 0.8 + di * Math.PI * 2 / 8;
    var dr = 42 + Math.sin(t * 1.5 + di * 1.3) * 12;
    var dx2 = cx + Math.cos(da) * dr;
    var dy2 = cy + Math.sin(da) * dr * 0.8;
    var dsz = 1.5 + Math.sin(di * 2.7) * 0.5;
    ctx.fillStyle = 'rgba(200,80,40,0.3)';
    ctx.beginPath(); ctx.arc(dx2, dy2, dsz, 0, Math.PI * 2); ctx.fill();
  }

  // === 能量护盾（多层，六角网格） ===
  var shieldAlpha = 0.1 + 0.05 * Math.sin(t * 1.5);
  var shieldR = this.width * 1.15;
  // 外层护盾
  ctx.strokeStyle = 'rgba(255,50,50,' + shieldAlpha + ')';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.ellipse(cx, cy, shieldR, shieldR * 0.72, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // 内层护盾
  ctx.strokeStyle = 'rgba(255,80,80,' + (shieldAlpha * 0.6) + ')';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(cx, cy, shieldR * 0.88, shieldR * 0.88 * 0.72, 0, 0, Math.PI * 2);
  ctx.stroke();
  // 护盾六角网格纹理
  var hSRx = shieldR * 0.92, hSRy = shieldR * 0.92 * 0.72;
  ctx.strokeStyle = 'rgba(255,60,60,' + (shieldAlpha * 0.4) + ')';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  for (var hi = 0; hi < 6; hi++) {
    var ha = Math.PI / 3 * hi - Math.PI / 2;
    ctx[hi === 0 ? 'moveTo' : 'lineTo'](cx + Math.cos(ha) * hSRx, cy + Math.sin(ha) * hSRy);
  }
  ctx.closePath(); ctx.stroke();
  // 六角内部连线
  for (var hi2 = 0; hi2 < 6; hi2++) {
    var ha2 = Math.PI / 3 * hi2 - Math.PI / 2;
    var hx1 = cx + Math.cos(ha2) * hSRx, hy1 = cy + Math.sin(ha2) * hSRy;
    var ha3 = Math.PI / 3 * ((hi2 + 1) % 6) - Math.PI / 2;
    var hx2 = cx + Math.cos(ha3) * hSRx, hy2 = cy + Math.sin(ha3) * hSRy;
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo((hx1 + hx2) / 2, (hy1 + hy2) / 2);
    ctx.stroke();
  }

  // === 多层装甲主体 ===
  var w = this.width, h = this.height;
  var hw = w / 2, hh = h / 2;

  // 最外层 - 暗色金属基座（增强3D感）
  var baseGrad = ctx.createRadialGradient(cx - hw * 0.15, cy - hh * 0.15, hw * 0.2, cx, cy, hw);
  baseGrad.addColorStop(0, '#1a0808');
  baseGrad.addColorStop(0.5, '#0a0404');
  baseGrad.addColorStop(1, '#050202');
  ctx.fillStyle = baseGrad;
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw, hh, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 第二层 - 装甲板（更强光照渐变）
  var armorGrad = ctx.createRadialGradient(cx - hw * 0.25, cy - hh * 0.25, hw * 0.1, cx, cy, hw * 0.8);
  armorGrad.addColorStop(0, '#5a1a1a');
  armorGrad.addColorStop(0.3, '#3a0e0e');
  armorGrad.addColorStop(0.5, '#2a0a0a');
  armorGrad.addColorStop(0.7, '#3a1010');
  armorGrad.addColorStop(1, '#1a0505');
  ctx.fillStyle = armorGrad;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw * 0.85, hh * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();

  // 第三层 - 核心区
  var coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, hw * 0.5);
  coreGrad.addColorStop(0, '#ff3355');
  coreGrad.addColorStop(0.3, '#cc1133');
  coreGrad.addColorStop(0.6, '#881122');
  coreGrad.addColorStop(1, '#330a0a');
  ctx.fillStyle = coreGrad;
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw * 0.5, hh * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // === 装甲板分割线（更粗更亮） ===
  var splitA = 0.4 + (hpRatio < 0.4 ? Math.sin(t * 8) * 0.2 : 0);
  ctx.strokeStyle = 'rgba(255,100,80,' + splitA + ')';
  ctx.lineWidth = 1.5;
  for (var j = 0; j < 8; j++) {
    var la = Math.PI / 4 * j + t * 0.3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(la) * hw * 0.82, cy + Math.sin(la) * hh * 0.82);
    ctx.stroke();
  }

  // 装甲损伤纹理（低血量时裂纹/火花）
  if (hpRatio < 0.5) {
    var dmgIntensity = 1 - hpRatio * 2;
    for (var ci2 = 0; ci2 < 4; ci2++) {
      var cAngle = ci2 * 1.7 + t * 0.5;
      var cR = hw * 0.4 + ci2 * 5;
      var cxp = cx + Math.cos(cAngle) * cR * 0.5;
      var cyp = cy + Math.sin(cAngle) * cR * 0.4;
      // 裂纹线
      ctx.strokeStyle = 'rgba(255,180,50,' + (dmgIntensity * 0.4) + ')';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(cxp, cyp);
      ctx.lineTo(cxp + Math.cos(cAngle + 0.5) * 8, cyp + Math.sin(cAngle + 0.5) * 6);
      ctx.lineTo(cxp + Math.cos(cAngle - 0.3) * 12, cyp + Math.sin(cAngle - 0.3) * 8);
      ctx.stroke();
      // 火花
      if (Math.sin(t * 10 + ci2 * 2) > 0.6) {
        ctx.fillStyle = 'rgba(255,200,50,' + (dmgIntensity * 0.7) + ')';
        ctx.beginPath(); ctx.arc(cxp, cyp, 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // 核心区旋涡效果
  for (var vi = 0; vi < 3; vi++) {
    var vAngle = t * 2 + vi * Math.PI * 2 / 3;
    var vR = 5 + vi * 5;
    var vpx = cx + Math.cos(vAngle) * vR;
    var vpy = cy + Math.sin(vAngle) * vR;
    ctx.fillStyle = 'rgba(255,100,80,' + (0.15 - vi * 0.04) + ')';
    ctx.beginPath(); ctx.arc(vpx, vpy, 3, 0, Math.PI * 2); ctx.fill();
  }

  // === 中央能量核心（升级版：旋涡/黑洞效果） ===
  var pulse = 1 + Math.sin(t * 3) * 0.2;
  var coreExpose = this.phase >= 3 ? 1.5 : 1;
  var icGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 15 * pulse * coreExpose);
  icGlow.addColorStop(0, '#ffffff');
  icGlow.addColorStop(0.15, '#ffaacc');
  icGlow.addColorStop(0.3, '#ff4466');
  icGlow.addColorStop(0.6, '#cc1133');
  icGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = icGlow;
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 25 * pulse * coreExpose;
  ctx.beginPath();
  ctx.arc(cx, cy, 15 * pulse * coreExpose, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 旋涡效果
  ctx.strokeStyle = 'rgba(255,200,200,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var sp2 = 0; sp2 < Math.PI * 4; sp2 += 0.2) {
    var spr = sp2 * 2 + 2;
    var spa = sp2 + t * 3;
    var spx = cx + Math.cos(spa) * spr;
    var spy = cy + Math.sin(spa) * spr;
    if (spr > 14) { break; }
    ctx[sp2 === 0 ? 'moveTo' : 'lineTo'](spx, spy);
  }
  ctx.stroke();

  // 核心亮点
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#ff8888';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 能量触手（从核心延伸到装甲板的光线）
  for (var ti2 = 0; ti2 < 4; ti2++) {
    var tAngle = Math.PI / 2 * ti2 + t * 0.5;
    var tInner = 15;
    var tOuter = hw * 0.7;
    var tAlpha = 0.2 + Math.sin(t * 3 + ti2) * 0.1;
    ctx.strokeStyle = 'rgba(255,80,80,' + tAlpha + ')';
    ctx.lineWidth = 1.2;
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(tAngle) * tInner, cy + Math.sin(tAngle) * tInner);
    // 弯曲的触手
    var tMidR = (tInner + tOuter) / 2;
    var tMidA = tAngle + Math.sin(t * 2 + ti2) * 0.3;
    ctx.quadraticCurveTo(
      cx + Math.cos(tMidA) * tMidR, cy + Math.sin(tMidA) * tMidR,
      cx + Math.cos(tAngle) * tOuter, cy + Math.sin(tAngle) * tOuter
    );
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // === 发光线路（更多更亮，脉动随阶段变化） ===
  var linePulseFreq = this.phase >= 3 ? 8 : this.phase >= 2 ? 6 : 4;
  var lineA3 = 0.5 + Math.sin(t * linePulseFreq) * 0.25;
  // 低血量时线路闪烁
  if (hpRatio < 0.4) { lineA3 *= (0.5 + Math.sin(t * 12) * 0.5); }
  ctx.strokeStyle = 'rgba(255,80,80,' + lineA3 + ')';
  ctx.lineWidth = 1.8;
  ctx.shadowColor = '#ff4444';
  ctx.shadowBlur = 8;
  // 十字线
  ctx.beginPath();
  ctx.moveTo(cx - hw * 0.4, cy); ctx.lineTo(cx + hw * 0.4, cy);
  ctx.moveTo(cx, cy - hh * 0.4); ctx.lineTo(cx, cy + hh * 0.4);
  ctx.stroke();
  // 对角线
  ctx.strokeStyle = 'rgba(255,100,80,' + (lineA3 * 0.6) + ')';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - hw * 0.3, cy - hh * 0.3); ctx.lineTo(cx + hw * 0.3, cy + hh * 0.3);
  ctx.moveTo(cx + hw * 0.3, cy - hh * 0.3); ctx.lineTo(cx - hw * 0.3, cy + hh * 0.3);
  ctx.stroke();
  // 环形能量线
  ctx.strokeStyle = 'rgba(255,60,60,' + (lineA3 * 0.4) + ')';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw * 0.35, hh * 0.35, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw * 0.6, hh * 0.6, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // === 装甲边缘高光 ===
  ctx.strokeStyle = 'rgba(255,150,130,0.25)';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#ff6644';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw * 0.85, hh * 0.85, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // === 环绕粒子轨道（更明显） ===
  ctx.strokeStyle = 'rgba(255,100,50,0.18)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.ellipse(cx, cy, hw * 0.95, hh * 0.95, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // === Boss后方大型推进器火焰 ===
  var thrustLen = 20 + Math.sin(t * 4) * 8;
  // 上推进器
  for (var thi = -1; thi <= 1; thi += 2) {
    var thy = cy + thi * hh * 0.5;
    var thGrad = ctx.createLinearGradient(cx + hw, thy, cx + hw + thrustLen, thy);
    thGrad.addColorStop(0, '#ff6644');
    thGrad.addColorStop(0.3, '#cc3322');
    thGrad.addColorStop(0.6, '#881111');
    thGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = thGrad;
    ctx.beginPath();
    ctx.moveTo(cx + hw, thy - 6);
    ctx.lineTo(cx + hw + thrustLen, thy + Math.sin(t * 6 + thi) * 3);
    ctx.lineTo(cx + hw + thrustLen * 0.7, thy);
    ctx.lineTo(cx + hw + thrustLen, thy - Math.sin(t * 6 + thi) * 3);
    ctx.lineTo(cx + hw, thy + 6);
    ctx.closePath();
    ctx.fill();
    // 推进器内核
    var thInner = ctx.createLinearGradient(cx + hw, thy, cx + hw + thrustLen * 0.5, thy);
    thInner.addColorStop(0, '#ffcc88');
    thInner.addColorStop(0.3, '#ff8844');
    thInner.addColorStop(1, 'transparent');
    ctx.fillStyle = thInner;
    ctx.beginPath();
    ctx.moveTo(cx + hw, thy - 3);
    ctx.lineTo(cx + hw + thrustLen * 0.5, thy + Math.sin(t * 8 + thi) * 1.5);
    ctx.lineTo(cx + hw, thy + 3);
    ctx.closePath();
    ctx.fill();
  }
  // 中央推进器（更大）
  var cThrustLen = 30 + Math.sin(t * 3) * 10;
  var cThGrad = ctx.createLinearGradient(cx + hw, cy, cx + hw + cThrustLen, cy);
  cThGrad.addColorStop(0, '#ff8855');
  cThGrad.addColorStop(0.2, '#ff4422');
  cThGrad.addColorStop(0.5, '#aa2211');
  cThGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = cThGrad;
  ctx.beginPath();
  ctx.moveTo(cx + hw, cy - 10);
  ctx.lineTo(cx + hw + cThrustLen, cy + Math.sin(t * 5) * 4);
  ctx.lineTo(cx + hw + cThrustLen * 0.6, cy);
  ctx.lineTo(cx + hw + cThrustLen, cy - Math.sin(t * 5) * 4);
  ctx.lineTo(cx + hw, cy + 10);
  ctx.closePath();
  ctx.fill();
  // 中央推进器光晕
  ctx.fillStyle = 'rgba(255,100,50,0.08)';
  ctx.beginPath();
  ctx.ellipse(cx + hw + cThrustLen * 0.4, cy, cThrustLen * 0.6, 14, 0, 0, Math.PI * 2);
  ctx.fill();
};

Boss.prototype.getOrbiterBounds = function(index) {
  var o = this.orbiters[index];
  if (!o || !o.active) { return null; }
  var ox = this.x + Math.cos(o.angle) * o.dist;
  var oy = this.y + Math.sin(o.angle) * o.dist;
  return { x: ox - o.size / 2 - 2, y: oy - o.size / 2 - 2, w: o.size + 4, h: o.size + 4 };
};

// ========== POWERUP ==========
function PowerUp() { Entity.call(this, 0, 0, 20, 20); this.reset(); }
PowerUp.prototype = Object.create(Entity.prototype);
PowerUp.prototype.constructor = PowerUp;

PowerUp.prototype.reset = function() {
  this.x = 0; this.y = 0; this.active = false;
  this.type = 'weapon'; this.vx = -100; this.glowTimer = 0;
};

var POWERUP_CONFIGS = {
  weapon:    { color: '#ff4466', symbol: 'W' },
  subweapon: { color: '#4488ff', symbol: 'S' },
  health:    { color: '#44ff44', symbol: '\u2665' },
  shield:    { color: '#00ccff', symbol: '\u25C8' },
  bomb:      { color: '#ff8800', symbol: '\uD83D\uDCA3' },
  coin:      { color: '#ffd700', symbol: '$' },
  life:      { color: '#ff66ff', symbol: '1UP' },
  power:     { color: '#aa44ff', symbol: '\u26A1' }
};

PowerUp.prototype.init = function(x, y, type) {
  this.x = x; this.y = y; this.active = true;
  this.type = type; this.vx = -100; this.glowTimer = 0;
  this.cfg = POWERUP_CONFIGS[type] || POWERUP_CONFIGS.weapon;
};

PowerUp.prototype.update = function(dt) {
  this.x += this.vx * dt;
  this.glowTimer += dt;
  if (this.x < -30) { this.active = false; }
};

PowerUp.prototype.render = function(ctx) {
  var pulse = 1 + Math.sin(this.glowTimer * 4) * 0.15;
  ctx.save();
  ctx.translate(this.x, this.y);
  ctx.scale(pulse, pulse);
  // 外层光晕
  var glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.width / 2 + 2);
  glowGrad.addColorStop(0, this.cfg.color + '66');
  glowGrad.addColorStop(0.5, this.cfg.color + '22');
  glowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrad;
  ctx.beginPath(); ctx.arc(0, 0, this.width / 2 + 2, 0, Math.PI * 2); ctx.fill();
  // 边框
  ctx.strokeStyle = this.cfg.color;
  ctx.lineWidth = 1.5;
  ctx.shadowColor = this.cfg.color;
  ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2); ctx.stroke();
  ctx.shadowBlur = 0;
  // 填充
  ctx.fillStyle = this.cfg.color + '33';
  ctx.beginPath(); ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2); ctx.fill();
  // 符号
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = this.cfg.color;
  ctx.shadowBlur = 6;
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(this.cfg.symbol, 0, 0);
  ctx.shadowBlur = 0;
  ctx.restore();
};

// ========== COLLISION ==========
var Col = {};

Col.checkBulletEnemy = function(bullets, enemies, particles, audio, camera) {
  for (var bi = 0; bi < bullets.length; bi++) {
    var b = bullets[bi];
    if (!b.active || b.isEnemy) { continue; }
    for (var ei = 0; ei < enemies.length; ei++) {
      var e = enemies[ei];
      if (!e.active) { continue; }
      if (b.collidesWith(e)) {
        var maxHp = e.maxHp || e.hp + b.damage;  // 记录原始hp用于判断爆炸类型
        b.active = false; e.hp -= b.damage;
        // 命中反馈 - 增强
        particles.emitHitSpark(b.x, b.y, e.color);
        particles.emitHitSpark(b.x, b.y, e.color);  // 双倍火花
        particles.emitEnergyRing(b.x, b.y, 8, '#ffffff');
        particles.emitShockwave(b.x, b.y, 8, e.color);  // 小型命中冲击波
        particles.emitDebris(b.x, b.y, 3, e.color, 100);  // 金属碎片
        e.hitFlash = 0.1;
        audio.hit();
        if (camera) { camera.shake(1.5, 60, 'light'); }  // 命中微震
        if (e.hp <= 0) {
          e.active = false;
          // 根据敌机最大血量决定爆炸大小
          var expType = 'small';
          if (maxHp > 3) { expType = 'large'; }
          else if (maxHp > 1) { expType = 'medium'; }
          particles.createExplosion(e.x, e.y, expType);
          particles.emitShockwave(e.x, e.y, expType === 'large' ? 35 : (expType === 'medium' ? 28 : 20), e.color);
          particles.emitDebris(e.x, e.y, expType === 'large' ? 8 : (expType === 'medium' ? 5 : 3), e.color, 180);
          audio.explode(expType);
          return { killed: true, enemy: e, x: e.x, y: e.y, score: e.score, expType: expType, hitX: b.x, hitY: b.y };
        }
        return { killed: false, hitX: b.x, hitY: b.y };
      }
    }
  }
  return null;
};

Col.checkBulletPlayer = function(enemyBullets, player, particles, audio, camera) {
  if (!player.active || player.invincible || player.dashing) { return false; }
  for (var i = 0; i < enemyBullets.length; i++) {
    var b = enemyBullets[i];
    if (!b.active) { continue; }
    if (b.collidesWith(player)) {
      b.active = false;
      if (player.takeDamage(1)) {
        particles.emit(player.x, player.y, 10, { color: '#ff4466', speed: 200, spread: Math.PI * 2, life: 0.3, size: 3 });
        particles.emitShockwave(player.x, player.y, 25, '#ff4466');  // 红色冲击波
        particles.emitDebris(player.x, player.y, 5, '#ff4466', 160);  // 碎片
        audio.hit(); camera.shake(CFG.SH.ph.i, CFG.SH.ph.d, 'medium');
        return true;
      }
    }
  }
  return false;
};

Col.checkBulletBoss = function(bullets, boss, particles, audio, camera) {
  if (!boss.active || !boss.entered) { return null; }
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    if (!b.active || b.isEnemy) { continue; }
    if (b.collidesWith(boss)) {
      b.active = false; boss.hp -= b.damage;
      particles.emitHitSpark(b.x, b.y, '#ff6644');
      particles.emitHitSpark(b.x, b.y, '#ff6644');  // 双倍火花
      particles.emitEnergyRing(b.x, b.y, 12, '#ff4466');  // 增大能量环
      particles.emitDebris(b.x, b.y, 4, '#ff6644', 120);  // 金属碎片
      if (camera) { camera.shake(1.5, 60, 'light'); }  // 命中微震
      return { hit: true, damage: b.damage };
    }
    for (var oi = 0; oi < boss.orbiters.length; oi++) {
      var ob = boss.getOrbiterBounds(oi);
      if (!ob) { continue; }
      var bb = b.getBounds();
      if (bb.x < ob.x + ob.w && bb.x + bb.w > ob.x && bb.y < ob.y + ob.h && bb.y + bb.h > ob.y) {
        b.active = false; boss.orbiters[oi].hp -= b.damage;
        if (boss.orbiters[oi].hp <= 0) { boss.orbiters[oi].active = false; }
        particles.emitHitSpark(b.x, b.y, '#ff8844');
        particles.emitEnergyRing(b.x, b.y, 6, '#ff8844');
        return { hit: false };
      }
    }
  }
  return null;
};

Col.checkEnemyPlayer = function(enemies, player, particles, audio, camera) {
  if (!player.active || player.invincible || player.dashing) { return; }
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    if (!e.active) { continue; }
    if (e.collidesWith(player)) {
      e.active = false;
      particles.createExplosion(e.x, e.y, 'medium');  // 增强爆炸
      particles.emitShockwave(e.x, e.y, 30, '#ff4466');  // 增大冲击波
      particles.emitDebris(e.x, e.y, 6, '#ff8844', 180);  // 碎片
      if (player.takeDamage(1)) {
        audio.explode();
        camera.shake(CFG.SH.ph.i, CFG.SH.ph.d, 'heavy');
      }
    }
  }
};

Col.checkPowerupPlayer = function(powerups, player, audio) {
  for (var i = 0; i < powerups.length; i++) {
    var p = powerups[i];
    if (!p.active) { continue; }
    if (p.collidesWith(player)) {
      p.active = false; audio.powerup();
      return p.type;
    }
  }
  return null;
};

// ========== SPAWNER (横版：从右侧生成敌人) ==========
function Spawner() {
  this.timer = 0; this.eliteTimer = 0;
  this.currentInterval = CFG.SII;
  this.totalTime = 0; this.bossSpawned = false; this.bossDefeated = false;
}
Spawner.prototype.reset = function() {
  this.timer = 0; this.eliteTimer = 0;
  this.currentInterval = CFG.SII;
  this.totalTime = 0; this.bossSpawned = false; this.bossDefeated = false;
};
Spawner.prototype.update = function(dt, enemies, pool) {
  this.totalTime += dt * 1000;
  this.timer -= dt * 1000;
  this.eliteTimer -= dt * 1000;
  this.currentInterval = Math.max(CFG.SIM, CFG.SII - this.totalTime * CFG.DRR / 1000);
  if (this.timer <= 0) { this.timer = this.currentInterval; this._spawnWave(enemies, pool); }
};
Spawner.prototype._getWeights = function() {
  var t = this.totalTime / 1000;
  return {
    scout: Math.max(10, 40 - t * 0.5),
    fighter: 25, tank: Math.min(30, 5 + t * 0.3),
    sniper: Math.min(25, 5 + t * 0.2),
    kamikaze: Math.min(20, 5 + t * 0.15),
    bomber: Math.min(20, 5 + t * 0.15)
  };
};
Spawner.prototype._weightedRandom = function(items, weights) {
  var total = 0;
  var keys = Object.keys(weights);
  for (var i = 0; i < keys.length; i++) { total += weights[keys[i]]; }
  var r = Math.random() * total;
  for (var j = 0; j < items.length; j++) { r -= weights[items[j]] || 0; if (r <= 0) { return items[j]; } }
  return items[0];
};
Spawner.prototype._spawnWave = function(enemies, pool) {
  var pa = CFG.PA;
  var types = ['scout', 'scout', 'fighter', 'fighter', 'tank', 'sniper', 'kamikaze', 'bomber'];
  var weights = this._getWeights();
  var type = this._weightedRandom(types, weights);
  var count = type === 'scout' ? U.ri(1, 3) : 1;
  for (var i = 0; i < count; i++) {
    var e = pool.acquire();
    var x = CFG.BW + U.r(0, 100);
    var y = U.r(pa.y + 30, pa.y + pa.h - 30);
    e.init(type, x, y); enemies.push(e);
  }
};
Spawner.prototype.shouldSpawnBoss = function() {
  return !this.bossSpawned && this.totalTime >= CFG.BST;
};

// ========== COMBO ==========
function Combo() {
  this.count = 0; this.timer = 0; this.multiplier = 1.0;
  this.displayTimer = 0; this.displayText = '';
}
Combo.prototype.reset = function() {
  this.count = 0; this.timer = 0; this.multiplier = 1.0;
  this.displayTimer = 0; this.displayText = '';
};
Combo.prototype.addKill = function() {
  this.count++; this.timer = CFG.CT / 1000;
  this._updateMultiplier(); this.displayTimer = 1.5;
  this.displayText = '\u00D7' + this.multiplier.toFixed(1);
};
Combo.prototype._updateMultiplier = function() {
  if (this.count >= 200) { this.multiplier = 10.0; }
  else if (this.count >= 100) { this.multiplier = 5.0; }
  else if (this.count >= 50) { this.multiplier = 3.0; }
  else if (this.count >= 30) { this.multiplier = 2.0; }
  else if (this.count >= 10) { this.multiplier = 1.5; }
  else { this.multiplier = 1.0; }
};
Combo.prototype.update = function(dt) {
  if (this.timer > 0) { this.timer -= dt; if (this.timer <= 0) { this.count = 0; this.multiplier = 1.0; } }
  if (this.displayTimer > 0) { this.displayTimer -= dt; }
};
Combo.prototype.getMultiplierColor = function() {
  if (this.multiplier >= 10) { return '#ff00ff'; }
  if (this.multiplier >= 5) { return '#ffd700'; }
  if (this.multiplier >= 3) { return '#aa44ff'; }
  if (this.multiplier >= 2) { return '#4488ff'; }
  if (this.multiplier >= 1.5) { return '#44ff44'; }
  return '#ffffff';
};

// ========== POWERUP MANAGER ==========
var PUM = {
  dropTypes: ['weapon', 'weapon', 'subweapon', 'subweapon', 'health', 'shield', 'bomb', 'coin', 'coin', 'coin', 'life', 'power'],
  spawn: function(x, y, powerups, pool) {
    var type = this.dropTypes[U.ri(0, this.dropTypes.length - 1)];
    var p = pool.acquire();
    p.init(x, y, type); powerups.push(p);
  },
  apply: function(type, player) {
    switch (type) {
      case 'weapon': player.weaponLevel = Math.min(5, player.weaponLevel + 1); break;
      case 'subweapon': player.subWeaponLevel = Math.min(4, player.subWeaponLevel + 1); break;
      case 'health': player.hp = Math.min(player.maxHp, player.hp + 1); break;
      case 'shield': player.shield = Math.min(player.maxShield, player.shield + 30); break;
      case 'bomb': player.bombs = Math.min(CFG.BMAX + 2, player.bombs + 1); break;
      case 'coin': return 500;
      case 'life': player.lives = Math.min(CFG.PML, player.lives + 1); break;
      case 'power': player.weaponLevel = 5; player.invincible = true; player.invincibleTimer = 5000; break;
    }
    return 0;
  }
};

// ========== MAIN GAME ==========
function Game() {
  this.cv = document.getElementById('cv');
  this.ctx = this.cv.getContext('2d');
  this.state = 'MENU';
  this.time = 0; this.lastTime = 0;
  this.score = 0; this.highScore = S.get('highscore', 0);
  this.enemiesKilled = 0; this.bossesDefeated = 0;
  this.bossIntroTimer = 0;
  this.bombActive = false; this.bombTimer = 0; this.bombFlash = 0;
  this.screenFlash = 0;       // 屏幕闪光
  this.screenRedFlash = 0;    // 屏幕闪红（玩家受伤）
  this.slowMotion = 0;        // 慢动作系数
  this.slowMotionTarget = 0;  // 慢动作目标值

  this.input = new Input();
  this.audio = new AudioManager();
  this.camera = new Camera();
  this.particles = new ParticleSystem();
  this.starField = new StarField();
  this.combo = new Combo();
  this.spawner = new Spawner();

  this.player = new Player();
  this.playerBullets = { list: [], pool: new Pool(function() { return new Bullet(); }, function(b) { b.reset(); }, 200) };
  this.enemyBullets = { list: [], pool: new Pool(function() { return new Bullet(); }, function(b) { b.reset(); }, 400) };
  this.enemies = [];
  this.enemyPool = new Pool(function() { return new Enemy(); }, function(e) { e.reset(); }, 40);
  this.powerups = [];
  this.powerupPool = new Pool(function() { return new PowerUp(); }, function(p) { p.reset(); }, 20);
  this.boss = new Boss();

  this._initUI();
  this._initAudio();
  this._resize();
  window.addEventListener('resize', this._resize.bind(this));

  this.lastTime = performance.now();
  this._loop = this._loop.bind(this);
  window._gameInstance = this;
  requestAnimationFrame(this._loop);
  this._showMenu();
}

Game.prototype._resize = function() {
  var container = document.getElementById('gc');
  var maxW = window.innerWidth;
  var maxH = window.innerHeight;
  var scale = Math.min(maxW / CFG.BW, maxH / CFG.BH);
  this.cv.width = CFG.BW;
  this.cv.height = CFG.BH;
  container.style.width = (CFG.BW * scale) + 'px';
  container.style.height = (CFG.BH * scale) + 'px';
  container.style.setProperty('--scale', scale);
};

Game.prototype._initUI = function() {
  var self = this;
  document.getElementById('bstart').addEventListener('click', function() { self._startGame(); });
