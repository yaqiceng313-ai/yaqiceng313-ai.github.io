<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="description" content="曾雅琦的个人简历与职业介绍" />
  <title>曾雅琦｜个人简历</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: rgba(255,255,255,.82);
      --surface-solid: #fff;
      --text: #172033;
      --muted: #697386;
      --line: #e4e8f0;
      --primary: #635bff;
      --primary-2: #8b5cf6;
      --accent: #14b8a6;
      --shadow: 0 18px 50px rgba(36, 44, 80, .08);
      --shadow-hover: 0 22px 60px rgba(36, 44, 80, .14);
      --radius: 20px;
      --max: 1180px;
    }

    [data-theme="dark"] {
      --bg: #0e1320;
      --surface: rgba(24,31,48,.86);
      --surface-solid: #181f30;
      --text: #edf2ff;
      --muted: #9ba7bd;
      --line: #2b354b;
      --primary: #8b83ff;
      --primary-2: #b084ff;
      --accent: #2dd4bf;
      --shadow: 0 18px 50px rgba(0,0,0,.22);
      --shadow-hover: 0 22px 60px rgba(0,0,0,.32);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 8%, rgba(99,91,255,.10), transparent 28rem),
        radial-gradient(circle at 92% 12%, rgba(20,184,166,.08), transparent 25rem),
        var(--bg);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      transition: background .2s ease, color .2s ease;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .container { width: min(var(--max), calc(100% - 40px)); margin: auto; }
    .muted { color: var(--muted); }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--primary); font-size: .78rem; font-weight: 800;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .eyebrow::before {
      content: ""; width: 24px; height: 2px; border-radius: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .topbar {
      position: fixed; inset: 0 0 auto; z-index: 20;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    }
    .nav {
      height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 850; white-space: nowrap; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
      color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 8px 20px rgba(99,91,255,.28);
    }
    .nav-links { display: flex; align-items: center; gap: 22px; }
    .nav-links a { color: var(--muted); font-size: .9rem; transition: color .2s; }
    .nav-links a:hover { color: var(--primary); }
    .nav-actions { display: flex; gap: 8px; }
    .icon-btn, .btn {
      border: 1px solid var(--line); cursor: pointer; color: var(--text);
      background: var(--surface); border-radius: 11px; transition: .2s ease;
    }
    .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; }
    .icon-btn:hover, .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; font-weight: 700; }
    .btn-primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--primary), var(--primary-2)); }
    .btn-ghost { background: var(--surface); }

    main { padding-top: 70px; }
    section { padding: 92px 0 0; scroll-margin-top: 76px; }
    .hero { min-height: 650px; display: grid; align-items: center; padding-top: 56px; }
    .hero-grid { display: grid; grid-template-columns: 1.25fr .75fr; align-items: center; gap: 70px; }
    h1 { margin: 16px 0 18px; font-size: clamp(3rem, 7vw, 6.2rem); line-height: .98; letter-spacing: -.07em; }
    .gradient-text { background: linear-gradient(110deg, var(--primary), var(--primary-2) 55%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero-copy { max-width: 650px; font-size: 1.1rem; color: var(--muted); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 25px; }
    .chip, .tag {
      display: inline-flex; padding: 6px 11px; border-radius: 999px;
      color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent);
      font-size: .82rem; font-weight: 700;
    }
    .hero-card {
      position: relative; padding: 30px; border: 1px solid var(--line);
      background: var(--surface); backdrop-filter: blur(16px); border-radius: 28px;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .hero-card::after {
      content: ""; position: absolute; width: 180px; height: 180px; right: -80px; top: -80px;
      border-radius: 50%; background: var(--accent); opacity: .12;
    }
    .avatar { width: 92px; height: 92px; display: grid; place-items: center; border-radius: 28px; color: #fff; font-size: 2rem; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--accent)); margin-bottom: 25px; }
    .hero-card h2 { margin: 0 0 8px; font-size: 1.45rem; }
    .contact-list { display: grid; gap: 13px; margin-top: 25px; }
    .contact-item { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .92rem; }
    .contact-item b { color: var(--text); font-weight: 650; }

    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    h2.section-title { margin: 7px 0 0; font-size: clamp(1.8rem, 3vw, 2.6rem); letter-spacing: -.04em; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
      box-shadow: var(--shadow); padding: 24px; transition: .22s ease;
    }
    .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }
    .metric { font-size: 2.25rem; font-weight: 900; line-height: 1; color: var(--primary); }
    .metric-label { margin-top: 10px; font-weight: 800; }
    .metric-desc { color: var(--muted); font-size: .86rem; margin-top: 5px; }

    .tabs {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 5px;
      width: fit-content; border-radius: 14px; background: color-mix(in srgb, var(--line) 48%, transparent);
      margin-bottom: 20px;
    }
    .tab {
      border: 0; color: var(--muted); background: transparent; cursor: pointer;
      padding: 9px 16px; border-radius: 10px; font-weight: 750;
    }
    .tab[aria-selected="true"] { color: var(--primary); background: var(--surface-solid); box-shadow: 0 4px 14px rgba(30,40,80,.08); }
    .tab-panel[hidden] { display: none; }
    .timeline { display: grid; gap: 16px; }
    .experience { display: grid; grid-template-columns: 180px 1fr; gap: 24px; }
    .period { color: var(--primary); font-size: .9rem; font-weight: 800; }
    .experience h3, .project h3 { margin: 0 0 5px; font-size: 1.2rem; }
    .experience ul { margin: 15px 0 0; padding-left: 20px; color: var(--muted); }
    .experience li + li { margin-top: 7px; }

    .project { min-height: 250px; display: flex; flex-direction: column; overflow: hidden; }
    .project-image {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: var(--surface-solid);
      border-radius: 14px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
    }
    .project-top { display: flex; justify-content: space-between; gap: 14px; }
    .project p { color: var(--muted); margin: 13px 0; }
    .project .tags { margin-top: auto; display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); font-size: .76rem; }

    .skill-group h3 { margin: 0 0 15px; font-size: 1rem; }
    .skill-row { margin: 13px 0; }
    .skill-meta { display: flex; justify-content: space-between; font-size: .86rem; margin-bottom: 6px; }
    .skill-meta span:last-child { color: var(--muted); }
    .bar { height: 7px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--accent)); }

    .edu-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
    .edu-item { display: flex; gap: 16px; align-items: flex-start; }
    .edu-icon { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; border-radius: 13px; color: var(--primary); background: color-mix(in srgb, var(--primary) 12%, transparent); }
    .edu-item h3 { margin: 0 0 4px; }
    .edu-item p { color: var(--muted); margin: 4px 0; font-size: .9rem; }
    .list-clean { margin: 0; padding: 0; list-style: none; }
    .list-clean li { padding: 11px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
    .list-clean li:last-child { border-bottom: 0; }

    footer { margin-top: 100px; padding: 28px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
    .footer-inner { display: flex; justify-content: space-between; gap: 15px; }
    #backTop { position: fixed; right: 24px; bottom: 24px; z-index: 10; opacity: 0; pointer-events: none; transform: translateY(10px); }
    #backTop.show { opacity: 1; pointer-events: auto; transform: none; }
    .fade-in { animation: fadeIn .55s both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    @media (max-width: 900px) {
      .nav-links { display: none; }
      .hero-grid, .edu-grid { grid-template-columns: 1fr; gap: 35px; }
      .hero { min-height: auto; padding-top: 70px; }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 620px) {
      .container { width: min(100% - 28px, var(--max)); }
      section { padding-top: 65px; }
      .nav { height: 62px; }
      main { padding-top: 62px; }
      .brand span { display: none; }
      h1 { font-size: 3.5rem; }
      .hero-card { padding: 22px; }
      .grid-4, .grid-3 { grid-template-columns: 1fr; }
      .experience { grid-template-columns: 1fr; gap: 3px; }
      .section-head { display: block; }
      .section-head .muted { margin-top: 8px; }
      .footer-inner { display: block; }
    }

    @media print {
      :root { --bg: #fff; --surface: #fff; --surface-solid: #fff; --text: #111827; --muted: #4b5563; --line: #d1d5db; }
      body { background: #fff; font-size: 11pt; }
      .topbar, .nav-actions, #backTop, .hero-actions, .tabs { display: none !important; }
      main { padding-top: 0; }
      section, .hero { padding-top: 28px; min-height: 0; }
      .hero-grid, .edu-grid, .grid-3, .grid-4 { gap: 12px; }
      .card, .hero-card { box-shadow: none; break-inside: avoid; }
      .hero-card { border: 1px solid #ddd; }
      a { text-decoration: none; }
      footer { margin-top: 35px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav container" aria-label="主导航">

  <main id="top"></main>

  <button id="backTop" class="icon-btn" aria-label="返回顶部">↑</button>

  <script>
    const resume = {

      phone: "13309050845",

      linkedin: "",
      location: "",
      keywords: ["用户需求洞察", "客户服务", "业务运营", "项目推进", "数据整理", "沟通协调"],
      highlights: [
        { value: "30%+", label: "协作效率提升", desc: "通过优化流程与沟通机制，推动日常业务处理效率提升" },
        { value: "20%+", label: "项目效果优化", desc: "基于数据与用户反馈提出优化方案，助力项目效果提升" },
        { value: "全流程", label: "项目执行能力", desc: "覆盖需求确认、执行推进、过程协调与结果反馈" },
        { value: "多场景", label: "岗位适配能力", desc: "可适应运营、咨询、客服及综合管理等岗位方向" }
      ],
      experience: {
        work: [
          {
            org: "业务运营 / 客户服务经历",
            role: "运营与客户服务",

              "与内部团队及外部合作方保持高效沟通，协调资源解决突发问题，保障业务稳定运行。"
            ]
          },
          {
            org: "客户服务 / 综合事务经历",
            role: "客户服务与业务支持",
            time: "工作经历信息待补充",
            points: [
              "负责具体业务及客户服务工作，建立良好的客户关系，通过专业服务提升客户满意度及长期合作意愿。",
              "快速学习公司业务流程及产品知识，能够独立处理日常事务并完成工作目标。",
              "整理分析客户反馈及业务需求，协助团队优化服务流程，提高客户响应效率。",
              "积极参与团队协作，承担重点任务推进工作，在有限时间内完成多项工作交付。",
              "凭借高度责任心和执行力，多次获得团队认可，成为团队中稳定可靠的执行力量。"
            ]
          }
        ],
        campus: [
          {
            org: "校园组织 / 社会实践",
            role: "活动策划与组织执行",
            time: "时间信息待补充",
            points: [
              "积极参与团队活动及组织管理工作，负责活动策划、人员协调及现场执行。",
              "与团队成员保持高效沟通，推动活动流程优化，提高组织运行效率。",
              "培养较强的领导能力、团队协作能力和综合事务处理能力。",
              "在实践过程中不断提升沟通表达、问题分析及资源协调能力。"
            ]
          }
        ]
      },
      projects: [
        {
          name: "业务流程与服务体验优化项目",
          role: "项目负责人 / 核心成员",
          time: "项目时间待补充",
          result: "推动流程优化与服务体验提升，项目效果提升 20%+（具体成果数据待补充）",
          description: "围绕客户需求与业务目标，参与项目规划、任务执行及过程协调，收集整理数据与用户反馈，分析问题并提出优化方案。",
          tags: ["项目推进", "用户反馈", "流程优化", "数据分析"]
        }
      ],
      skills: [
        { group: "沟通与服务", items: [["沟通协调", 92], ["客户服务", 90], ["需求理解", 88]] },
        { group: "执行与管理", items: [["项目执行", 90], ["任务拆解", 88], ["资源协调", 86]] },
        { group: "办公与分析", items: [["Microsoft Office", 88], ["信息整理", 90], ["报告撰写", 84]] },
        { group: "综合素质", items: [["学习适应", 92], ["问题解决", 88], ["团队协作", 90]] }
      ],
      education: [],
      certificates: [],
      strengths: [
        ["沟通表达能力强", "善于倾听与理解需求，能够快速建立信任关系，高效推进沟通协作。"],
        ["服务意识优秀", "坚持以用户需求为核心，注重细节与体验，能够持续提升服务质量。"],
        ["执行能力突出", "工作认真负责，目标感强，能够快速响应任务并高质量完成交付。"],
        ["适应应变能力强", "面对变化环境能够快速学习调整，积极解决问题并推动工作开展。"],

      ]
    };

    const $ = (s, root = document) => root.querySelector(s);
    const el = (tag, cls, html = "") => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (html) node.innerHTML = html;
      return node;
    };
    const email = () => resume.emailParts.join("@");
    const safe = value => String(value || "").replace(/[&<>"']/g, s => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[s]));

    function renderHero() {
      const section = el("section", "hero", `
        <div class="container hero-grid">
          <div class="fade-in">
            <span class="eyebrow">Personal Profile</span>
            <h1>${safe(resume.name)}<br><span class="gradient-text">让每一次协作<br>都产生价值</span></h1>
            <p class="hero-copy">${safe(resume.summary)}</p>
            <div class="chips">${resume.keywords.map(x => `<span class="chip">${safe(x)}</span>`).join("")}</div>
            <div class="hero-actions">
              <a class="btn btn-primary" href="#experience">查看经历 →</a>
              <button class="btn btn-ghost" id="copyEmail">复制邮箱</button>
            </div>
          </div>
          <aside class="hero-card fade-in">
            <div class="avatar">曾</div>
            <h2>${safe(resume.name)}</h2>
            <div class="muted">${safe(resume.title)}</div>
            <div class="contact-list">
              <a class="contact-item" href="tel:${resume.phone}">☎ <b>${safe(resume.phone)}</b></a>
              <div class="contact-item">✉ <b id="emailText"></b></div>
              ${resume.location ? `<div class="contact-item">⌖ <b>${safe(resume.location)}</b></div>` : ""}
            </div>
          </aside>
        </div>
      `);
      $("#top").append(section);
      $("#emailText").textContent = email();
      $("#copyEmail").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(email());
          $("#copyEmail").textContent = "已复制 ✓";
          setTimeout(() => $("#copyEmail").textContent = "复制邮箱", 1600);
        } catch { window.location.href = `mailto:${email()}`; }
      });
    }

    function renderHighlights() {
      $("#top").insertAdjacentHTML("beforeend", `
        <section id="highlights">
          <div class="container">
            <div class="section-head"><div><span class="eyebrow">Highlights</span><h2 class="section-title">关键亮点</h2></div><span class="muted">用结果证明能力，用行动创造价值</span></div>
            <div class="grid-4">${resume.highlights.map(x => `<article class="card"><div class="metric">${safe(x.value)}</div><div class="metric-label">${safe(x.label)}</div><div class="metric-desc">${safe(x.desc)}</div></article>`).join("")}</div>
          </div>
        </section>`);
    }

    function experiencePanel(key, items) {
      return `<div class="tab-panel" id="panel-${key}" role="tabpanel">
        <div class="timeline">${items.map(item => `
          <article class="card experience">
            <div class="period">${safe(item.time)}</div>
            <div><h3>${safe(item.role)}</h3><div class="muted">${safe(item.org)}</div>
            <ul>${item.points.map(p => `<li>${safe(p)}</li>`).join("")}</ul></div>
          </article>`).join("")}</div>
      </div>`;
    }

    function renderExperience() {
      const tabs = Object.keys(resume.experience).filter(k => resume.experience[k]?.length);
      if (!tabs.length) return;
      const names = { work: "工作经历", internship: "实习经历", campus: "校园 / 社会实践" };
      $("#top").insertAdjacentHTML("beforeend", `
        <section id="experience">
          <div class="container">
            <div class="section-head"><div><span class="eyebrow">Experience</span><h2 class="section-title">经历沉淀</h2></div><span class="muted">从需求出发，推动事情落地</span></div>
            <div class="tabs" role="tablist">${tabs.map((k,i) => `<button class="tab" role="tab" id="tab-${k}" aria-controls="panel-${k}" aria-selected="${i===0}">${names[k]}</button>`).join("")}</div>
            ${tabs.map(k => experiencePanel(k, resume.experience[k])).join("")}
          </div>
        </section>`);
      bindTabs("#experience .tabs");
      $(`#panel-${tabs[0]}`).hidden = false;
      tabs.slice(1).forEach(k => $(`#panel-${k}`).hidden = true);
    }

    function renderProjects() {
      if (!resume.projects?.length) return;
      $("#top").insertAdjacentHTML("beforeend", `
        <section id="projects">
          <div class="container">
            <div class="section-head"><div><span class="eyebrow">Projects</span><h2 class="section-title">项目实践</h2></div><span class="muted">把想法变成可交付的成果</span></div>
            <div class="grid-3">${resume.projects.map((p, index) => `<article class="card project">
              ${index === 0 ? `
<img class="project-image" 
     src="./img.jpg" 
     alt="我的作品集第一张作品">
` : ""}
              <div class="project-top"><span class="eyebrow">${safe(p.role)}</span></div>
              <h3>${safe(p.name)}</h3><small class="muted">${safe(p.time)}</small>
              <p>${safe(p.description)}</p><strong>${safe(p.result)}</strong>
              <div class="tags">${p.tags.map(t => `<span class="tag">${safe(t)}</span>`).join("")}</div>
            </article>`).join("")}</div>
          </div>
        </section>`);
    }

    function renderSkills() {
      $("#top").insertAdjacentHTML("beforeend", `
        <section id="skills">
          <div class="container">
            <div class="section-head"><div><span class="eyebrow">Capabilities</span><h2 class="section-title">技能矩阵</h2></div><span class="muted">持续学习，保持可迁移的专业能力</span></div>
            <div class="grid-4">${resume.skills.map(g => `<article class="card skill-group"><h3>${safe(g.group)}</h3>${g.items.map(([n,v]) => `<div class="skill-row"><div class="skill-meta"><span>${safe(n)}</span><span>${v}%</span></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join("")}</article>`).join("")}</div>
          </div>
        </section>`);
    }

    function renderEducation() {
      if (!resume.education?.length && !resume.certificates?.length) return;
      $("#top").insertAdjacentHTML("beforeend", `
        <section id="education">
          <div class="container">
            <div class="section-head"><div><span class="eyebrow">Education</span><h2 class="section-title">教育与证书</h2></div></div>
            <div class="edu-grid">
              ${resume.education?.length ? `<div class="card">${resume.education.map(e => `<div class="edu-item"><div class="edu-icon">◆</div><div><h3>${safe(e.school)}</h3><p>${safe(e.major)} · ${safe(e.degree)}</p><p>${safe(e.time)}</p></div></div>`).join("")}</div>` : ""}
              ${resume.certificates?.length ? `<div class="card"><ul class="list-clean">${resume.certificates.map(c => `<li>${safe(c.name)} <small>｜${safe(c.time)}</small></li>`).join("")}</ul></div>` : ""}
            </div>
          </div>
        </section>`);
    }

    function renderStrengths() {
      $("#top").insertAdjacentHTML("beforeend", `
        <section id="strengths">
          <div class="container">
            <div class="section-head"><div><span class="eyebrow">Strengths</span><h2 class="section-title">个人优势</h2></div></div>
            <div class="grid-3">${resume.strengths.map(([title,desc]) => `<article class="card"><h3>${safe(title)}</h3><p class="muted">${safe(desc)}</p></article>`).join("")}</div>
          </div>
        </section>`);
    }

    function bindTabs(selector) {
      const tablist = $(selector), tabs = [...tablist.querySelectorAll('[role="tab"]')];
      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => activate(index));
        tab.addEventListener("keydown", e => {
          if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
          e.preventDefault();
          activate((index + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length);
          tabs[(index + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length].focus();
        });
      });
      function activate(index) {
        tabs.forEach((t,i) => {
          const panel = document.getElementById(t.getAttribute("aria-controls"));
          t.setAttribute("aria-selected", i === index);
          panel.hidden = i !== index;
          if (i === index) panel.classList.add("fade-in");
        });
      }
    }

    renderHero();
    renderHighlights();
    renderExperience();
    renderProjects();
    renderSkills();
    renderEducation();
    renderStrengths();

    $("#year").textContent = new Date().getFullYear();
    $("#printBtn").addEventListener("click", () => window.print());

    const savedTheme = localStorage.getItem("resume-theme");
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    function updateThemeIcon() {
      $("#themeBtn").textContent = document.documentElement.dataset.theme === "dark" ? "☀" : "☾";
    }
    updateThemeIcon();
    $("#themeBtn").addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("resume-theme", next);
      updateThemeIcon();
    });

    const backTop = $("#backTop");
    window.addEventListener("scroll", () => backTop.classList.toggle("show", scrollY > 500), { passive: true });
    backTop.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
  </script>
</body>
</html>
